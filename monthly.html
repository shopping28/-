<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Challenge | SHOPPING28</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* (Same Premium Purple CSS) */
        :root { --bg-dark: #020617; --card-bg: #0f172a; --primary: #9333ea; --secondary: #db2777; --neon-purple: #d946ef; --neon-gold: #facc15; --neon-red: #ef4444; --neon-blue: #00f2ff; --neon-green: #10b981; --text-main: #f8fafc; --text-muted: #94a3b8; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Outfit', sans-serif; margin: 0; padding: 20px; padding-bottom: 100px; overflow-x: hidden; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        .back-btn { background: rgba(255,255,255,0.05); width: 40px; height: 40px; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,0.1); }
        .page-title { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }
        .credit-card { background: linear-gradient(135deg, var(--primary), var(--secondary)); padding: 25px; border-radius: 24px; text-align: center; box-shadow: 0 10px 40px -10px rgba(147, 51, 234, 0.5); position: relative; overflow: hidden; margin-bottom: 30px; }
        .cr-val { font-size: 3.5rem; font-weight: 800; margin: 5px 0 15px; }
        .btn-group { display: flex; gap: 12px; }
        .cr-btn { flex: 1; padding: 12px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; }
        .btn-buy { background: #fff; color: var(--primary); }
        .btn-redeem { background: rgba(0,0,0,0.3); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .status-box { padding: 20px; border-radius: 20px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); display: none; }
        .active-box { background: radial-gradient(circle at top right, rgba(217, 70, 239, 0.15), rgba(2, 6, 23, 0.8)); border-color: var(--neon-purple); }
        .pending-box { background: radial-gradient(circle at top right, rgba(250, 204, 21, 0.15), rgba(2, 6, 23, 0.8)); border-color: var(--neon-gold); }
        .rejected-box { background: radial-gradient(circle at top right, rgba(239, 68, 68, 0.15), rgba(2, 6, 23, 0.8)); border-color: var(--neon-red); }
        .review-box { background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), rgba(2, 6, 23, 0.8)); border-color: var(--neon-blue); }
        .levels-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .level-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 18px; position: relative; overflow: hidden; }
        .lc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .lvl-pill { background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
        .lvl-reward { color: var(--neon-gold); font-size: 1.3rem; font-weight: 800; }
        .lc-target span { color: var(--neon-purple); font-weight: 700; }
        .apply-btn { width: 100%; padding: 12px 20px; border: none; border-radius: 12px; background: linear-gradient(90deg, #9333ea, #db2777); color: #fff; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .apply-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: #1e293b; width: 100%; max-width: 400px; padding: 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .pkg-item { background: #0f172a; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .pkg-item.selected { border-color: var(--neon-purple); background: rgba(219, 39, 119, 0.1); }
        .inp { width: 100%; padding: 14px; background: #020617; border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 12px; margin: 8px 0; box-sizing: border-box; }
        .modal-act { background: #fff; color: #000; width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; border: none; margin-top: 15px; cursor: pointer; }
        .wallet-box { background: #020617; padding: 12px; border-radius: 10px; border: 1px dashed rgba(255,255,255,0.2); font-family: monospace; color: var(--neon-purple); font-size: 0.85rem; word-break: break-all; margin-bottom: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <div class="page-title">Monthly Challenge</div>
        <div style="width:40px;"></div>
    </div>

    <div class="credit-card">
        <div class="cr-label">Your Balance</div>
        <div class="cr-val" id="userCredits">0</div>
        <div class="btn-group">
            <button class="cr-btn btn-buy" onclick="openBuyModal()"><i class="fas fa-plus"></i> Buy Credits</button>
            <button class="cr-btn btn-redeem" onclick="openRedeemModal()"><i class="fas fa-gift"></i> Redeem</button>
        </div>
    </div>

    <!-- Statuses -->
    <div id="rejectedArea" class="status-box rejected-box">
        <h4 style="margin:0; color:var(--neon-red)"><i class="fas fa-times-circle"></i> Rejected</h4>
        <p style="font-size:0.9rem; opacity:0.8; margin-top:5px;">Reason: <span id="rejectReason">...</span></p>
        <button onclick="clearRejection()" style="background:rgba(0,0,0,0.3); color:#fff; padding:8px 16px; border-radius:8px; border:none; cursor:pointer; margin-top:10px;">Dismiss</button>
    </div>

    <div id="pendingArea" class="status-box pending-box">
        <h4 style="margin:0; color:var(--neon-gold)"><i class="fas fa-clock"></i> Pending Approval</h4>
        <p style="font-size:0.9rem; opacity:0.8; margin-top:5px;">Wait for Admin to approve <b><span id="pendingLevel"></span></b>.</p>
    </div>

    <div id="reviewArea" class="status-box review-box">
        <h4 style="margin:0; color:var(--neon-blue)"><i class="fas fa-search-dollar"></i> Reward Under Review</h4>
        <p style="font-size:0.9rem; opacity:0.8; margin-top:5px;">Target submitted for review. Admin is checking.</p>
    </div>

    <div id="activeStatusArea" class="status-box active-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h4 style="margin:0; color:var(--neon-purple)">Active: <span id="activeLvlName">...</span></h4>
            <div style="font-weight:700;"><span id="activeProgress">0</span> / <span id="activeTarget">0</span></div>
        </div>
        <div style="background:rgba(255,255,255,0.1); height:10px; border-radius:10px; margin:15px 0;">
            <div id="progressBar" style="height:100%; background:var(--neon-purple); width:0%; border-radius:10px;"></div>
        </div>
        <div style="background:rgba(0,0,0,0.4); padding:10px; border-radius:10px; text-align:center;">
            <span style="font-size:0.7rem; color:#94a3b8; text-transform:uppercase;">Time Remaining</span>
            <div id="timerDisplay" style="font-size:1.2rem; font-weight:800; font-family:monospace;">Wait...</div>
        </div>
        <button id="submitReviewBtn" onclick="submitForReview()" style="display:none; width:100%; margin-top:15px; background:var(--neon-gold); color:#000; padding:14px; border-radius:12px; font-weight:800; border:none; cursor:pointer;">SUBMIT FOR REVIEW <i class="fas fa-paper-plane"></i></button>
    </div>

    <div class="levels-grid" id="levelsContainer">
        <div style="text-align:center; color:#666; padding:20px;">Loading Challenges...</div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="buyModal">
        <div class="modal-box">
            <h3>Select Package</h3><div id="pkgList" class="pkg-list">Loading...</div>
            <div id="paymentSection" style="display:none; text-align:left; border-top:1px solid rgba(255,255,255,0.1); padding-top:15px;">
                <p style="font-size:0.85rem; color:#aaa; margin:5px 0;">Send <b id="payAmount" style="color:var(--neon-purple)"></b> USDT to:</p>
                <div class="wallet-box" onclick="copyAddr()" id="adminAddrDisplay">...</div>
                <input type="text" id="senderAddr" class="inp" placeholder="Sender Address"><input type="text" id="trxId" class="inp" placeholder="Transaction Hash">
                <button class="modal-act" onclick="submitOrder()">Submit Payment</button>
            </div>
            <button onclick="closeModals()" style="background:transparent; color:#94a3b8; border:none; margin-top:10px;">Close</button>
        </div>
    </div>
    <div class="modal-overlay" id="redeemModal"><div class="modal-box"><h3>Redeem Code</h3><input type="text" id="redeemCodeInput" class="inp" placeholder="Enter Code"><button class="modal-act" onclick="submitRedeem()">Redeem Now</button><button onclick="closeModals()" style="background:transparent; color:#94a3b8; border:none; margin-top:10px;">Close</button></div></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>

            authDomain: "shopping28-84906.firebaseapp.com",
            databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com",

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(); const auth = firebase.auth();
        let currentUser=null, myCredits=0, adminWallet="", currentActiveTarget=null, pendingRequest=null, reviewRequest=null, selectedPackage=null, timerInterval=null;

        auth.onAuthStateChanged(user => { if(user) { currentUser=user; loadUserData(); loadAdminData(); checkRequests(); loadDynamicLevels(); } else { window.location.href = 'login_register.html'; } });
        
        function loadAdminData() { db.ref('settings/credits/wallet').on('value', snap => adminWallet = snap.val() || "Loading..."); }
        
        function loadUserData() {
            db.ref('users/' + currentUser.uid).on('value', snap => {
                const u = snap.val(); myCredits = u.credits || 0;
                document.getElementById('userCredits').innerText = myCredits; 
                currentActiveTarget = u.active_target || null;
                if(u.last_rejection && !u.rejection_seen) { document.getElementById('rejectedArea').style.display = 'block'; document.getElementById('rejectReason').innerText = u.last_rejection; document.getElementById('pendingArea').style.display = 'none'; }
                else { document.getElementById('rejectedArea').style.display = 'none'; }
                checkActiveProgress(u);
            });
        }

        function checkRequests() {
            db.ref('target_requests').orderByChild('uid').equalTo(currentUser.uid).on('value', snap => {
                pendingRequest = null; document.getElementById('pendingArea').style.display = 'none';
                snap.forEach(child => { const req = child.val
