<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #020617; --card-bg: #0f172a; --primary: #9333ea; --text-main: #f8fafc; }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Outfit', sans-serif; margin: 0; padding: 20px; padding-bottom: 100px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        .back-btn { background: rgba(255,255,255,0.05); width: 40px; height: 40px; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,0.1); }
        
        .credit-card { background: linear-gradient(135deg, #9333ea, #db2777); padding: 25px; border-radius: 24px; text-align: center; margin-bottom: 30px; }
        .cr-val { font-size: 3rem; font-weight: 800; margin: 5px 0 15px; }
        .btn-group { display: flex; gap: 10px; }
        .cr-btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
        .btn-buy { background: #fff; color: #9333ea; }
        .btn-redeem { background: rgba(0,0,0,0.3); color: #fff; border: 1px solid rgba(255,255,255,0.2); }

        .level-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 18px; margin-bottom: 15px; }
        .apply-btn { width: 100%; padding: 12px; border: none; border-radius: 12px; background: linear-gradient(90deg, #9333ea, #db2777); color: #fff; font-weight: 700; cursor: pointer; margin-top: 10px; }

        /* MODAL STYLES (Identical to Weekly for consistency) */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
        .modal-box { background: #151c2c; width: 100%; max-width: 380px; padding: 30px 20px; border-radius: 24px; text-align: center; border: 1px solid #2a3441; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .modal-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 25px; color: #fff; }
        .info-box { background: #000; border: 1px solid #1f2937; padding: 15px; border-radius: 10px; margin-bottom: 15px; color: #fff; font-weight: 600; font-size: 1rem; }
        .wallet-copy { background: #000; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-family: monospace; color: #fff; word-break: break-all; font-size: 0.85rem; cursor: pointer; }
        .inp { width: 100%; padding: 16px; background: #0b101a; border: 1px solid #2a3441; color: #fff; border-radius: 12px; margin-bottom: 12px; box-sizing: border-box; font-size: 1rem; outline: none; }
        .inp:focus { border-color: #9333ea; }
        .modal-act { background: #ffffff; color: #000; width: 100%; padding: 16px; border-radius: 30px; font-weight: 800; border: none; margin-top: 10px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .modal-act:active { transform: scale(0.98); opacity: 0.9; }
        .close-txt { margin-top: 15px; color: #94a3b8; cursor: pointer; font-size: 0.9rem; }
        .pkg-item { background: #0b101a; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #2a3441; cursor: pointer; display: flex; justify-content: space-between; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <div class="page-title">Monthly Challenge</div>
        <div style="width:40px;"></div>
    </div>

    <div class="credit-card">
        <div style="font-size:0.9rem; opacity:0.8;">Your Balance</div>
        <div class="cr-val" id="userCredits">0</div>
        <div class="btn-group">
            <button class="cr-btn btn-buy" onclick="openBuyModal()">Buy Credits</button>
            <button class="cr-btn btn-redeem" onclick="openRedeemModal()">Redeem</button>
        </div>
    </div>

    <div id="levelsContainer">Loading...</div>

    <!-- Modals -->
    <div class="modal-overlay" id="buyModal">
        <div class="modal-box">
            <div class="modal-title">Buy Credits</div>
            <div id="pkgList" style="text-align:left;">Loading...</div>
            <div id="paymentSection" style="display:none;">
                <div class="info-box" id="pkgInfoDisplay">...</div>
                <div class="wallet-copy" onclick="copyAddr()" id="adminAddrDisplay">...</div>
                <input type="text" id="senderAddr" class="inp" placeholder="Sender Address">
                <input type="text" id="trxId" class="inp" placeholder="TrxID">
                <button class="modal-act" onclick="submitOrder()">Submit</button>
            </div>
            <div class="close-txt" onclick="closeModals()">Close</div>
        </div>
    </div>

    <div class="modal-overlay" id="redeemModal">
        <div class="modal-box">
            <div class="modal-title">Redeem</div>
            <input type="text" id="redeemCodeInput" class="inp" placeholder="Enter Code">
            <button class="modal-act" onclick="submitRedeem()">Redeem</button>
            <div class="close-txt" onclick="closeModals()">Close</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE", authDomain: "shopping28-84906.firebaseapp.com", databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com", projectId: "shopping28-84906", storageBucket: "shopping28-84906.firebasestorage.app", messagingSenderId: "252107906792", appId: "1:252107906792:web:d39b0be25c88e07015b35d" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(); const auth = firebase.auth();
        let currentUser=null, myCredits=0, adminWallet="", selectedPackage=null;

        auth.onAuthStateChanged(user => { if(user){ currentUser=user; loadUserData(); loadLevels(); loadAdminData(); } else window.location.href='login_register.html'; });

        function loadUserData(){ db.ref('users/'+currentUser.uid+'/credits').on('value',s=> document.getElementById('userCredits').innerText = s.val()||0); }
        function loadAdminData(){ db.ref('settings/credits/wallet').on('value',s=> adminWallet=s.val()); }

        function loadLevels() {
            db.ref('settings/targets/monthly').on('value', snap => {
                const c = document.getElementById('levelsContainer'); c.innerHTML="";
                if(!snap.exists()) return c.innerHTML="No levels.";
                let lvls=[]; snap.forEach(x=>lvls.push(x.val())); lvls.sort((a,b)=>a.level-b.level);
                lvls.forEach(l => {
                    c.innerHTML += `<div class="level-card"><h3>Level ${l.level}</h3><p>Target: ${l.target} Refs | Reward: $${l.reward}</p><button class="apply-btn" onclick="apply(${l.level},${l.cost})">Apply (${l.cost} Credits)</button></div>`;
                });
            });
        }

        // Logic Functions (Same as Weekly)
        function openBuyModal(){ document.getElementById('buyModal').style.display='flex'; document.getElementById('pkgList').style.display='block'; document.getElementById('paymentSection').style.display='none'; loadPackages(); }
        function openRedeemModal(){ document.getElementById('redeemModal').style.display='flex'; }
        function closeModals(){ document.getElementById('buyModal').style.display='none'; document.getElementById('redeemModal').style.display='none'; }

        function loadPackages(){
            const l = document.getElementById('pkgList'); l.innerHTML = "Loading...";
            db.ref('settings/credit_packages').once('value', snap => {
                l.innerHTML = "";
                snap.forEach(c => {
                    const p = c.val();
                    l.innerHTML += `<div class="pkg-item" onclick="selectPkg(${p.credits},${p.finalPrice})"><span>${p.credits} Credits</span><span>$${p.finalPrice}</span></div>`;
                });
            });
        }

        function selectPkg(c, p){ selectedPackage = {credits:c, price:p}; document.getElementById('pkgList').style.display='none'; document.getElementById('paymentSection').style.display='block'; document.getElementById('pkgInfoDisplay').innerText = `${c} Credits - $${p}`; document.getElementById('adminAddrDisplay').innerText = adminWallet; }
        function submitOrder(){ db.ref('credit_orders').push({uid:currentUser.uid, ...selectedPackage, sender:document.getElementById('senderAddr').value, trx:document.getElementById('trxId').value, status:'pending'}).then(()=>{alert("Order Submitted!"); closeModals();}); }
        function copyAddr() { navigator.clipboard.writeText(adminWallet); alert("Copied!"); }

        function submitRedeem() {
            const code = document.getElementById('redeemCodeInput').value.trim();
            if (!code) return alert("Enter Code");
            const btn = document.querySelector('#redeemModal .modal-act'); btn.innerText = "Checking..."; btn.disabled = true;
            db.ref('redeem_codes/' + code).transaction(data => {
                if (data) {
                    if (data.users_redeemed && data.users_redeemed[currentUser.uid]) return;
                    if (data.used_count >= data.limit) return;
                    data.used_count++;
                    if (!data.users_redeemed) data.users_redeemed = {};
                    data.users_redeemed[currentUser.uid] = true;
                }
                return data;
            }, (error, committed, snapshot) => {
                btn.innerText = "Redeem"; btn.disabled = false;
                if (!committed) { alert("Invalid or Used Code!"); } else {
                    const amt = snapshot.val().amount; db.ref('users/'+currentUser.uid+'/credits').transaction(c => (c||0)+amt); alert(`Success! ${amt} Credits Added.`); closeModals();
                }
            });
        }
    </script>
</body>
</html>
