<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quiz Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-deep: #050511; --primary: #7000ff; --accent: #00f0ff; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: var(--bg-deep); font-family: 'Poppins', sans-serif; color: white; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        /* UI Elements */
        .game-wrapper { width: 100%; max-width: 480px; padding: 20px; display: none; flex-direction: column; }
        .hud { display: flex; justify-content: space-between; padding: 15px; background: var(--glass); border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        
        .timer-box { text-align: center; margin-bottom: 30px; }
        .timer-ring { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--primary); margin: 0 auto; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-family: 'Orbitron'; box-shadow: 0 0 20px var(--primary); }
        
        .q-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; min-height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); font-size: 1.1rem; }
        .q-card.blur { filter: blur(8px); }

        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; opacity: 0; pointer-events: none; }
        .options.show { opacity: 1; pointer-events: all; }
        .btn-opt { padding: 15px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .btn-opt:active { transform: scale(0.95); }
        .btn-opt.correct { background: rgba(0, 255, 0, 0.3); border-color: lime; }
        .btn-opt.wrong { background: rgba(255, 0, 0, 0.3); border-color: red; }

        /* Overlays */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050511; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hidden { display: none !important; }
        .big-text { font-family: 'Orbitron'; font-size: 2.5rem; color: var(--accent); margin: 20px 0; }
        .status-badge { padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- 1. WAITING SCREEN -->
    <div id="waitScreen" class="overlay">
        <i class="fas fa-rocket" style="font-size:3rem; color:var(--primary)"></i>
        <h2 style="margin-top:20px;">GAME STARTS IN</h2>
        <div class="big-text" id="mainTimer">00:00:00</div>
        <div id="statusMsg" class="status-badge" style="background:rgba(255,0,0,0.2); color:red;">CHECKING STATUS...</div>
    </div>

    <!-- 2. GAME UI -->
    <div id="gameUI" class="game-wrapper">
        <div class="hud">
            <span><i class="fas fa-user"></i> <span id="uName">Player</span></span>
            <span>Q: <span id="qNum">1</span>/10</span>
        </div>
        <div class="timer-box">
            <div class="timer-ring" id="phaseTimer">10</div>
            <p id="phaseText" style="margin-top:10px; font-size:0.8rem; letter-spacing:2px;">READING</p>
        </div>
        <div class="q-card" id="qText">Loading Question...</div>
        <div class="options" id="optBox">
            <button class="btn-opt" onclick="ans('A')" id="btnA">A</button>
            <button class="btn-opt" onclick="ans('B')" id="btnB">B</button>
            <button class="btn-opt" onclick="ans('C')" id="btnC">C</button>
            <button class="btn-opt" onclick="ans('D')" id="btnD">D</button>
        </div>
    </div>

    <!-- 3. FINISH SCREEN -->
    <div id="finishScreen" class="overlay hidden">
        <h2>GAME OVER</h2>
        <p>Calculating Results...</p>
        <div id="leaderboard" style="margin-top:20px; width:80%;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get, update, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g",
            authDomain: "art-paid-work001.firebaseapp.com",
            databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com",
            projectId: "art-paid-work001",
            storageBucket: "art-paid-work001.firebasestorage.app",
            messagingSenderId: "524647364992",
            appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // --- STATE ---
        let userId = localStorage.getItem("game_uid");
        if(!userId) { userId = "u"+Math.floor(Math.random()*999999); localStorage.setItem("game_uid", userId); }
        document.getElementById("uName").innerText = userId.substring(0,6);

        let isActive = false;
        let config = { startTime: 0, resultTime: 0 };
        let myQOrder = [];
        let currentData = null;
        let answered = false;

        // --- INIT ---
        checkUser();

        function checkUser() {
            onValue(ref(db, `users/${userId}/account_status`), snap => {
                const st = snap.val();
                isActive = (st === 'active');
                const msg = document.getElementById("statusMsg");
                if(isActive) {
                    msg.style.color = "#00ff9d"; msg.style.background = "rgba(0,255,157,0.1)"; msg.innerText = "ACCOUNT ACTIVE - READY";
                } else {
                    msg.style.color = "#ff0055"; msg.style.background = "rgba(255,0,85,0.1)"; msg.innerText = "ACCOUNT INACTIVE - LOCKED";
                }
                // Load config ONLY after checking user status
                loadConfig();
            });
        }

        function loadConfig() {
            onValue(ref(db, 'game_config'), snap => {
                config = snap.val() || { startTime: 0 };
                // CRITICAL FIX: Pre-load questions BEFORE game starts
                if(isActive) assignQuestions(); 
                startGameLoop();
            });
        }

        // --- GAME LOOP ---
        function startGameLoop() {
            setInterval(() => {
                const now = Date.now();
                const diff = config.startTime - now;

                // 1. Waiting Phase
                if(diff > 0) {
                    formatTime(diff, "mainTimer");
                    document.getElementById("waitScreen").classList.remove("hidden");
                    document.getElementById("gameUI").style.display = "none";
                    return;
                }

                // 2. Game Phase
                if(isActive && now < config.resultTime) {
                    document.getElementById("waitScreen").classList.add("hidden");
                    document.getElementById("gameUI").style.display = "flex";
                    
                    const timePassed = now - config.startTime;
                    const qDuration = 5 * 60 * 1000; // 5 min per question
                    const qIdx = Math.floor(timePassed / qDuration) + 1;
                    
                    if(qIdx <= 10) {
                        handleQuestion(qIdx, timePassed % qDuration);
                    } else {
                        endGame();
                    }
                } 
                // 3. Result Phase
                else {
                    endGame();
                }

            }, 1000);
        }

        async function assignQuestions() {
            // Check if already assigned
            if(myQOrder.length > 0) return;
            
            const userRef = ref(db, `users_game_data/${userId}/q_order`);
            const snap = await get(userRef);
            
            if(snap.exists()) {
                myQOrder = snap.val();
            } else {
                // Fetch all questions and shuffle
                const qSnap = await get(ref(db, 'questions'));
                if(qSnap.exists()) {
                    let keys = Object.keys(qSnap.val());
                    // Shuffle
                    keys.sort(() => Math.random() - 0.5);
                    myQOrder = keys.slice(0, 10);
                    set(userRef, myQOrder);
                }
            }
        }

        let lastQIdx = 0;
        function handleQuestion(idx, timeInCycle) {
            // FIX: If questions not loaded yet, show loading but don't crash
            if(myQOrder.length === 0) {
                document.getElementById("qText").innerText = "Syncing with Server...";
                assignQuestions(); // Retry
                return;
            }

            // New Question Load
            if(lastQIdx !== idx) {
                lastQIdx = idx;
                answered = false;
                resetUI();
                const qId = myQOrder[idx-1];
                document.getElementById("qNum").innerText = idx;
                
                // Fetch Question Data
                get(ref(db, `questions/${qId}`)).then(s => {
                    if(s.exists()) {
                        currentData = s.val();
                        document.getElementById("qText").innerText = currentData.question;
                        ['A','B','C','D'].forEach(o => document.getElementById(`btn${o}`).innerText = currentData.options[o]);
                    }
                });
            }

            // Timer Logic (0-10s Read, 10-30s Answer)
            const timerEl = document.getElementById("phaseTimer");
            const optBox = document.getElementById("optBox");
            const qText = document.getElementById("qText");
            const phText = document.getElementById("phaseText");

            if(timeInCycle < 10000) { // Read
                timerEl.innerText = Math.ceil((10000 - timeInCycle)/1000);
                timerEl.style.borderColor = "#00ff9d";
                phText.innerText = "READING PHASE";
                optBox.classList.remove("show");
                qText.classList.remove("blur");
            } 
            else if (timeInCycle < 30000) { // Answer
                timerEl.innerText = Math.ceil((30000 - timeInCycle)/1000);
                timerEl.style.borderColor = "#ff0055";
                phText.innerText = "ANSWER NOW";
                optBox.classList.add("show");
                qText.classList.add("blur");
            } 
            else { // Wait for next
                timerEl.innerText = "--";
                phText.innerText = "WAIT FOR NEXT";
                optBox.classList.remove("show");
                qText.classList.remove("blur");
            }
        }

        window.ans = function(choice) {
            if(answered || !currentData) return;
            answered = true;
            
            const isCorrect = (choice === currentData.answer);
            const btn = document.getElementById(`btn${choice}`);
            btn.className = isCorrect ? "btn-opt correct" : "btn-opt wrong";

            // Save Answer
            update(ref(db, `users_game_data/${userId}/answers/${lastQIdx}`), {
                qId: currentData.id, choice: choice, correct: isCorrect
            });
            if(isCorrect) {
                get(ref(db, `users_game_data/${userId}/score`)).then(s => {
                    update(ref(db, `users_game_data/${userId}`), { score: (s.val()||0) + 1 });
                });
            }
        };

        function resetUI() {
            document.querySelectorAll(".btn-opt").forEach(b => b.className = "btn-opt");
            document.getElementById("qText").innerText = "Loading...";
        }

        function formatTime(ms, elId) {
            const h = Math.floor((ms % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((ms % (1000 * 60)) / 1000);
            document.getElementById(elId).innerText = `${h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
        }

        function endGame() {
            document.getElementById("gameUI").style.display = "none";
            document.getElementById("waitScreen").classList.add("hidden");
            document.getElementById("finishScreen").classList.remove("hidden");
            // Load Leaderboard Logic Here...
        }
    </script>
</body>
</html>
