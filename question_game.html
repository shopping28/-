<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* DARK PREMIUM THEME */
        body {
            background: #0f0c29; 
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            font-family: 'Poppins', sans-serif;
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* ICON ANIMATION */
        .game-icon {
            font-size: 4rem;
            background: -webkit-linear-gradient(#e0c3fc, #8ec5fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        h1 { margin: 0; font-size: 2rem; letter-spacing: 1px; }
        p { color: #aaa; margin-bottom: 40px; font-size: 0.9rem; }

        /* COUNTDOWN BOXES */
        .countdown {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }
        .time-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            min-width: 70px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .time-val {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00f260;
            display: block;
        }
        .time-label {
            font-size: 0.7rem;
            color: #ccc;
            text-transform: uppercase;
        }

        /* BACK BUTTON */
        .btn {
            padding: 12px 40px;
            border: 2px solid #e0c3fc;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
            background: rgba(255,255,255,0.05);
        }
        .btn:hover {
            background: #e0c3fc;
            color: #0f0c29;
            box-shadow: 0 0 20px #e0c3fc;
        }
        
        .lock-msg {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            border: 1px solid #e74c3c;
        }

    </style>
</head>
<body>

    <div class="game-icon">
        <i class="fas fa-gamepad"></i>
    </div>

    <h1>Question Game</h1>
    <p>Answer Questions & Win Real Money</p>

    <div class="lock-msg">
        <i class="fas fa-lock"></i> CURRENTLY LOCKED
    </div>

    <div class="countdown">
        <div class="time-box">
            <span class="time-val" id="days">21</span>
            <span class="time-label">Days</span>
        </div>
        <div class="time-box">
            <span class="time-val" id="hours">00</span>
            <span class="time-label">Hours</span>
        </div>
        <div class="time-box">
            <span class="time-val" id="minutes">00</span>
            <span class="time-label">Mins</span>
        </div>
        <div class="time-box">
            <span class="time-val" id="seconds">00</span>
            <span class="time-label">Secs</span>
        </div>
    </div>

    <a href="home.html" class="btn">Go Back</a>

    <script>
        // 1. Set the date we're counting down to (21 days from now)
        // Note: In a real app, you might fetch this date from Firebase Admin
        const now = new Date().getTime();
        const countDownDate = new Date(now + (21 * 24 * 60 * 60 * 1000)).getTime();

        // 2. Update the count down every 1 second
        const x = setInterval(function() {

            // Get today's date and time
            const currentTime = new Date().getTime();

            // Find the distance between now and the count down date
            const distance = countDownDate - currentTime;

            // Time calculations for days, hours, minutes and seconds
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Output the result in elements
            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            // If the count down is over, write some text 
            if (distance < 0) {
                clearInterval(x);
                document.querySelector(".countdown").innerHTML = "GAME IS LIVE!";
            }
        }, 1000);
    </script>

</body>
</html>
