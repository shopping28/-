<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quiz - Time Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg: #050511; --primary: #7000ff; --accent: #00f0ff; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: var(--bg); font-family: 'Poppins', sans-serif; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* HUD */
        .hud { position: fixed; top: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); z-index: 10; }
        .timer-big { font-family: 'Orbitron'; font-size: 2.5rem; color: var(--accent); margin: 20px 0; text-shadow: 0 0 15px var(--accent); }
        .phase-badge { padding: 5px 15px; border-radius: 20px; background: #333; font-size: 0.9rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }

        /* QUESTION AREA */
        .game-area { width: 90%; max-width: 500px; text-align: center; position: relative; }
        .q-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 25px; border-radius: 15px; min-height: 150px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-bottom: 20px; transition: 0.3s; }
        .q-card.blur { filter: blur(10px); opacity: 0.5; }

        /* OPTIONS */
        .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; display: none; }
        .opt-grid.show { display: grid; animation: popIn 0.3s; }
        .btn-opt { padding: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 10px; font-size: 1rem; cursor: pointer; }
        .btn-opt:active { transform: scale(0.95); }
        .btn-opt.correct { background: rgba(0, 255, 0, 0.3); border-color: lime; }
        .btn-opt.wrong { background: rgba(255, 0, 0, 0.3); border-color: red; }

        /* WAIT SCREEN */
        .wait-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hidden { display: none !important; }

        @keyframes popIn { from{transform: scale(0.8); opacity:0;} to{transform: scale(1); opacity:1;} }
    </style>
</head>
<body>

    <!-- 1. WAITING / LOADING SCREEN -->
    <div id="waitLayer" class="wait-overlay">
        <i class="fas fa-clock fa-spin" style="font-size:3rem; color:var(--primary); margin-bottom:20px;"></i>
        <h2 id="waitTitle">CONNECTING...</h2>
        <div class="timer-big" id="mainCountdown">00:00:00</div>
        <p id="waitSub">Please wait for the server</p>
    </div>

    <!-- 2. GAME UI -->
    <div id="gameLayer" class="game-area hidden">
        <div class="hud">
            <span><i class="fas fa-user"></i> <span id="uName">...</span></span>
            <span>Q: <span id="qIndex">1</span>/10</span>
        </div>

        <div class="timer-big" id="gameTimer">10</div>
        <div class="phase-badge" id="phaseText">READING PHASE</div>

        <div class="q-card" id="qBox">Loading Question...</div>

        <div class="opt-grid" id="optBox">
            <button class="btn-opt" onclick="submitAns('A')" id="btnA">Option A</button>
            <button class="btn-opt" onclick="submitAns('B')" id="btnB">Option B</button>
            <button class="btn-opt" onclick="submitAns('C')" id="btnC">Option C</button>
            <button class="btn-opt" onclick="submitAns('D')" id="btnD">Option D</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get, update, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", // আপনার কনফিগ ঠিক আছে
            authDomain: "art-paid-work001.firebaseapp.com",
            databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com",
            projectId: "art-paid-work001",
            storageBucket: "art-paid-work001.firebasestorage.app",
            messagingSenderId: "524647364992",
            appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- SETTINGS ---
        let userId = localStorage.getItem("game_uid");
        if(!userId) { userId = "u"+Math.floor(Math.random()*999999); localStorage.setItem("game_uid", userId); }
        document.getElementById("uName").innerText = userId.substring(0,6);

        // 5 Minutes Cycle Logic
        const CYCLE_MS = 5 * 60 * 1000; // 5 Minutes
        const READ_MS = 10 * 1000;      // 10 Seconds
        const ANS_MS = 30 * 1000;       // Ends at 30 Seconds (Duration 20s)
        
        let config = { startTime: 0, resultTime: 0 };
        let myQuestions = []; 
        let currentQData = null;
        let isAnswered = false;

        // --- STARTUP ---
        // 1. Load Config -> 2. Load Questions -> 3. Start Loop
        const waitTitle = document.getElementById("waitTitle");
        const waitSub = document.getElementById("waitSub");

        onValue(ref(db, 'game_config'), (snap) => {
            config = snap.val();
            if(!config) return;
            
            // Check if user is active
            get(ref(db, `users/${userId}/account_status`)).then(uSnap => {
                if(uSnap.val() !== 'active') {
                    waitTitle.innerText = "ACCOUNT LOCKED";
                    waitTitle.style.color = "red";
                    waitSub.innerText = "Contact Admin to Activate";
                } else {
                    prepareQuestions();
                }
            });
        });

        async function prepareQuestions() {
            // Check if questions already assigned
            const qOrderRef = ref(db, `users_game_data/${userId}/q_order`);
            const snap = await get(qOrderRef);

            if(snap.exists()) {
                myQuestions = snap.val();
                startGameLoop();
            } else {
                waitSub.innerText = "Assigning Questions...";
                // Fetch ALL questions from DB
                const allQSnap = await get(ref(db, 'questions'));
                if(allQSnap.exists()) {
                    let allKeys = Object.keys(allQSnap.val());
                    // Shuffle Array
                    allKeys.sort(() => Math.random() - 0.5);
                    // Take first 10
                    myQuestions = allKeys.slice(0, 10);
                    // Save to DB
                    await set(qOrderRef, myQuestions);
                    startGameLoop();
                } else {
                    waitTitle.innerText = "NO QUESTIONS FOUND";
                    waitSub.innerText = "Admin needs to add questions.";
                }
            }
        }

        function startGameLoop() {
            setInterval(() => {
                const now = Date.now();
                const start = config.startTime;

                // A. BEFORE GAME STARTS
                if (now < start) {
                    showWaitScreen("GAME STARTS IN", start - now, "Get Ready...");
                    return;
                }

                // B. GAME IS RUNNING
                const timePassed = now - start;
                const totalGameTime = 10 * CYCLE_MS; // 50 mins total

                if (timePassed < totalGameTime) {
                    document.getElementById("waitLayer").classList.add("hidden");
                    document.getElementById("gameLayer").classList.remove("hidden");

                    // Calculate Current Question Number (0 to 9)
                    const qIdx = Math.floor(timePassed / CYCLE_MS);
                    const timeInCycle = timePassed % CYCLE_MS;

                    renderGamePhase(qIdx, timeInCycle);
                } 
                // C. GAME OVER
                else {
                    showWaitScreen("GAME OVER", 0, "Check Leaderboard");
                    document.getElementById("gameLayer").classList.add("hidden");
                }

            }, 1000);
        }

        let loadedQIdx = -1;

        function renderGamePhase(idx, timeInCycle) {
            // 1. Fetch Data if new question
            if(loadedQIdx !== idx) {
                loadedQIdx = idx;
                isAnswered = false;
                resetUI();
                
                document.getElementById("qIndex").innerText = idx + 1;
                const qId = myQuestions[idx];
                
                // Fetch Question Text
                if(qId) {
                    get(ref(db, `questions/${qId}`)).then(s => {
                        currentQData = s.val();
                        document.getElementById("qBox").innerText = currentQData.question;
                        ['A','B','C','D'].forEach(opt => {
                            document.getElementById('btn'+opt).innerText = currentQData.options[opt];
                        });
                    });
                }
            }

            const timerEl = document.getElementById("gameTimer");
            const phaseEl = document.getElementById("phaseText");
            const qBox = document.getElementById("qBox");
            const optBox = document.getElementById("optBox");
            const gameLayer = document.getElementById("gameLayer");
            const waitLayer = document.getElementById("waitLayer");

            // --- PHASE 1: READING (0s - 10s) ---
            if (timeInCycle < READ_MS) {
                waitLayer.classList.add("hidden");
                gameLayer.classList.remove("hidden");
                
                let timeLeft = Math.ceil((READ_MS - timeInCycle) / 1000);
                timerEl.innerText = timeLeft;
                timerEl.style.color = "#00f0ff"; // Blue
                phaseEl.innerText = "READ THE QUESTION";
                
                qBox.classList.remove("blur");
                optBox.classList.remove("show"); // Hide Options
            }
            // --- PHASE 2: ANSWERING (10s - 30s) ---
            else if (timeInCycle < ANS_MS) {
                let timeLeft = Math.ceil((ANS_MS - timeInCycle) / 1000);
                timerEl.innerText = timeLeft;
                timerEl.style.color = "#ff0055"; // Red
                phaseEl.innerText = "QUICK! CHOOSE ANSWER";
                
                qBox.classList.add("blur"); // Blur Question
                optBox.classList.add("show"); // Show Options
            }
            // --- PHASE 3: WAITING (30s - 5:00m) ---
            else {
                // Hide Game UI, Show Waiting Overlay for next Q
                gameLayer.classList.add("hidden");
                waitLayer.classList.remove("hidden");
                
                let nextQTime = (CYCLE_MS - timeInCycle);
                showWaitScreen("NEXT QUESTION IN", nextQTime, `Question ${idx+2} Coming Up...`);
            }
        }

        window.submitAns = function(choice) {
            if(isAnswered || !currentQData) return;
            isAnswered = true;

            const isCorrect = (choice === currentQData.answer);
            const btn = document.getElementById("btn"+choice);
            
            // UI Feedback
            if(isCorrect) btn.classList.add("correct");
            else btn.classList.add("wrong");

            // Send to Admin Panel
            const answerPath = `users_game_data/${userId}/answers/${loadedQIdx}`;
            update(ref(db, answerPath), {
                questionId: currentQData.id,
                selected: choice,
                isCorrect: isCorrect,
                timestamp: Date.now()
            });

            // Update Score if correct
            if(isCorrect) {
                const scoreRef = ref(db, `users_game_data/${userId}/score`);
                get(scoreRef).then(snap => {
                    let s = snap.val() || 0;
                    set(scoreRef, s + 1);
                });
            }
        };

        function resetUI() {
            document.querySelectorAll('.btn-opt').forEach(b => {
                b.className = 'btn-opt'; // Reset colors
            });
            document.getElementById("qBox").innerText = "Decrypting Question...";
        }

        function showWaitScreen(title, ms, sub) {
            document.getElementById("waitTitle").innerText = title;
            document.getElementById("waitSub").innerText = sub;
            
            // Format Time
            let seconds = Math.floor((ms / 1000) % 60);
            let minutes = Math.floor((ms / (1000 * 60)) % 60);
            let hours = Math.floor((ms / (1000 * 60 * 60)) % 24);

            let str = "";
            if(hours > 0) str += hours + ":";
            str += (minutes < 10 ? "0" : "") + minutes + ":";
            str += (seconds < 10 ? "0" : "") + seconds;
            
            document.getElementById("mainCountdown").innerText = str;
        }

    </script>
</body>
</html>
