<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Quiz - Debug Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #050511; color: white; font-family: 'Poppins', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        
        /* Debug Box */
        #debugStatus {
            position: absolute; top: 10px; left: 10px; background: rgba(255, 0, 0, 0.2); 
            border: 1px solid red; padding: 10px; font-size: 12px; z-index: 1000; max-width: 300px;
        }

        .container { text-align: center; }
        .big-text { font-family: 'Orbitron'; font-size: 3rem; margin: 20px 0; color: #00f0ff; }
        .status { padding: 5px 15px; background: #333; border-radius: 5px; }
        
        .game-ui { display: none; width: 90%; max-width: 500px; border: 1px solid #333; padding: 20px; border-radius: 10px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; cursor: pointer; }
        .btn.correct { background: green; } .btn.wrong { background: red; }
    </style>
</head>
<body>

    <!-- Debug Log Box -->
    <div id="debugStatus">System Status: Initializing...</div>

    <!-- 1. WAITING SCREEN -->
    <div id="waitScreen" class="container">
        <h2>PLAYER ID: <span id="dispID" style="color:yellow">...</span></h2>
        <div class="big-text" id="timer">--:--:--</div>
        <p class="status" id="mainStatus">Connecting to Server...</p>
        <button onclick="localStorage.clear(); location.reload();" style="margin-top:20px; padding:5px;">Reset ID</button>
    </div>

    <!-- 2. GAME UI -->
    <div id="gameUI" class="game-ui">
        <div style="display:flex; justify-content:space-between;">
            <span>Q: <span id="qNum">1</span>/10</span>
            <span id="phase">READ</span>
        </div>
        <h2 id="qText" style="margin:20px 0; min-height:60px;">Loading...</h2>
        <div id="opts">
            <button class="btn" id="btnA" onclick="ans('A')">A</button>
            <button class="btn" id="btnB" onclick="ans('B')">B</button>
            <button class="btn" id="btnC" onclick="ans('C')">C</button>
            <button class="btn" id="btnD" onclick="ans('D')">D</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g",
            authDomain: "art-paid-work001.firebaseapp.com",
            databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com",
            projectId: "art-paid-work001",
            storageBucket: "art-paid-work001.firebasestorage.app",
            messagingSenderId: "524647364992",
            appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const log = (msg) => document.getElementById('debugStatus').innerHTML += "<br>" + msg;

        // 1. USER SETUP
        let uid = localStorage.getItem("game_uid");
        if(!uid) { uid = "u"+Math.floor(Math.random()*999); localStorage.setItem("game_uid", uid); }
        document.getElementById("dispID").innerText = uid;
        log("User ID: " + uid);

        // Register User
        get(ref(db, `users/${uid}`)).then(s => {
            if(!s.exists()) {
                set(ref(db, `users/${uid}`), { name: "Player "+uid, account_status: "pending", balance: 0 });
                log("User Created. Status: PENDING");
            } else {
                log("User Found. Current Status: " + s.val().account_status);
            }
        });

        // 2. LISTEN FOR STATUS & CONFIG
        let isActive = false;
        let config = null;
        let myQ = [];

        onValue(ref(db, `users/${uid}/account_status`), snap => {
            const st = snap.val();
            log(`Account Updated: ${st}`);
            if(st === 'active') {
                isActive = true;
                document.getElementById('mainStatus').innerText = "Account Active! Waiting for Schedule...";
                document.getElementById('mainStatus').style.color = "lightgreen";
                loadConfig();
            } else {
                isActive = false;
                document.getElementById('mainStatus').innerText = "ACCOUNT LOCKED (Ask Admin)";
                document.getElementById('mainStatus').style.color = "red";
                document.getElementById('gameUI').style.display = 'none';
                document.getElementById('waitScreen').style.display = 'block';
            }
        });

        function loadConfig() {
            onValue(ref(db, 'game_config'), snap => {
                config = snap.val();
                if(config) {
                    log(`Config Loaded. Start: ${new Date(config.startTime).toLocaleTimeString()}`);
                    prepareQuestions();
                } else {
                    log("ERROR: No Game Schedule Found in Admin!");
                }
            });
        }

        async function prepareQuestions() {
            const qRef = ref(db, `users_game_data/${uid}/q_order`);
            const snap = await get(qRef);
            if(snap.exists()) {
                myQ = snap.val();
                log(`Loaded ${myQ.length} Questions.`);
                startGameLoop();
            } else {
                log("Downloading Questions...");
                const all = await get(ref(db, 'questions'));
                if(all.exists()) {
                    let keys = Object.keys(all.val());
                    keys.sort(()=>Math.random()-0.5);
                    myQ = keys.slice(0, 10);
                    await set(qRef, myQ);
                    log("Questions Assigned.");
                    startGameLoop();
                } else {
                    log("ERROR: No Questions in Database!");
                }
            }
        }

        // 3. GAME LOOP
        function startGameLoop() {
            if(window.loop) clearInterval(window.loop);
            window.loop = setInterval(() => {
                if(!isActive || !config) return;
                
                const now = Date.now();
                const start = config.startTime;

                if(now < start) {
                    // Waiting
                    let diff = start - now;
                    let m = Math.floor(diff/60000);
                    let s = Math.floor((diff%60000)/1000);
                    document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
                    document.getElementById('mainStatus').innerText = "Game Starts Soon...";
                } else {
                    // Game Running
                    document.getElementById('waitScreen').style.display = 'none';
                    document.getElementById('gameUI').style.display = 'block';
                    
                    let passed = now - start;
                    let idx = Math.floor(passed / (5*60000)); // 5 min cycle
                    if(idx < 10) renderQ(idx, passed % (5*60000));
                    else {
                        document.getElementById('gameUI').style.display = 'none';
                        document.getElementById('waitScreen').style.display = 'block';
                        document.getElementById('mainStatus').innerText = "GAME OVER";
                    }
                }
            }, 1000);
        }

        let currIdx = -1;
        let qData = null;
        let answered = false;

        function renderQ(idx, timeMs) {
            if(currIdx !== idx) {
                currIdx = idx;
                answered = false;
                // Load Q
                log("Loading Q: " + (idx+1));
                document.getElementById('qNum').innerText = idx+1;
                document.querySelectorAll('.btn').forEach(b=>b.style.background='#222');
                get(ref(db, `questions/${myQ[idx]}`)).then(s=>{
                    qData = s.val();
                    document.getElementById('qText').innerText = qData.question;
                    ['A','B','C','D'].forEach(o => document.getElementById('btn'+o).innerText = qData.options[o]);
                });
            }

            // Phase
            let sec = timeMs/1000;
            if(sec < 10) { // Read
                document.getElementById('phase').innerText = `READ (${10-Math.floor(sec)})`;
                document.getElementById('opts').style.pointerEvents = 'none';
                document.getElementById('opts').style.opacity = '0.5';
            } else if (sec < 30) { // Answer
                document.getElementById('phase').innerText = `ANSWER (${30-Math.floor(sec)})`;
                document.getElementById('qText').style.filter = 'blur(5px)';
                document.getElementById('opts').style.pointerEvents = 'all';
                document.getElementById('opts').style.opacity = '1';
            } else { // Wait
                document.getElementById('phase').innerText = "WAITING NEXT...";
                document.getElementById('gameUI').style.display = 'none';
                document.getElementById('waitScreen').style.display = 'block';
                document.getElementById('timer').innerText = "NEXT Q SOON";
            }
        }

        window.ans = (opt) => {
            if(answered) return;
            answered = true;
            let correct = (opt === qData.answer);
            document.getElementById('btn'+opt).style.background = correct ? 'green' : 'red';
            update(ref(db, `users_game_data/${uid}/answers/${currIdx}`), {
                ans: opt, correct: correct
            });
        }
    </script>
</body>
</html>
