<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping28 | The Golden Era</title>
    <!-- Fonts: Cinzel for the ultimate luxury feel -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    
    <style>
        /* --- LUXURY COLOR PALETTE --- */
        :root {
            --bg-void: #000000;
            --gold-leaf: #D4AF37;
            --gold-shimmer: #FFD700;
            --shadow-gold: rgba(212, 175, 55, 0.2);
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg-void);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Cinzel', serif;
            cursor: default;
        }

        /* --- ATMOSPHERIC SPOTLIGHT --- */
        .spotlight {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            z-index: 0;
            animation: breatheLight 6s infinite alternate;
        }

        /* --- MAIN CONTENT WRAPPER --- */
        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- THE LOGO --- */
        .hero-logo {
            width: 320px;
            height: auto;
            /* MAGIC BLEND: Removes black background */
            mix-blend-mode: screen; 
            
            /* Effects */
            filter: drop-shadow(0 0 0 transparent);
            transform: scale(0.95);
            opacity: 0;
            
            /* Entrance Animation */
            animation: 
                fadeInLogo 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
                levitate 5s infinite ease-in-out 2s;
            cursor: pointer;
            transition: filter 0.5s;
        }

        .hero-logo:hover {
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
        }

        /* --- SUBTITLE (Optional Brand Tagline) --- */
        .tagline {
            margin-top: -10px;
            color: #666;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 1.2s;
        }

        /* --- ENTER BUTTON (The Premium Touch) --- */
        .enter-btn {
            margin-top: 50px;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--gold-leaf);
            padding: 15px 40px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 1.8s;
        }

        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
            transition: 0.5s;
        }

        .enter-btn:hover {
            border-color: var(--gold-shimmer);
            color: #fff;
            box-shadow: 0 0 30px var(--shadow-gold);
            text-shadow: 0 0 10px var(--gold-shimmer);
        }

        .enter-btn:hover::before {
            left: 100%;
        }

        /* --- PARTICLES --- */
        .dust-field {
            position: absolute;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .particle {
            position: absolute;
            background: var(--gold-leaf);
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 8s infinite linear;
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeInLogo {
            from { opacity: 0; transform: scale(0.9) translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        @keyframes levitate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes breatheLight {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Exit Animation Class */
        body.fade-out {
            opacity: 0;
            transform: scale(1.05);
            transition: all 1s ease;
        }
    </style>
</head>
<body>

    <!-- Atmospheric Glow -->
    <div class="spotlight"></div>

    <!-- Floating Particles -->
    <div class="dust-field" id="particles"></div>

    <!-- Main Content -->
    <div class="content-wrapper">
        <!-- Logo Image -->
        <img src="https://i.postimg.cc/FzkgKX79/20251222-132646.png" 
             alt="Shopping28 Royal Logo" 
             class="hero-logo">
        
        <!-- Elegant Subtitle -->
        <div class="tagline">The Art of Shopping</div>

        <!-- Interactive Entrance Button -->
        <button class="enter-btn" onclick="enterSite()">Enter Experience</button>
    </div>

    <script>
        // Generate Elegant Particles
        const field = document.getElementById('particles');
        for(let i=0; i<25; i++){
            let p = document.createElement('div');
            p.className = 'particle';
            let s = Math.random() * 2;
            p.style.width = s + 'px';
            p.style.height = s + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            field.appendChild(p);
        }

        // Entrance Logic
        function enterSite() {
            // Add fade out effect
            document.body.classList.add('fade-out');
            
            // Wait for animation then redirect
            setTimeout(() => {
                // CHANGE THIS LINK to your dashboard page
                // window.location.href = 'dashboard.html';
                console.log("Welcome to Shopping28");
            }, 1000);
        }
    </script>
</body>
</html>
