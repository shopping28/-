<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | ShoppingFree</title>
    <!-- Google Fonts: Inter for Tech Look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --primary-gradient: linear-gradient(45deg, #5c24fc, #9d00ff);
            --neon-glow: #9d00ff;
            --text-color: #ffffff;
        }
        body {
        margin: 0; 
        height: 100vh; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center;
        background-color: var(--bg-dark);
        background-image: 
            radial-gradient(circle at 50% 50%, rgba(92, 36, 252, 0.15) 0%, transparent 50%);
        font-family: 'Inter', sans-serif; 
        color: var(--text-color); 
        overflow: hidden;
        position: relative;
    }

    /* Background Animated Particles (Optional Visual Effect) */
    .bg-blur {
        position: absolute;
        width: 300px; height: 300px;
        background: var(--neon-glow);
        filter: blur(150px);
        opacity: 0.2;
        z-index: -1;
        animation: moveBg 6s infinite alternate;
    }

    /* LOGO DESIGN */
    .logo-container {
        width: 110px; height: 110px; 
        background: rgba(255, 255, 255, 0.03);
        border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        box-shadow: 0 0 30px rgba(157, 0, 255, 0.2);
        position: relative;
        animation: float 3s ease-in-out infinite;
    }

    /* Rotating Ring around logo */
    .ring {
        position: absolute;
        width: 100%; height: 100%;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #9d00ff;
        border-right-color: #5c24fc;
        animation: spin 1.5s linear infinite;
    }

    .logo-container i { 
        font-size: 3.5rem; 
        background: linear-gradient(to bottom, #fff, #a1a1a1);
        -webkit-background-clip: text; 
        -webkit-text-fill-color: transparent;
        z-index: 2;
    }
    
    /* TEXT DESIGN */
    h1 { 
        margin-top: 30px; 
        font-weight: 900; 
        letter-spacing: 1px; 
        text-transform: uppercase; 
        font-size: 1.8rem; 
        background: linear-gradient(90deg, #fff, #b3b3b3);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 5px;
    }
    
    p.subtitle {
        margin: 0;
        font-size: 0.8rem;
        color: #666;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 40px;
    }

    /* LOADER BAR DESIGN */
    .loader-box {
        width: 200px;
        height: 6px;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
    }

    .loader-bar {
        height: 100%;
        width: 0%;
        background: var(--primary-gradient);
        border-radius: 10px;
        animation: loadingProgress 3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        box-shadow: 0 0 15px rgba(157, 0, 255, 0.7);
    }

    /* ANIMATIONS */
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    @keyframes moveBg { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
    @keyframes loadingProgress { 
        0% { width: 0%; } 
        40% { width: 50%; }
        70% { width: 80%; }
        100% { width: 100%; } 
    }

</style>
</head>
<body>
<!-- Background Glow Effect -->
<div class="bg-blur"></div>

<div class="logo-container">
    <div class="ring"></div> <!-- Rotating Ring -->
    <i class="fas fa-shopping-bag"></i>
</div>

<h1>ShoppingFree</h1>
<p class="subtitle">Secure System</p>

<div class="loader-box">
    <div class="loader-bar"></div>
</div>

<script>
    // ৩.২ সেকেন্ড পর রিডাইরেক্ট হবে
    setTimeout(() => { 
        window.location.href = 'login_register.html'; 
    }, 3200);
</script>
</body>
</html>
