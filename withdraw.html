<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === ULTRA PREMIUM VARIABLES === */
        :root {
            --bg-deep: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-cyan: #00f2ff;
            --neon-purple: #bd00ff;
            --text-main: #ffffff;
            --text-muted: #8f9ba8;
            --gradient-primary: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* GLOW EFFECTS */
        .glow-orb { position: fixed; width: 300px; height: 300px; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.4; }
        .orb-1 { top: -50px; left: -50px; background: var(--neon-purple); }
        .orb-2 { bottom: -50px; right: -50px; background: var(--neon-cyan); }

        .container { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }

        /* HEADER */
        .header { display: flex; align-items: center; margin-bottom: 30px; padding: 10px 0; }
        .back-btn { 
            width: 40px; height: 40px; border-radius: 12px; 
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        .back-btn:hover { background: rgba(255,255,255,0.1); }
        .page-title { margin-left: auto; margin-right: auto; font-size: 1.2rem; font-weight: 700; transform: translateX(-20px); }

        /* BALANCE CARD */
        .balance-card {
            background: linear-gradient(120deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 24px; padding: 30px;
            margin-bottom: 35px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: left;
        }
        .bal-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
        .bal-amount { 
            font-size: 2.8rem; font-weight: 700; margin: 10px 0; 
            background: linear-gradient(to right, #fff, #a5b4fc); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .bdt-est { font-size: 0.9rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .tag-usdt { background: rgba(0, 242, 255, 0.15); color: var(--neon-cyan); padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }

        /* INPUTS */
        .input-group { position: relative; margin-bottom: 20px; }
        .input-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        
        select, input {
            width: 100%; padding: 18px 20px 18px 50px;
            background: #0f0f13; border: 1px solid #2a2a35;
            color: #fff; border-radius: 16px; outline: none;
            font-size: 1rem; font-family: 'Outfit', sans-serif;
            transition: 0.3s;
        }
        select:focus, input:focus { border-color: var(--neon-cyan); background: #15151a; }
        
        /* BUTTON */
        .btn-withdraw {
            width: 100%; padding: 18px;
            background: var(--gradient-primary);
            border: none; border-radius: 16px;
            color: #fff; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; transition: 0.4s; margin-top: 10px;
            box-shadow: 0 10px 25px rgba(0, 114, 255, 0.3);
        }
        .btn-withdraw:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(0, 114, 255, 0.5); }
        .btn-withdraw:disabled { background: #333; cursor: not-allowed; transform: none; box-shadow: none; }

        /* INFO NOTE */
        .info-note {
            text-align: center; font-size: 0.85rem; color: var(--text-muted);
            margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.03);
            border-radius: 12px; line-height: 1.5;
        }
        .info-note i { color: var(--neon-cyan); margin-right: 5px; }

        /* HISTORY */
        .hist-header { margin-top: 40px; margin-bottom: 20px; font-size: 1.1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        
        .hist-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 15px 20px; border-radius: 16px; margin-bottom: 12px;
        }
        .h-method { font-weight: 600; font-size: 0.95rem; color: #fff; margin-bottom: 4px; }
        .h-time { font-size: 0.75rem; color: var(--text-muted); }
        .h-amount { font-weight: 700; font-size: 1rem; color: #fff; text-align: right; }
        .h-status { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; text-align: right; margin-top: 4px; }

        .st-pending { color: #f1c40f; }
        .st-approved { color: #00f260; }
    </style>
</head>
<body>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div class="page-title">Withdraw Funds</div>
        </div>

        <!-- Balance -->
        <div class="balance-card">
            <div class="bal-label">Total Balance</div>
            <div class="bal-amount"><span id="usd">0.00</span></div>
            <div class="bdt-est">
                <span class="tag-usdt">USDT</span>
                <i class="fas fa-exchange-alt" style="font-size:0.7rem; color:var(--neon-cyan)"></i> 
                <span>≈ <span id="bdt">0</span> BDT</span>
            </div>
        </div>

        <!-- Form -->
        <div class="input-group">
            <select id="methodSelect">
                <option value="" disabled selected>Select Payment Method</option>
            </select>
            <i class="fas fa-wallet input-icon"></i>
        </div>

        <div class="input-group">
            <input type="text" id="wallet" placeholder="Wallet Address / Number">
            <i class="fas fa-qrcode input-icon"></i>
        </div>

        <div class="input-group">
            <input type="number" id="amount" placeholder="Loading limit...">
            <i class="fas fa-dollar-sign input-icon"></i>
        </div>

        <button class="btn-withdraw" id="btn" onclick="withdraw()">
            Confirm Withdrawal <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
        </button>

        <!-- NOTE -->
        <div class="info-note">
            <i class="fas fa-clock"></i> 
            Withdrawal request will be processed to your selected payment method within 24 hours.
        </div>

        <!-- History -->
        <div class="hist-header">
            <span>Recent Transactions</span>
            <i class="fas fa-history" style="color:var(--text-muted); opacity:0.5"></i>
        </div>
        <div id="hist">
            <div style="text-align:center; color:#555; padding:20px;">Loading...</div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const RATE = 120;

        let user, bdt=0, usd=0;
        let minWithdrawLimit = 5; // Default

        auth.onAuthStateChanged(u => {
            if(u) { 
                user = u; 
                loadBal(); 
                loadMethods(); 
                loadLimit(); // Load Admin Limit
                loadHist(); 
            }
            else { window.location.href = 'login_register.html'; }
        });

        // 1. Load Admin Limit
        function loadLimit() {
            db.ref('settings/withdraw_limit').on('value', snap => {
                if(snap.exists()) {
                    minWithdrawLimit = parseFloat(snap.val());
                }
                document.getElementById('amount').placeholder = `Amount (Min: ${minWithdrawLimit.toFixed(2)})`;
            });
        }

        // 2. Load Balance
        function loadBal() {
            db.ref('users/'+user.uid+'/balance').on('value', s => {
                bdt = parseFloat(s.val() || 0);
                usd = bdt / RATE;
                document.getElementById('bdt').innerText = bdt.toFixed(2);
                document.getElementById('usd').innerText = usd.toFixed(2);
            });
        }

        // 3. Load Methods
        function loadMethods() {
            db.ref('settings/payment_methods').on('value', snap => {
                const select = document.getElementById('methodSelect');
                select.innerHTML = '<option value="" disabled selected>Select Payment Method</option>';
                if(snap.exists()){
                    snap.forEach(c => {
                        const m = c.val();
                        const opt = document.createElement('option');
                        opt.value = m.name; opt.innerText = m.name;
                        select.appendChild(opt);
                    });
                }
            });
        }

        // 4. Withdraw Logic
        function withdraw() {
            const method = document.getElementById('methodSelect').value;
            const wall = document.getElementById('wallet').value.trim();
            const amt = parseFloat(document.getElementById('amount').value);
            const btn = document.getElementById('btn');

            if(!method) return alert("Please select a payment method.");
            if(!wall) return alert("Please enter wallet/number.");
            if(!amt || amt < minWithdrawLimit) return alert(`Minimum withdrawal amount is ${minWithdrawLimit} USDT.`);
            if(amt > usd) return alert("Insufficient Balance.");

            if(!confirm(`Confirm withdraw of ${amt} USDT via ${method}?`)) return;

            btn.disabled = true; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            const deduct = amt * RATE;

            db.ref('users/'+user.uid+'/balance').transaction(c => {
                return (c >= deduct) ? c - deduct : undefined;
            }, (err, committed) => {
                if(committed) {
                    db.ref('withdraw_requests').push({
                        uid: user.uid,
                        method: method,
                        wallet: wall,
                        amountUSDT: amt,
                        amountBDT: deduct,
                        status: 'pending',
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                    alert("Withdrawal submitted successfully!");
                    document.getElementById('wallet').value = "";
                    document.getElementById('amount').value = "";
                } else {
                    alert("Transaction Failed.");
                }
                btn.disabled = false; 
                btn.innerHTML = 'Confirm Withdrawal <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>';
            });
        }

        // 5. Load History (Filtered & Limited to 5)
        function loadHist() {
            // Load more than 5 initially to ensure we have enough after filtering
            db.ref('withdraw_requests').orderByChild('uid').equalTo(user.uid).limitToLast(20).on('value', s => {
                const div = document.getElementById('hist'); div.innerHTML = "";
                
                if(!s.exists()) { 
                    div.innerHTML = "<div style='text-align:center; color:#555; padding:20px;'>No recent transactions</div>"; 
                    return; 
                }
                
                let rawData = [];
                s.forEach(c => rawData.push(c.val()));
                
                // FILTER: Remove Rejected
                const activeData = rawData.filter(item => item.status !== 'rejected');
                
                // REVERSE: Newest first
                activeData.reverse();

                // LIMIT: Show only top 5
                const displayData = activeData.slice(0, 5);

                if(displayData.length === 0) {
                     div.innerHTML = "<div style='text-align:center; color:#555; padding:20px;'>No active transactions</div>";
                     return;
                }

                displayData.forEach(d => {
                    let a = d.amountUSDT ? d.amountUSDT.toFixed(2) : (d.amount/RATE).toFixed(2);
                    let date = d.timestamp ? new Date(d.timestamp).toLocaleDateString() : 'Recent';

                    div.innerHTML += `
                        <div class="hist-item">
                            <div class="h-left">
                                <div class="h-method">${d.method}</div>
                                <div class="h-time">${date}</div>
                            </div>
                            <div class="h-right">
                                <div class="h-amount">$${a}</div>
                                <div class="h-status st-${d.status}">${d.status}</div>
                            </div>
                        </div>`;
                });
            });
        }
    </script>
</body>
</html>
