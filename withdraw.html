<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payout | SHOPPING28</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === PREMIUM VARIABLES === */
        :root {
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --neon-green: #00ff88;
            --neon-red: #ff4757;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0; padding: 20px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            position: relative;
        }

        /* BACKGROUND AMBIENCE */
        .orb { position: fixed; border-radius: 50%; filter: blur(90px); z-index: -1; opacity: 0.4; }
        .orb-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: radial-gradient(circle, #4c00ff, transparent); }
        .orb-2 { bottom: 10%; right: -10%; width: 250px; height: 250px; background: radial-gradient(circle, #ff0055, transparent); }

        /* HEADER */
        .header { display: flex; align-items: center; margin-bottom: 25px; }
        .back-btn { 
            color: var(--text-muted); text-decoration: none; font-size: 1.1rem; 
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .back-btn:hover { color: var(--neon-blue); }
        .page-title { margin-left: auto; font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; }

        /* BALANCE CARD */
        .balance-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 30px;
            text-align: center; margin-bottom: 25px;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .balance-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
        }
        .bal-title { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .bal-amount { font-size: 2.5rem; font-weight: 800; margin: 10px 0; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .usdt-badge { background: rgba(0, 242, 255, 0.1); color: var(--neon-blue); padding: 4px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; }

        /* FORM */
        .payout-form { background: var(--glass-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--glass-border); margin-bottom: 30px; }
        .form-label { display: block; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px; margin-top: 15px; }
        
        .input-group { position: relative; }
        .custom-input {
            width: 100%; padding: 15px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border); color: #fff;
            border-radius: 12px; font-family: 'Outfit', sans-serif;
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        .custom-input:focus { border-color: var(--neon-blue); box-shadow: 0 0 10px rgba(0, 242, 255, 0.1); }
        .input-icon { position: absolute; right: 15px; top: 15px; color: var(--text-muted); }

        .max-btn {
            position: absolute; right: 10px; top: 10px;
            background: rgba(255,255,255,0.1); border: none; color: var(--neon-blue);
            padding: 5px 10px; border-radius: 5px; font-size: 0.75rem; cursor: pointer;
        }

        /* NETWORK PILL */
        .network-pill {
            display: inline-block; background: rgba(0, 255, 136, 0.1); 
            border: 1px solid var(--neon-green); color: var(--neon-green);
            padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 0.9rem;
            width: 100%; box-sizing: border-box; text-align: center;
        }

        /* BUTTON */
        .submit-btn {
            width: 100%; padding: 16px; margin-top: 25px;
            background: linear-gradient(90deg, #4776E6 0%, #8E54E9 100%);
            border: none; border-radius: 15px;
            color: white; font-weight: 800; font-size: 1.1rem; letter-spacing: 1px;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 20px rgba(71, 118, 230, 0.3);
        }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .submit-btn:active { transform: scale(0.98); }

        /* HISTORY */
        .history-title { font-size: 1rem; font-weight: 700; margin-bottom: 15px; border-left: 3px solid var(--neon-purple); padding-left: 10px; }
        .history-item {
            background: var(--glass-bg); padding: 15px; border-radius: 12px;
            border: 1px solid var(--glass-border); margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .h-left h4 { margin: 0; font-size: 0.95rem; color: #fff; }
        .h-left small { color: var(--text-muted); font-size: 0.75rem; }
        .h-right { text-align: right; }
        .h-amount { font-weight: bold; font-size: 1rem; color: #fff; }
        
        .status { font-size: 0.7rem; padding: 3px 8px; border-radius: 5px; font-weight: bold; text-transform: uppercase; }
        .st-pending { color: #f1c40f; background: rgba(241, 196, 15, 0.1); }
        .st-approved { color: var(--neon-green); background: rgba(0, 255, 136, 0.1); }
        .st-rejected { color: var(--neon-red); background: rgba(255, 71, 87, 0.1); }

    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Header -->
    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
        <div class="page-title">PAYOUT</div>
    </div>

    <!-- Balance Card -->
    <div class="balance-card">
        <div class="bal-title">Available Balance</div>
        <div class="bal-amount"><span id="usdtBal">0.00</span> <span class="usdt-badge">USDT</span></div>
        <div style="font-size:0.8rem; color:#666;">≈ <span id="bdtBal">0</span> BDT</div>
    </div>

    <!-- Payout Form -->
    <div class="payout-form">
        
        <label class="form-label">Network</label>
        <div class="network-pill">USDT (BEP20)</div>

        <label class="form-label">Wallet Address</label>
        <div class="input-group">
            <input type="text" id="wWallet" class="custom-input" placeholder="Paste BEP20 Address">
            <i class="fas fa-wallet input-icon"></i>
        </div>

        <label class="form-label">Amount (USDT)</label>
        <div class="input-group">
            <input type="number" id="wAmount" class="custom-input" placeholder="Min 5 USDT">
            <button class="max-btn" onclick="setMax()">MAX</button>
        </div>

        <div style="margin-top:10px; font-size:0.75rem; color:var(--text-muted);">
            * Minimum Withdraw: <span style="color:var(--neon-green)">5.00 USDT</span> <br>
            * Rate: 120 BDT = 1 USDT
        </div>

        <button class="submit-btn" id="wBtn" onclick="requestWithdraw()">CONFIRM PAYOUT</button>
    </div>

    <!-- History -->
    <div class="history-title">Recent Transactions</div>
    <div id="histList">
        <div style="text-align:center; color:#666; font-size:0.9rem; padding:20px;">Loading History...</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let currentBdtBal = 0;
        let currentUsdtBal = 0;
        const EXCHANGE_RATE = 120; // 120 BDT = 1 USDT
        const MIN_USDT = 5; // Minimum Withdraw

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loadData();
                loadHistory();
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function loadData() {
            db.ref('users/' + currentUser.uid + '/balance').on('value', (snap) => {
                currentBdtBal = parseFloat(snap.val()) || 0;
                currentUsdtBal = currentBdtBal / EXCHANGE_RATE;

                document.getElementById('bdtBal').innerText = currentBdtBal.toFixed(2);
                document.getElementById('usdtBal').innerText = currentUsdtBal.toFixed(2);
            });
        }

        function setMax() {
            // Leave a tiny bit for safety or just full amount
            let maxVal = Math.floor(currentUsdtBal * 100) / 100; 
            document.getElementById('wAmount').value = maxVal;
        }

        function requestWithdraw() {
            const wallet = document.getElementById('wWallet').value.trim();
            const amountUsdt = parseFloat(document.getElementById('wAmount').value);
            const btn = document.getElementById('wBtn');

            // Validation
            if (!wallet || wallet.length < 10) return alert("Please enter a valid BEP20 Wallet Address");
            if (!amountUsdt || amountUsdt <= 0) return alert("Enter valid amount");
            if (amountUsdt < MIN_USDT) return alert(`Minimum withdraw is ${MIN_USDT} USDT`);
            if (amountUsdt > currentUsdtBal) return alert("Insufficient Balance!");

            if (!confirm(`Confirm Payout of ${amountUsdt} USDT?\nWallet: ${wallet}`)) return;

            btn.disabled = true;
            btn.innerText = "Processing...";

            // Calculate BDT to deduct
            const deductBdt = amountUsdt * EXCHANGE_RATE;
            const newBdtBal = currentBdtBal - deductBdt;

            // Update Database
            db.ref('users/' + currentUser.uid + '/balance').set(newBdtBal)
            .then(() => {
                const req = {
                    uid: currentUser.uid,
                    method: 'USDT (BEP20)',
                    wallet: wallet,
                    amountUSDT: amountUsdt,
                    amountBDT: deductBdt,
                    status: 'pending',
                    timestamp: Date.now()
                };
                return db.ref('withdraw_requests').push(req);
            })
            .then(() => {
                alert("Payout Request Successful!");
                document.getElementById('wAmount').value = "";
                document.getElementById('wWallet').value = "";
                btn.disabled = false;
                btn.innerText = "CONFIRM PAYOUT";
            })
            .catch(err => {
                alert("Error: " + err.message);
                // Rollback if needed (Simple version assumes success)
                btn.disabled = false;
                btn.innerText = "CONFIRM PAYOUT";
            });
        }

        function loadHistory() {
            db.ref('withdraw_requests').orderByChild('uid').equalTo(currentUser.uid).limitToLast(10).on('value', (snapshot) => {
                const list = document.getElementById('histList');
                list.innerHTML = "";
                
                if(!snapshot.exists()) {
                    list.innerHTML = "<div style='text-align:center; color:#666; font-size:0.9rem; padding:20px;'>No Transactions Yet</div>";
                    return;
                }

                let arr = [];
                snapshot.forEach(c => arr.push(c.val()));
                
                arr.reverse().forEach(item => {
                    let statusClass = 'st-pending';
                    if(item.status === 'approved') statusClass = 'st-approved';
                    if(item.status === 'rejected') statusClass = 'st-rejected';

                    // Formatting amount: Use amountUSDT if exists, else convert old BDT records
                    let displayAmt = item.amountUSDT ? item.amountUSDT.toFixed(2) : (item.amount / EXCHANGE_RATE).toFixed(2);
                    
                    const date = new Date(item.timestamp).toLocaleDateString();

                    const html = `
                        <div class="history-item">
                            <div class="h-left">
                                <h4>Payout (USDT)</h4>
                                <small>${date} • ${item.wallet.substring(0,8)}...</small>
                            </div>
                            <div class="h-right">
                                <div class="h-amount">${displayAmt} USDT</div>
                                <span class="status ${statusClass}">${item.status}</span>
                            </div>
                        </div>
                    `;
                    list.insertAdjacentHTML('beforeend', html);
                });
            });
        }
    </script>
</body>
</html>
