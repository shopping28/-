<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Withdraw</title>
    <!-- স্টাইল এবং ফন্ট -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* ব্যালেন্স কার্ড */
        .card { background: #1a1a2e; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #333; margin-bottom: 20px; }
        .bal { font-size: 2rem; font-weight: bold; color: #00f260; }
        
        /* ইনপুট এবং বাটন */
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #000; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #00f260; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 1rem; }
        button:disabled { background: #555; }

        /* হিস্ট্রি লিস্ট */
        .item { background: #222; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; font-size: 0.9rem; }
        .pending { color: orange; } .approved { color: #00f260; } .rejected { color: red; }
    </style>
</head>
<body>

    <div class="container">
        <h3>Withdraw Money</h3>
        
        <!-- ব্যালেন্স সেকশন -->
        <div class="card">
            <div>Available Balance</div>
            <div class="bal">$<span id="usd">0.00</span></div>
            <div style="font-size:0.8rem; color:#aaa;">≈ <span id="bdt">0</span> BDT</div>
        </div>

        <!-- ইনপুট ফর্ম -->
        <label>Wallet Address (USDT BEP20)</label>
        <input type="text" id="wallet" placeholder="Paste address here...">
        
        <label>Amount (Min $5)</label>
        <input type="number" id="amount" placeholder="5">

        <button onclick="submitReq()" id="btn">Confirm Withdraw</button>

        <h4 style="margin-top:20px; border-bottom:1px solid #333; padding-bottom:10px;">Recent History</h4>
        <div id="history">Loading...</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const RATE = 120; // ১ ডলার = ১২০ টাকা

        let user, currentBDT=0;

        auth.onAuthStateChanged(u => {
            if(u) { user = u; loadData(); loadHistory(); }
            else { window.location.href = "login_register.html"; }
        });

        function loadData() {
            db.ref('users/'+user.uid+'/balance').on('value', s => {
                currentBDT = parseFloat(s.val() || 0);
                document.getElementById('bdt').innerText = currentBDT.toFixed(2);
                document.getElementById('usd').innerText = (currentBDT / RATE).toFixed(2);
            });
        }

        function submitReq() {
            const wall = document.getElementById('wallet').value;
            const amt = parseFloat(document.getElementById('amount').value);
            const btn = document.getElementById('btn');

            if(!wall || amt < 5) return alert("Minimum withdraw is $5");
            if((amt * RATE) > currentBDT) return alert("Insufficient Balance!");

            if(!confirm("Confirm Withdraw?")) return;

            btn.disabled = true; btn.innerText = "Processing...";
            const deduct = amt * RATE;

            // ব্যালেন্স কাটা এবং রিকোয়েস্ট জমা দেওয়া
            db.ref('users/'+user.uid+'/balance').transaction(c => {
                return (c >= deduct) ? c - deduct : undefined; // টাকা থাকলে কাটবে
            }, (err, committed) => {
                if(committed) {
                    db.ref('withdraw_requests').push({
                        uid: user.uid,
                        method: 'USDT (BEP20)',
                        wallet: wall,
                        amountUSDT: amt,
                        amountBDT: deduct,
                        status: 'pending',
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                    alert("Withdraw Request Successful!");
                    document.getElementById('wallet').value = "";
                    document.getElementById('amount').value = "";
                } else {
                    alert("Transaction Failed.");
                }
                btn.disabled = false; btn.innerText = "Confirm Withdraw";
            });
        }

        function loadHistory() {
            db.ref('withdraw_requests').orderByChild('uid').equalTo(user.uid).limitToLast(10).on('value', s => {
                const div = document.getElementById('history'); div.innerHTML = "";
                if(!s.exists()) { div.innerHTML = "No history found"; return; }
                
                const data = [];
                s.forEach(c => data.push(c.val()));
                data.reverse().forEach(d => {
                    div.innerHTML += `
                        <div class="item">
                            <span>$${d.amountUSDT} - ${d.wallet.substr(0,6)}...</span>
                            <span class="${d.status}">${d.status}</span>
                        </div>`;
                });
            });
        }
    </script>
</body>
</html>
