<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forsage Dashboard | Premium</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === FORSAGE THEME VARIABLES === */
        :root {
            --bg-dark: #0d0d2b;
            --card-glass: rgba(30, 30, 60, 0.6);
            --primary: #5856d6;
            --accent-cyan: #00ecff;
            --accent-pink: #bd00ff;
            --text-white: #ffffff;
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; padding-bottom: 80px;
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* BACKGROUND ORBS */
        .orb { position: fixed; border-radius: 50%; filter: blur(90px); z-index: -1; }
        .orb-1 { top: -10%; left: -10%; width: 350px; height: 350px; background: rgba(88, 86, 214, 0.4); animation: float 10s infinite alternate; }
        .orb-2 { bottom: 10%; right: -10%; width: 300px; height: 300px; background: rgba(189, 0, 255, 0.3); animation: float 12s infinite alternate-reverse; }
        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px; opacity: 0.5;
        }

        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 40px); } }

        /* HEADER */
        .header {
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(13, 13, 43, 0.8); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo-area h2 { margin: 0; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .logo-area span { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0, 236, 255, 0.5); }
        
        .profile-btn {
            width: 45px; height: 45px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
            padding: 2px; cursor: pointer;
        }
        .profile-btn img {
            width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover; border: 2px solid var(--bg-dark); background: #000;
        }

        /* HERO SECTION */
        .hero {
            text-align: center; padding: 30px 20px;
            background: linear-gradient(180deg, rgba(88, 86, 214, 0.1) 0%, transparent 100%);
        }
        .user-id-box {
            display: inline-block; padding: 5px 15px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--accent-cyan);
            border-radius: 20px; color: var(--accent-cyan); font-weight: bold;
            letter-spacing: 1px; margin-bottom: 10px; box-shadow: 0 0 15px rgba(0, 236, 255, 0.2);
        }
        .balance-display { font-size: 2.5rem; font-weight: 700; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .balance-label { color: #aaa; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; }

        /* STATS GRID (Forsage Style) */
        .stats-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px 20px;
        }
        .stat-box {
            background: var(--card-glass);
            border: var(--glass-border);
            padding: 20px; border-radius: 15px;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center;
        }
        .stat-box::before {
            content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px;
            background: var(--accent-pink);
        }
        .stat-box:nth-child(even)::before { background: var(--accent-cyan); }
        
        .stat-value { font-size: 1.5rem; font-weight: 700; margin-bottom: 5px; }
        .stat-title { font-size: 0.75rem; color: #bbb; text-transform: uppercase; letter-spacing: 0.5px; }

        .glow-text { color: #fff; text-shadow: 0 0 5px rgba(255,255,255,0.3); }

        /* MENU GRID (16:9 Buttons) */
        .menu-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 10px 20px 40px;
        }
        .menu-card {
            aspect-ratio: 16/9;
            border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative; overflow: hidden;
        }
        .menu-card:active { transform: scale(0.96); }
        .menu-card:hover { box-shadow: 0 5px 20px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.2); }

        .mc-icon { font-size: 1.8rem; margin-bottom: 8px; z-index: 2; }
        .mc-text { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; z-index: 2; letter-spacing: 0.5px; }

        /* Button Gradients (Darker & Richer) */
        .g-task { background: linear-gradient(135deg, #2b1055, #7597de); }
        .g-team { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); }
        .g-with { background: linear-gradient(135deg, #3a1c71, #d76d77, #ffaf7b); } /* Rich */
        .g-vip  { background: linear-gradient(135deg, #141e30, #243b55); }
        .g-game { background: linear-gradient(135deg, #43cea2, #185a9d); }
        .g-club { background: linear-gradient(135deg, #8E2DE2, #4A00E0); }
        
        /* Shine Effect */
        .shine::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-20deg); animation: shine 6s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        /* Loader */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d0d2b; z-index: 9999; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; letter-spacing: 2px; }

    </style>
</head>
<body onclick="unlockAudio()">

    <div id="loader">LOADING...</div>

    <!-- Backgrounds -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid-bg"></div>

    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <h2>Forsage <span>IO</span></h2>
        </div>
        <div class="profile-btn" onclick="window.location.href='account.html'">
            <img id="headProfile" src="https://i.ibb.co/tZ26z1q/default-profile.png" alt="Profile">
        </div>
    </div>

    <!-- Hero -->
    <div class="hero">
        <div class="user-id-box">ID: <span id="userId">...</span></div>
        <h1 class="balance-display">৳<span id="mainBalance">0.00</span></h1>
        <div class="balance-label">Total Current Balance</div>
    </div>

    <!-- Stats Grid (Counts & Income) -->
    <div class="stats-container">
        <!-- Partner Count (Direct) -->
        <div class="stat-box">
            <div class="stat-value glow-text" id="partnerCount">0</div>
            <div class="stat-title">My Partners</div>
        </div>

        <!-- Team Count (Total) -->
        <div class="stat-box">
            <div class="stat-value glow-text" id="teamCount">0</div>
            <div class="stat-title">Total Team</div>
        </div>

        <!-- Total Income -->
        <div class="stat-box">
            <div class="stat-value" style="color:#ffd700">৳<span id="totalIncome">0</span></div>
            <div class="stat-title">Total Earning</div>
        </div>

        <!-- Today Income -->
        <div class="stat-box">
            <div class="stat-value" style="color:#00ecff">৳<span id="todayIncome">0</span></div>
            <div class="stat-title">Today Earning</div>
        </div>
    </div>

    <!-- Action Buttons (Grid) -->
    <div class="menu-grid">
        <div class="menu-card g-task shine" onclick="window.location.href='task.html'">
            <i class="fas fa-clipboard-check mc-icon"></i>
            <span class="mc-text">Daily Task</span>
        </div>

        <div class="menu-card g-team shine" onclick="window.location.href='my_team.html'">
            <i class="fas fa-users mc-icon"></i>
            <span class="mc-text">My Team</span>
        </div>

        <div class="menu-card g-with shine" onclick="window.location.href='withdraw.html'">
            <i class="fas fa-wallet mc-icon"></i>
            <span class="mc-text">Withdraw</span>
        </div>

        <div class="menu-card g-vip shine" onclick="window.location.href='vip_level.html'">
            <i class="fas fa-crown mc-icon"></i>
            <span class="mc-text">VIP Level</span>
        </div>

        <div class="menu-card g-game shine" onclick="window.location.href='question_game.html'">
            <i class="fas fa-gamepad mc-icon"></i>
            <span class="mc-text">Quiz Game</span>
        </div>

        <div class="menu-card g-club shine" onclick="window.location.href='vip_club.html'">
            <i class="fas fa-gem mc-icon"></i>
            <span class="mc-text">VIP Club</span>
        </div>
        
        <div class="menu-card g-task shine" onclick="window.location.href='weekly.html'">
            <i class="fas fa-calendar-week mc-icon"></i>
            <span class="mc-text">4X Plan</span>
        </div>

        <div class="menu-card g-team shine" onclick="window.location.href='monthly.html'">
            <i class="fas fa-calendar-alt mc-icon"></i>
            <span class="mc-text">Monthly</span>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.database();
        let isVoiceReady = false;

        function unlockAudio() {
            if(isVoiceReady) return;
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
            isVoiceReady = true;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('users/' + user.uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        // Check active status
                        if(data.status !== 'active') {
                            window.location.href = 'account_active.html';
                            return;
                        }

                        // Remove Loader
                        document.getElementById('loader').style.display = 'none';

                        // 1. Basic Info
                        document.getElementById('userId').innerText = data.ownCode || user.uid.substring(0,6);
                        if(data.profilePic) document.getElementById('headProfile').src = data.profilePic;

                        // 2. Financials (Taka)
                        document.getElementById('mainBalance').innerText = (data.balance || 0).toFixed(2);
                        document.getElementById('totalIncome').innerText = (data.total_income || data.totalEarning || 0);
                        document.getElementById('todayIncome').innerText = (data.today_income || data.todayEarning || 0);

                        // 3. Team Counters Logic
                        // Direct Partners (সরাসরি আপনার রেফার লিংক ব্যবহারকারীরা)
                        if(data.ownCode) {
                            db.ref('users').orderByChild('referredBy').equalTo(data.ownCode).on('value', (snap) => {
                                document.getElementById('partnerCount').innerText = snap.numChildren();
                            });

                            // Total Team (যদি ডেটাবেসে teamCount সেভ করা থাকে, তবে সেটা দেখাবে। 
                            // নাহলে, আপাতত 0 দেখাবে কারণ হোম পেজে পুরো ট্রি ক্যালকুলেট করলে পেজ স্লো হয়ে যাবে)
                            // তবে আপনি চাইলে partnerCount এবং team_member ফিল্ড ডেটাবেসে আপডেট রাখলে এখানে শো করবে।
                            
                            // Option A: Database stored value (Fastest)
                            let totalTeam = 0;
                            if(data.teamCount) totalTeam = data.teamCount;
                            else if (data.team_member) totalTeam = data.team_member;
                            
                            // If user has direct partners but no team count stored, at least show partners count
                            // Note: For full recursive team count on Home, backend Cloud Functions are recommended.
                            // Here we display what is stored or calculate basic L1.
                            document.getElementById('teamCount').innerText = totalTeam || document.getElementById('partnerCount').innerText; 
                        }

                        // Voice Welcome (Once)
                        if(!localStorage.getItem('home_voice_played')) {
                            speak("Welcome to your Premium Dashboard");
                            localStorage.setItem('home_voice_played', 'true');
                        }
                    } else {
                        window.location.href = 'login_register.html';
                    }
                });
            } else {
                window.location.href = 'login_register.html';
            }
        });
    </script>
</body>
</html>
