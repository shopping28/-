<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOPPING28 | Premium Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === PREMIUM VARIABLES === */
        :root {
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-gold: #ffd700;
            --neon-blue: #00f2ff;
            --neon-green: #00ff88;
            --neon-purple: #bc13fe;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0; padding: 0; padding-bottom: 90px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* AMBIENT BACKGROUND LIGHTS */
        .ambient-light { position: fixed; border-radius: 50%; filter: blur(90px); z-index: -1; opacity: 0.4; }
        .al-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: radial-gradient(circle, #4c00ff, transparent); }
        .al-2 { bottom: 10%; right: -10%; width: 250px; height: 250px; background: radial-gradient(circle, #ff0055, transparent); }

        /* HEADER */
        .header {
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.4rem; font-weight: 900; letter-spacing: 1px; }
        .logo span { background: linear-gradient(to right, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .id-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px; border-radius: 30px;
            font-size: 0.8rem; font-weight: 700; letter-spacing: 1px;
            color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);
        }

        /* GLASS CARD COMMON STYLE */
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin: 15px 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
        }

        /* PROFILE SECTION */
        .profile-container { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .profile-img-box {
            width: 65px; height: 65px; border-radius: 50%;
            padding: 3px; background: linear-gradient(135deg, #00f2ff, #bc13fe);
            position: relative;
        }
        .profile-img-box img {
            width: 100%; height: 100%; border-radius: 50%;
            object-fit: cover; border: 3px solid #000;
        }
        .user-details h3 { margin: 0; font-size: 1.2rem; font-weight: 700; }
        .user-details p { margin: 3px 0 0; color: var(--text-muted); font-size: 0.85rem; }
        .setting-icon { margin-left: auto; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; transition: 0.3s; }
        .setting-icon:hover { color: #fff; transform: rotate(90deg); }

        /* LINK BOX */
        .link-wrapper {
            background: rgba(0,0,0,0.3);
            border-radius: 12px; padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .link-txt { font-family: monospace; color: var(--neon-blue); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; max-width: 70%; white-space: nowrap; }
        .copy-btn {
            background: var(--neon-blue); color: #000;
            border: none; padding: 6px 15px; border-radius: 20px;
            font-weight: 800; font-size: 0.75rem; cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
            transition: 0.2s;
        }
        .copy-btn:active { transform: scale(0.95); }

        /* STATS GRID (Partners & Team) */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 0 20px; }
        .stat-box {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 20px; border-radius: 18px; position: relative;
        }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
        .stat-num { font-size: 1.8rem; font-weight: 800; margin-top: 10px; color: #fff; }
        .stat-icon { position: absolute; right: 15px; top: 15px; font-size: 1.5rem; opacity: 0.1; color: #fff; }

        /* PROFIT SECTION */
        .profit-card {
            display: flex; flex-direction: column; gap: 15px;
        }
        .profit-row { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .profit-row:last-child { border-bottom: none; padding-bottom: 0; padding-top: 5px; }
        .p-title { font-size: 0.9rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .d-gold { background: var(--neon-gold); box-shadow: 0 0 8px var(--neon-gold); }
        .d-green { background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }
        
        .p-value { font-size: 1.2rem; font-weight: 700; }
        .val-gold { color: var(--neon-gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        .val-green { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }

        /* PROGRAMS HEADER */
        .section-title { margin: 25px 20px 10px; font-size: 1rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }

        /* PREMIUM ACTION BUTTONS */
        .program-btn {
            margin: 0 20px 15px;
            height: 90px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex; flex-direction: column; justify-content: center; padding: 0 25px;
            transition: transform 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .program-btn:active { transform: scale(0.98); }

        /* Gradients */
        .bg-task { background: linear-gradient(90deg, #FF9966 0%, #FF5E62 100%); }
        .bg-withdraw { background: linear-gradient(90deg, #4776E6 0%, #8E54E9 100%); }
        .bg-vip { background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%); }

        .btn-content { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; }
        .btn-text h4 { margin: 0; font-size: 1.3rem; font-weight: 900; text-transform: uppercase; font-style: italic; }
        .btn-text p { margin: 2px 0 0; font-size: 0.8rem; font-weight: 500; opacity: 0.9; }
        
        .action-pill {
            background: #fff; color: #000;
            padding: 8px 20px; border-radius: 30px;
            font-weight: 800; font-size: 0.8rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 5px;
        }

        /* Shine Animation */
        .shine::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg); animation: shine 4s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        /* MORE SECTION */
        .more-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 0 20px; }
        .more-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: 15px; padding: 20px; text-align: center; cursor: pointer;
        }
        .more-card i { font-size: 1.5rem; margin-bottom: 10px; display: block; }
        .more-card span { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

        /* LOADER */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; justify-content: center; align-items: center;
            font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.5rem; letter-spacing: 2px;
        }
        #loader span { color: var(--neon-blue); }

    </style>
</head>
<body onclick="unlockAudio()">

    <div id="loader">SHOPPING<span>28</span></div>

    <!-- Background Ambience -->
    <div class="ambient-light al-1"></div>
    <div class="ambient-light al-2"></div>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">SHOPPING<span>28</span></div>
        <div class="id-pill" id="headerCode">ID: ...</div>
    </div>

    <!-- PROFILE CARD -->
    <div class="glass-card">
        <div class="profile-container">
            <div class="profile-img-box" onclick="window.location.href='account.html'">
                <img id="u_img" src="https://i.ibb.co/tZ26z1q/default-profile.png" alt="User">
            </div>
            <div class="user-details">
                <h3 id="u_name">Loading...</h3>
                <p id="u_joined">Joined: Recent</p>
            </div>
            <i class="fas fa-cog setting-icon" onclick="window.location.href='account.html'"></i>
        </div>

        <div class="link-wrapper">
            <div class="link-txt" id="refLinkText">shopping28.io/b/...</div>
            <button class="copy-btn" onclick="copyRef()">Copy</button>
        </div>
    </div>

    <!-- STATS (Partners & Team) -->
    <div class="stats-grid">
        <div class="stat-box" onclick="window.location.href='my_team.html'">
            <div class="stat-label">Partners <i class="fas fa-info-circle"></i></div>
            <div class="stat-num" id="partnerCount">0</div>
            <i class="fas fa-user-friends stat-icon"></i>
        </div>
        <div class="stat-box" onclick="window.location.href='my_team.html'">
            <div class="stat-label">Team <i class="fas fa-info-circle"></i></div>
            <div class="stat-num" id="teamCount">0</div>
            <i class="fas fa-users stat-icon"></i>
        </div>
    </div>

    <!-- PROFIT SECTION -->
    <div class="glass-card profit-card">
        <div class="profit-row">
            <div class="p-title"><div class="dot d-gold"></div> Total Profit</div>
            <div class="p-value val-gold">৳ <span id="totalProfit">0.00</span></div>
        </div>
        <div class="profit-row">
            <div class="p-title"><div class="dot d-green"></div> Current Balance</div>
            <div class="p-value val-green">৳ <span id="currentBalance">0.00</span></div>
        </div>
    </div>

    <!-- PROGRAMS -->
    <div class="section-title">Shopping28 Programs</div>

    <div class="program-btn bg-task shine" onclick="window.location.href='task.html'">
        <div class="btn-content">
            <div class="btn-text">
                <h4>Daily Task</h4>
                <p>Earn Daily Income</p>
            </div>
            <div class="action-pill">Start <i class="fas fa-chevron-right"></i></div>
        </div>
    </div>

    <div class="program-btn bg-withdraw shine" onclick="window.location.href='withdraw.html'">
        <div class="btn-content">
            <div class="btn-text">
                <h4>Withdraw</h4>
                <p>Cashout Money</p>
            </div>
            <div class="action-pill" style="color:#4776E6">Go <i class="fas fa-chevron-right"></i></div>
        </div>
    </div>

    <div class="program-btn bg-vip shine" onclick="window.location.href='vip_level.html'">
        <div class="btn-content">
            <div class="btn-text">
                <h4>VIP Levels</h4>
                <p>Upgrade Status</p>
            </div>
            <div class="action-pill" style="color:#11998e">View <i class="fas fa-chevron-right"></i></div>
        </div>
    </div>

    <!-- MORE SECTION -->
    <div class="section-title">More Options</div>
    <div class="more-grid">
        <div class="more-card" onclick="window.location.href='monthly.html'">
            <i class="fas fa-calendar-alt" style="color: #bc13fe;"></i>
            <span>Monthly</span>
        </div>
        <div class="more-card" onclick="window.location.href='question_game.html'">
            <i class="fas fa-gamepad" style="color: #ff0055;"></i>
            <span>Quiz Game</span>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.database();
        let isVoiceReady = false;

        function unlockAudio() {
            if(isVoiceReady) return;
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
            isVoiceReady = true;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('users/' + user.uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        if(data.status !== 'active') { window.location.href = 'account_active.html'; return; }
                        
                        document.getElementById('loader').style.display = 'none';

                        // Profile Info
                        document.getElementById('u_name').innerText = data.firstName;
                        document.getElementById('headerCode').innerText = "ID: " + (data.ownCode || "...");
                        document.getElementById('u_joined').innerText = "Joined: " + (data.joinDate || "Recent");
                        if(data.profilePic) document.getElementById('u_img').src = data.profilePic;

                        // Link Box
                        const link = `shopping28.io/b/${data.ownCode}`;
                        document.getElementById('refLinkText').innerText = link;

                        // Balance & Profit
                        document.getElementById('currentBalance').innerText = (data.balance || 0).toFixed(2);
                        document.getElementById('totalProfit').innerText = (data.total_income || data.totalEarning || 0).toFixed(2);

                        // Partners & Team Logic
                        if(data.ownCode) {
                            // Direct Partners
                            db.ref('users').orderByChild('referredBy').equalTo(data.ownCode).on('value', (snap) => {
                                document.getElementById('partnerCount').innerText = snap.numChildren();
                            });
                            
                            // Team Count
                            let tCount = data.teamCount || data.team_member || document.getElementById('partnerCount').innerText;
                            document.getElementById('teamCount').innerText = tCount;
                        }

                        // Welcome Voice
                        if(!localStorage.getItem('home_voice_played')) {
                            speak("Welcome to Shopping 28 Premium Dashboard");
                            localStorage.setItem('home_voice_played', 'true');
                        }
                    }
                });
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function copyRef() {
            const code = document.getElementById('headerCode').innerText.replace("ID: ", "");
            const fullLink = `https://shopping28.github.io/-/login_register.html?ref=${code}`;
            navigator.clipboard.writeText(fullLink).then(() => {
                alert("Referral Link Copied!");
            });
        }
    </script>
</body>
</html>
