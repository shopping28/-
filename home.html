<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Premium Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link to the separate CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body onclick="unlockAudio()">

    <!-- ULTRA PREMIUM BACKGROUND -->
    <div class="premium-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="mesh-overlay"></div>
    </div>

    <!-- HEADER -->
    <header class="header">
        <div class="user-info">
            <h2>Hi, <span id="userName">Loading...</span></h2>
            <div id="userStatus" class="badge inact">
                <i class="fas fa-circle-notch fa-spin"></i> Checking...
            </div>
        </div>
        <div class="profile-container">
            <div class="profile-btn" id="profileBtn" onclick="checkAccess('account.html')">
                <i class="fas fa-user-astronaut"></i>
            </div>
        </div>
    </header>

    <!-- DASHBOARD CONTAINER -->
    <main class="dashboard-container">

        <!-- Activate Banner (Special Card) -->
        <div id="activateBanner" class="card special-card" onclick="window.location.href='account_active.html'">
            <div class="card-glow"></div>
            <div class="card-content">
                <div class="icon-box icon-activate">
                    <i class="fas fa-rocket"></i>
                </div>
                <div class="text-box">
                    <h3>ACTIVATE NOW</h3>
                    <p>Unlock Your Earning Potential</p>
                </div>
            </div>
            <div class="action-icon">
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>

        <!-- Menu Grid -->
        <div class="menu-grid">
            
            <div class="card glass-card" onclick="checkAccess('task.html')">
                <div class="card-content">
                    <div class="icon-box icon-task"><i class="fas fa-clipboard-list"></i></div>
                    <div class="text-box"><h3>Daily Task</h3></div>
                </div>
                <div class="lock-overlay" id="lock_task"><i class="fas fa-lock"></i></div>
            </div>

            <div class="card glass-card" onclick="checkAccess('my_team.html')">
                <div class="card-content">
                    <div class="icon-box icon-team"><i class="fas fa-users"></i></div>
                    <div class="text-box"><h3>My Team</h3></div>
                </div>
                <div class="lock-overlay" id="lock_team"><i class="fas fa-lock"></i></div>
            </div>

            <div class="card glass-card" onclick="checkAccess('withdraw.html')">
                <div class="card-content">
                    <div class="icon-box icon-withdraw"><i class="fas fa-wallet"></i></div>
                    <div class="text-box"><h3>Withdraw</h3></div>
                </div>
                <div class="lock-overlay" id="lock_withdraw"><i class="fas fa-lock"></i></div>
            </div>

            <div class="card glass-card" onclick="checkAccess('vip_level.html')">
                <div class="card-content">
                    <div class="icon-box icon-vip"><i class="fas fa-crown"></i></div>
                    <div class="text-box"><h3>VIP Level</h3></div>
                </div>
                <div class="lock-overlay" id="lock_vip"><i class="fas fa-lock"></i></div>
            </div>

            <div class="card glass-card" onclick="checkAccess('question_game.html')">
                <div class="card-content">
                    <div class="icon-box icon-quiz"><i class="fas fa-gamepad"></i></div>
                    <div class="text-box"><h3>Quiz Game</h3></div>
                </div>
                <div class="lock-overlay" id="lock_quiz"><i class="fas fa-lock"></i></div>
            </div>

            <!-- 4X Program -->
            <div class="card glass-card" onclick="checkAccess('weekly.html')">
                <div class="card-content">
                    <div class="icon-box icon-weekly"><i class="fas fa-bolt"></i></div>
                    <div class="text-box"><h3>4X Program</h3></div>
                </div>
                <div class="lock-overlay" id="lock_weekly"><i class="fas fa-lock"></i></div>
            </div>

            <!-- Monthly (With Countdown) -->
            <div class="card glass-card" onclick="window.location.href='monthly.html'">
                <div class="card-content">
                    <div class="icon-box icon-monthly"><i class="fas fa-calendar-alt"></i></div>
                    <div class="text-box"><h3>Monthly</h3></div>
                </div>
                <div class="lock-overlay open-info"><i class="fas fa-clock"></i> <span>16 Days</span></div>
            </div>

            <div class="card glass-card" onclick="checkAccess('vip_club.html')">
                <div class="card-content">
                    <div class="icon-box icon-club"><i class="fas fa-gem"></i></div>
                    <div class="text-box"><h3>VIP Club</h3></div>
                </div>
                <div class="lock-overlay" id="lock_vip_club"><i class="fas fa-lock"></i></div>
            </div>

        </div>
    </main>

    <!-- JS Logic (Kept unchanged) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", 
            authDomain: "art-paid-work001.firebaseapp.com", 
            databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", 
            projectId: "art-paid-work001", 
            storageBucket: "art-paid-work001.firebasestorage.app", 
            messagingSenderId: "524647364992", 
            appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" 
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUserStatus = 'inactive';
        let isVoiceReady = false;
        let pendingMsg = "";

        function unlockAudio() {
            if(isVoiceReady) return;
            const synth = window.speechSynthesis;
            const u = new SpeechSynthesisUtterance("");
            synth.speak(u);
            isVoiceReady = true;
            if(pendingMsg) { speakNow(pendingMsg); pendingMsg = ""; }
        }

        function speak(text) {
            if(isVoiceReady) { speakNow(text); } else { pendingMsg = text; }
        }

        function speakNow(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; utterance.rate = 0.9; utterance.pitch = 1; utterance.volume = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('users/' + user.uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        document.getElementById('userName').innerText = data.firstName || "User";
                        currentUserStatus = data.status || 'inactive';
                        updateUI(currentUserStatus);
                        if(data.profilePic) { document.getElementById('profileBtn').innerHTML = `<img src="${data.profilePic}">`; }
                        if(currentUserStatus === 'active' && !localStorage.getItem('activation_voice_played')) {
                            speak("Your account active successful so start network marketing journey");
                            localStorage.setItem('activation_voice_played', 'true');
                        }
                    } else {
                        document.getElementById('userName').innerText = "No Data";
                        updateUI('inactive');
                    }
                });
                db.ref('withdraw_requests').orderByChild('uid').equalTo(user.uid).on('child_changed', (snapshot) => {
                    const req = snapshot.val();
                    if(req && req.status === 'approved') {
                        speak("Your withdraw successfully accept then you work first and more withdraw and more earning best of luck for shopping28 and the art community");
                        if("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
                    }
                });
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function updateUI(status) {
            const badge = document.getElementById('userStatus');
            const banner = document.getElementById('activateBanner');
            const locks = ['lock_task', 'lock_team', 'lock_withdraw', 'lock_vip', 'lock_quiz', 'lock_vip_club', 'lock_weekly'];
            
            if(!badge || !banner) return;
            
            if (status === 'active') {
                badge.innerHTML = 'ACTIVE <i class="fas fa-check-circle"></i>'; 
                badge.className = "badge act"; 
                banner.style.display = 'none';
                locks.forEach(id => { const el = document.getElementById(id); if(el) el.style.display = 'none'; });
            } else {
                badge.innerHTML = 'INACTIVE <i class="fas fa-times-circle"></i>'; 
                badge.className = "badge inact"; 
                banner.style.display = 'flex';
                locks.forEach(id => { const el = document.getElementById(id); if(el) el.style.display = 'flex'; });
            }
        }

        function checkAccess(url) {
            if (currentUserStatus === 'active') { window.location.href = url; } 
            else { if("vibrate" in navigator) navigator.vibrate(200); alert("⛔ ACCOUNT LOCKED!\n\nApni Account Active koren nai."); }
        }
    </script>
</body>
</html>
