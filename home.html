<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Colorful Premium</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === COLORFUL THEME VARIABLES === */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-white: #ffffff;
            --text-gray: #e0e0e0;
            --neon-blue: #00f2ff;
            --neon-pink: #ff0099;
            --neon-purple: #9d00ff;
        }

        body {
            margin: 0; 
            padding-bottom: 90px; 
            color: var(--text-white); 
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            /* Animated Gradient Background */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #3a1c71, #d76d77, #ffaf7b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated Glowing Orbs (Floating Colors) */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite alternate;
        }
        .orb-1 { width: 200px; height: 200px; background: var(--neon-purple); top: 10%; left: -50px; }
        .orb-2 { width: 250px; height: 250px; background: var(--neon-blue); bottom: 20%; right: -60px; animation-delay: 2s; }
        .orb-3 { width: 150px; height: 150px; background: var(--neon-pink); top: 40%; left: 40%; animation-delay: 4s; opacity: 0.4; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }

        /* === HEADER === */
        .header {
            padding: 20px 25px; 
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .header h2 { font-size: 1.4rem; font-weight: 800; margin: 0; }
        .header h2 span { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }

        /* === BADGE === */
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; display: inline-block; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .inact { background: #ff4d4d; color: white; box-shadow: 0 0 15px #ff4d4d; }
        .act { background: #00f260; color: #00441b; box-shadow: 0 0 15px #00f260; }

        /* === PROFILE PIC === */
        .profile-btn {
            width: 50px; height: 50px; 
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center; 
            border: 2px solid white; 
            cursor: pointer; overflow: hidden;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            transition: 0.3s;
        }
        .profile-btn:active { transform: scale(0.9); }
        .profile-btn img { width: 100%; height: 100%; object-fit: cover; }

        /* === ACTIVATE BANNER === */
        .activate-box {
            margin: 25px 20px; padding: 20px; 
            background: linear-gradient(135deg, #ff0099, #493240);
            border-radius: 20px; 
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; 
            box-shadow: 0 10px 20px rgba(255, 0, 153, 0.4);
            border: 1px solid rgba(255,255,255,0.3);
            position: relative; overflow: hidden;
        }
        .activate-box::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer { 0% {left: -100%;} 100% {left: 200%;} }

        /* === GRID & CARDS === */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        
        .card {
            background: var(--glass-bg); 
            padding: 20px 10px; 
            border-radius: 20px; 
            text-align: center;
            border: 1px solid var(--glass-border); 
            position: relative; overflow: hidden; 
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .card:hover { transform: translateY(-5px); border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }
        .card:active { transform: scale(0.95); }

        .card i.icon { font-size: 2.2rem; margin-bottom: 10px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
        
        .card div { font-size: 0.9rem; font-weight: 600; color: var(--text-white); letter-spacing: 0.5px; }

        /* Colorful Icons */
        .c-task { color: #ffe259; background: linear-gradient(to bottom, #ffe259, #ffa751); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .c-team { color: #56CCF2; background: linear-gradient(to bottom, #56CCF2, #2F80ED); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .c-with { color: #00f260; background: linear-gradient(to bottom, #00f260, #0575E6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .c-vip { color: #DA22FF; background: linear-gradient(to bottom, #DA22FF, #9733EE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* === LOCK LAYER === */
        .lock-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); z-index: 10; border-radius: 20px;
        }
        .lock-layer i { font-size: 1.5rem; color: #ff4d4d; margin-bottom: 5px; animation: shake 2s infinite; }
        @keyframes shake { 0%, 100% {transform: rotate(0deg);} 25% {transform: rotate(-10deg);} 75% {transform: rotate(10deg);} }
        .lock-layer span { font-size: 0.7rem; color: #fff; font-weight: bold; }

        /* Particles Container */
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }
    </style>
</head>
<body onclick="unlockAudio()">

    <!-- Background Elements -->
    <div id="particles-js"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="header">
        <div>
            <h2 style="margin:0;">Hi, <span id="userName">Loading...</span></h2>
            <span id="userStatus" class="badge inact">Checking...</span>
        </div>
        <div class="profile-btn" id="profileBtn" onclick="checkAccess('account.html')">
            <i class="fas fa-user"></i>
        </div>
    </div>

    <div id="activateBanner" class="activate-box" onclick="window.location.href='account_active.html'">
        <div>
            <b style="font-size:1.2rem; color: white;">ACTIVATE NOW</b><br>
            <small style="color: #eee;">Start Your Earning Journey</small>
        </div>
        <i class="fas fa-rocket fa-spin" style="font-size: 1.8rem; --fa-animation-duration: 3s; color: white;"></i>
    </div>

    <div class="grid">
        <div class="card" onclick="checkAccess('task.html')">
            <i class="fas fa-clipboard-check icon c-task"></i><div>Daily Task</div>
            <div class="lock-layer" id="lock_task"><i class="fas fa-lock"></i><span>Locked</span></div>
        </div>
        <div class="card" onclick="checkAccess('my_team.html')">
            <i class="fas fa-users icon c-team"></i><div>My Team</div>
            <div class="lock-layer" id="lock_team"><i class="fas fa-lock"></i><span>Locked</span></div>
        </div>
        <div class="card" onclick="checkAccess('withdraw.html')">
            <i class="fas fa-wallet icon c-with"></i><div>Withdraw</div>
            <div class="lock-layer" id="lock_withdraw"><i class="fas fa-lock"></i><span>Locked</span></div>
        </div>
        <div class="card" onclick="checkAccess('vip_level.html')">
            <i class="fas fa-crown icon c-vip"></i><div>VIP Level</div>
            <div class="lock-layer" id="lock_vip"><i class="fas fa-lock"></i><span>Locked</span></div>
        </div>
        
        <div class="card" onclick="checkAccess('question_game.html')">
            <i class="fas fa-gamepad icon" style="color: #ff9966;"></i><div>Quiz Game</div>
            <div class="lock-layer" id="lock_quiz"><i class="fas fa-lock"></i><span>Locked</span></div>
        </div>
        
        <div class="card" onclick="window.location.href='weekly.html'">
            <i class="fas fa-gift icon" style="color: #ff5e62;"></i><div>Weekly</div>
            <div class="lock-layer"><i class="fas fa-clock"></i><span>16 Days</span></div>
        </div>
        <div class="card" onclick="window.location.href='monthly.html'">
            <i class="fas fa-calendar-alt icon" style="color: #56CCF2;"></i><div>Monthly</div>
            <div class="lock-layer"><i class="fas fa-clock"></i><span>16 Days</span></div>
        </div>

        <div class="card" onclick="checkAccess('vip_club.html')">
            <i class="fas fa-gem icon" style="color:#f1c40f;"></i><div>VIP Club</div>
            <div class="lock-layer" id="lock_vip_club"><i class="fas fa-lock"></i><span>Locked</span></div>
        </div>
    </div>

    <div id="voiceTrigger" style="display:none;"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Particles JS Library -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script>
        // --- 1. PARTICLES ANIMATION CONFIG (UPDATED) ---
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": true },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 2, "direction": "none", "random": true, "out_mode": "out" }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" } },
                "modes": { "repulse": { "distance": 100, "duration": 0.4 } }
            },
            "retina_detect": true
        });

        // --- 2. FIREBASE & LOGIC (NO CHANGES) ---
        const firebaseConfig = { 
            apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", 
            authDomain: "art-paid-work001.firebaseapp.com", 
            databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", 
            projectId: "art-paid-work001", 
            storageBucket: "art-paid-work001.firebasestorage.app", 
            messagingSenderId: "524647364992", 
            appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" 
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUserStatus = 'inactive';
        let isVoiceReady = false;
        let pendingMsg = "";

        function unlockAudio() {
            if(isVoiceReady) return;
            const synth = window.speechSynthesis;
            const u = new SpeechSynthesisUtterance("");
            synth.speak(u);
            isVoiceReady = true;
            if(pendingMsg) { speakNow(pendingMsg); pendingMsg = ""; }
        }

        function speak(text) {
            if(isVoiceReady) { speakNow(text); } else { pendingMsg = text; }
        }

        function speakNow(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; utterance.rate = 0.9; utterance.pitch = 1; utterance.volume = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('users/' + user.uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        document.getElementById('userName').innerText = data.firstName || "User";
                        currentUserStatus = data.status || 'inactive';
                        updateUI(currentUserStatus);
                        if(data.profilePic) { document.getElementById('profileBtn').innerHTML = `<img src="${data.profilePic}">`; }

                        if(currentUserStatus === 'active') {
                            if(!localStorage.getItem('activation_voice_played')) {
                                speak("Your account active successful so start network marketing journey");
                                localStorage.setItem('activation_voice_played', 'true');
                            }
                        }
                    } else {
                        document.getElementById('userName').innerText = "No Data";
                        updateUI('inactive');
                    }
                });

                db.ref('withdraw_requests').orderByChild('uid').equalTo(user.uid).on('child_changed', (snapshot) => {
                    const req = snapshot.val();
                    if(req && req.status === 'approved') {
                        speak("Your withdraw successfully accept then you work first and more withdraw and more earning best of luck for shopping28 and the art community");
                        if("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
                    }
                });
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function updateUI(status) {
            const badge = document.getElementById('userStatus');
            const banner = document.getElementById('activateBanner');
            const locks = ['lock_task', 'lock_team', 'lock_withdraw', 'lock_vip', 'lock_quiz', 'lock_vip_club'];
            if(!badge || !banner) return;
            if (status === 'active') {
                badge.innerText = "ACTIVE"; badge.className = "badge act"; banner.style.display = 'none';
                locks.forEach(id => { const el = document.getElementById(id); if(el) el.style.display = 'none'; });
            } else {
                badge.innerText = "INACTIVE"; badge.className = "badge inact"; banner.style.display = 'flex';
                locks.forEach(id => { const el = document.getElementById(id); if(el) el.style.display = 'flex'; });
            }
        }

        function checkAccess(url) {
            if (currentUserStatus === 'active') { window.location.href = url; } 
            else { if("vibrate" in navigator) navigator.vibrate(200); alert("⛔ ACCOUNT LOCKED!\n\nApni Account Active koren nai."); }
        }
    </script>
</body>
</html>
