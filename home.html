<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* DARK PREMIUM THEME */
        body { background: #0f0c29; font-family: 'Poppins', sans-serif; margin: 0; padding-bottom: 80px; color: white; }
        
        .header {
            padding: 20px; background: linear-gradient(to right, #24243e, #0f0c29);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .badge { padding: 5px 12px; border-radius: 15px; font-size: 0.7rem; font-weight: bold; margin-top: 5px; display: inline-block; }
        .inact { background: #e74c3c; color: white; box-shadow: 0 0 10px #e74c3c; }
        .act { background: #00f260; color: black; box-shadow: 0 0 10px #00f260; }

        /* Activation Banner */
        .activate-box {
            margin: 20px; padding: 15px; background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border-radius: 15px; display: flex; justify-content: space-between; align-items: center;
            animation: pulse 2s infinite; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
        }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.02);} 100% {transform: scale(1);} }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        
        .card {
            background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; text-align: center;
            border: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; transition: 0.3s;
        }
        .card:active { transform: scale(0.95); }
        .card i.icon { font-size: 2rem; margin-bottom: 10px; }
        
        .lock-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 41, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(3px); z-index: 10;
        }
        .lock-layer i { font-size: 1.5rem; color: #e74c3c; margin-bottom: 5px; }
        .lock-layer span { font-size: 0.7rem; color: #aaa; font-weight: bold; }
        
        .c-task { color: #ff9a9e; } .c-team { color: #a18cd1; } .c-with { color: #84fab0; } .c-vip { color: #fccb90; }

        .profile-btn {
            width: 45px; height: 45px; background: #1a1a2e; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; border: 2px solid #333; cursor: pointer; overflow: hidden;
        }
        .profile-btn img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body onclick="unlockAudio()">

    <div class="header">
        <div>
            <!-- লোডিং আইডি এখানে ঠিক আছে -->
            <h2 style="margin:0;">Hi, <span id="userName">Loading...</span></h2>
            <span id="userStatus" class="badge inact">Checking...</span>
        </div>
        <div class="profile-btn" id="profileBtn" onclick="checkAccess('account.html')">
            <i class="fas fa-user"></i>
        </div>
    </div>

    <div id="activateBanner" class="activate-box" onclick="window.location.href='account_active.html'">
        <div>
            <b style="font-size:1.1rem;">Activate Account</b><br>
            <small style="color:#eee;">Unlock All Features Now</small>
        </div>
        <i class="fas fa-chevron-right"></i>
    </div>

    <div class="grid">
        <div class="card" onclick="checkAccess('task.html')">
            <i class="fas fa-tasks icon c-task"></i><div>Daily Task</div>
            <div class="lock-layer" id="lock_task"><i class="fas fa-lock"></i><span>Activate First</span></div>
        </div>
        <div class="card" onclick="checkAccess('my_team.html')">
            <i class="fas fa-users icon c-team"></i><div>My Team</div>
            <div class="lock-layer" id="lock_team"><i class="fas fa-lock"></i><span>Activate First</span></div>
        </div>
        <div class="card" onclick="checkAccess('withdraw.html')">
            <i class="fas fa-wallet icon c-with"></i><div>Withdraw</div>
            <div class="lock-layer" id="lock_withdraw"><i class="fas fa-lock"></i><span>Activate First</span></div>
        </div>
        <div class="card" onclick="checkAccess('vip_level.html')">
            <i class="fas fa-crown icon c-vip"></i><div>VIP Level</div>
            <div class="lock-layer" id="lock_vip"><i class="fas fa-lock"></i><span>Activate First</span></div>
        </div>
        
        <div class="card" onclick="checkAccess('question_game.html')">
            <i class="fas fa-gamepad icon c-vip"></i><div>Quiz Game</div>
            <div class="lock-layer" id="lock_quiz"><i class="fas fa-lock"></i><span>Activate First</span></div>
        </div>
        
        <div class="card" onclick="window.location.href='weekly.html'">
            <i class="fas fa-calendar-week icon" style="color:#fff;"></i><div>Weekly</div>
            <div class="lock-layer"><i class="fas fa-clock"></i><span>16 Days</span></div>
        </div>
        <div class="card" onclick="window.location.href='monthly.html'">
            <i class="fas fa-calendar-alt icon" style="color:#fff;"></i><div>Monthly</div>
            <div class="lock-layer"><i class="fas fa-clock"></i><span>16 Days</span></div>
        </div>

        <div class="card" onclick="checkAccess('vip_club.html')">
            <i class="fas fa-gem icon" style="color:#f1c40f;"></i><div>VIP Club</div>
            <div class="lock-layer" id="lock_vip_club"><i class="fas fa-lock"></i><span>Activate First</span></div>
        </div>

    </div>

    <div id="voiceTrigger" style="display:none;"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // আপনার কনফিগারেশন
        const firebaseConfig = { 
            apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", 
            authDomain: "art-paid-work001.firebaseapp.com", 
            databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", 
            projectId: "art-paid-work001", 
            storageBucket: "art-paid-work001.firebasestorage.app", 
            messagingSenderId: "524647364992", 
            appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" 
        };
        
        // ফায়ারবেস ইনিশিয়ালাইজেশন চেক
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUserStatus = 'inactive';
        let isVoiceReady = false;
        let pendingMsg = "";

        // --- AUDIO FUNCTIONS ---
        function unlockAudio() {
            if(isVoiceReady) return;
            const synth = window.speechSynthesis;
            const u = new SpeechSynthesisUtterance("");
            synth.speak(u);
            isVoiceReady = true;
            if(pendingMsg) { speakNow(pendingMsg); pendingMsg = ""; }
        }

        function speak(text) {
            if(isVoiceReady) { speakNow(text); } else { pendingMsg = text; }
        }

        function speakNow(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; utterance.rate = 0.9; utterance.pitch = 1; utterance.volume = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // --- MAIN LOGIC ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log("User Logged In:", user.uid);

                // ইউজারের ডাটা ফেচ করা
                db.ref('users/' + user.uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    console.log("Database Data:", data); // কনসোলে ডাটা চেক করুন

                    if(data) {
                        // যদি ডাটা পাওয়া যায়
                        // 1. নাম সেট করা (যদি firstName না থাকে তবে 'User' দেখাবে)
                        document.getElementById('userName').innerText = data.firstName || "User";
                        
                        // 2. স্ট্যাটাস আপডেট
                        currentUserStatus = data.status || 'inactive';
                        updateUI(currentUserStatus);

                        // 3. প্রোফাইল পিকচার
                        if(data.profilePic) {
                            document.getElementById('profileBtn').innerHTML = `<img src="${data.profilePic}">`;
                        }

                        // 4. ভয়েস মেসেজ
                        if(currentUserStatus === 'active') {
                            if(!localStorage.getItem('activation_voice_played')) {
                                speak("Your account active successful so start network marketing journey");
                                localStorage.setItem('activation_voice_played', 'true');
                            }
                        }
                    } else {
                        // যদি ডাটাবেসে এই ইউজারের কোনো ডাটা না থাকে
                        console.log("Data is null for this user");
                        document.getElementById('userName').innerText = "No Data";
                        updateUI('inactive');
                    }
                }, (error) => {
                    // যদি ডাটাবেস এরর দেয়
                    console.error("Database Error:", error);
                    alert("Data Load Error: " + error.message);
                });

                // উইথড্র রিকোয়েস্ট চেক
                db.ref('withdraw_requests').orderByChild('uid').equalTo(user.uid).on('child_changed', (snapshot) => {
                    const req = snapshot.val();
                    if(req && req.status === 'approved') {
                        speak("Your withdraw successfully accept then you work first and more withdraw and more earning best of luck for shopping28 and the art community");
                        if("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
                    }
                });

            } else {
                // ইউজার লগইন না থাকলে
                console.log("No user logged in");
                window.location.href = 'login_register.html';
            }
        });

        function updateUI(status) {
            const badge = document.getElementById('userStatus');
            const banner = document.getElementById('activateBanner');
            const locks = ['lock_task', 'lock_team', 'lock_withdraw', 'lock_vip', 'lock_quiz', 'lock_vip_club'];

            // UI Elements আছে কিনা চেক করে নেওয়া ভালো, যাতে এরর না দেয়
            if(!badge || !banner) return;

            if (status === 'active') {
                badge.innerText = "ACTIVE";
                badge.className = "badge act";
                banner.style.display = 'none';
                
                locks.forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.style.display = 'none';
                });
            } else {
                badge.innerText = "INACTIVE";
                badge.className = "badge inact";
                banner.style.display = 'flex';
                
                locks.forEach(id => {
                    const el = document.getElementById(id);
                    if(el) el.style.display = 'flex';
                });
            }
        }

        function checkAccess(url) {
            if (currentUserStatus === 'active') {
                window.location.href = url;
            } else {
                if("vibrate" in navigator) navigator.vibrate(200);
                alert("⛔ ACCOUNT LOCKED!\n\nApni Account Active koren nai.");
            }
        }
    </script>
</body>
</html>
