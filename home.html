<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forsage Style Dashboard</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === THEME VARIABLES (Forsage Style) === */
        :root {
            --bg-dark: #0d0d12;
            --card-bg: #1a1b24;
            --card-border: #2d2e3d;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-white: #ffffff;
            --text-grey: #8d8d9b;
            --taka-color: #2ed573;
        }

        body {
            margin: 0; 
            padding: 20px;
            padding-bottom: 90px; 
            color: var(--text-white); 
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 20%, rgba(68, 13, 102, 0.4) 0%, transparent 40%);
        }

        /* ================= HEADER SECTION ================= */
        .header-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-pic-container {
            width: 55px; height: 55px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #00f2ff, #764ba2);
            position: relative;
        }

        .profile-pic {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--card-bg);
            background: #000;
        }

        .user-details h3 {
            margin: 0; font-size: 1.1rem;
            background: linear-gradient(to right, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .user-id {
            color: var(--text-grey);
            font-size: 0.85rem;
            margin-top: 2px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .st-active { background: rgba(46, 213, 115, 0.15); color: #2ed573; border: 1px solid #2ed573; }
        .st-inactive { background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid #ff4757; }

        /* ================= STATS GRID (Partners/Team) ================= */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .stat-card:active { transform: scale(0.98); }

        .stat-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px;
        }
        
        .stat-label { color: var(--text-grey); font-size: 0.9rem; font-weight: 600; }
        .stat-icon { color: var(--accent-purple); font-size: 1.2rem; }
        
        .stat-value { font-size: 1.4rem; font-weight: 800; color: #fff; }

        /* ================= PROFIT / WALLET SECTION ================= */
        .profit-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .profit-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }

        .profit-label { color: var(--text-grey); font-size: 0.9rem; }
        .profit-amount { 
            color: var(--taka-color); 
            font-size: 1.5rem; 
            font-weight: 700; 
            text-shadow: 0 0 10px rgba(46, 213, 115, 0.2);
        }

        /* ================= PROGRAMS (Buttons) ================= */
        .section-title {
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .program-card {
            background: linear-gradient(160deg, #1f1f2e 0%, #16161f 100%);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Specific Gradients for visual variety */
        .p-task { border-left: 4px solid #f6b93b; }
        .p-quiz { border-left: 4px solid #8e44ad; }
        .p-weekly { border-left: 4px solid #3b82f6; }
        .p-activate { background: linear-gradient(90deg, #ff9f43 0%, #ee5253 100%); border: none; }
        
        .prog-content { z-index: 2; display: flex; align-items: center; gap: 15px; }
        .prog-icon { 
            width: 45px; height: 45px; 
            background: rgba(255,255,255,0.05); 
            border-radius: 10px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #fff;
        }
        
        .prog-text h4 { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; }
        .prog-text span { font-size: 0.8rem; color: rgba(255,255,255,0.6); }

        .btn-action {
            background: #2ed573;
            color: #000;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-block;
        }

        /* Lock Overlay (Forsage Style) */
        .lock-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 13, 18, 0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
            border-radius: 15px;
            backdrop-filter: blur(2px);
        }
        .lock-content { text-align: center; color: #ff6b81; }
        .lock-content i { font-size: 1.5rem; margin-bottom: 5px; }
        .lock-content p { margin: 0; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }

        /* Animation */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 159, 67, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 159, 67, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 159, 67, 0); }
        }
        .pulse-anim { animation: pulse 2s infinite; }

    </style>
</head>
<body onclick="unlockAudio()">

    <!-- HEADER (User Info) -->
    <div class="header-section">
        <div class="user-info">
            <div class="profile-pic-container" onclick="checkAccess('account.html')">
                <img src="https://i.ibb.co/5Y3m35q/default-avatar.png" id="profileImg" class="profile-pic" alt="Profile">
            </div>
            <div class="user-details">
                <h3 id="userName">Loading...</h3>
                <div class="user-id">ID: <span id="userId">...</span></div>
            </div>
        </div>
        <div id="userStatus" class="status-badge st-inactive">Checking</div>
    </div>

    <!-- ACTIVATE BANNER (Only visible if inactive) -->
    <div id="activateBanner" class="program-card p-activate pulse-anim" onclick="window.location.href='account_active.html'">
        <div class="prog-content">
            <div class="prog-icon" style="background:rgba(0,0,0,0.2);"><i class="fas fa-rocket"></i></div>
            <div class="prog-text">
                <h4 style="text-transform: uppercase;">Activate Account</h4>
                <span style="color:#fff;">Start earning ৳ Taka now</span>
            </div>
        </div>
        <div class="btn-action" style="background:#fff; color:#ee5253;">GO</div>
    </div>

    <!-- STATS GRID (Partners & Team) -->
    <div class="stats-grid">
        <div class="stat-card" onclick="checkAccess('my_team.html')">
            <div class="stat-header">
                <span class="stat-label">My Team</span>
                <i class="fas fa-users stat-icon"></i>
            </div>
            <div class="stat-value" id="teamCount">0</div>
            <div class="lock-overlay" id="lock_team"><div class="lock-content"><i class="fas fa-lock"></i></div></div>
        </div>

        <div class="stat-card" onclick="checkAccess('vip_level.html')">
            <div class="stat-header">
                <span class="stat-label">VIP Level</span>
                <i class="fas fa-crown stat-icon" style="color: gold;"></i>
            </div>
            <div class="stat-value">LVL 0</div>
            <div class="lock-overlay" id="lock_vip"><div class="lock-content"><i class="fas fa-lock"></i></div></div>
        </div>
    </div>

    <!-- WALLET / PROFIT SECTION -->
    <div class="profit-section" onclick="checkAccess('withdraw.html')">
        <div class="profit-row">
            <span class="profit-label">Total Profit</span>
            <i class="fas fa-ellipsis-h" style="color:#555;"></i>
        </div>
        <div class="profit-amount">৳ <span id="userBalance">0.00</span></div>
        <div style="margin-top: 10px; display:flex; gap:10px;">
            <div class="btn-action" style="width:100%; text-align:center; cursor:pointer;">WITHDRAW</div>
        </div>
        
        <!-- Lock for Withdraw -->
        <div class="lock-overlay" id="lock_withdraw" style="border-radius: 12px;">
            <div class="lock-content">
                <i class="fas fa-lock"></i><p>Locked</p>
            </div>
        </div>
    </div>

    <!-- PROGRAMS LIST (Tasks, Games) -->
    <div class="section-title">Forsage Programs</div>

    <!-- Daily Task -->
    <div class="program-card p-task" onclick="checkAccess('task.html')">
        <div class="prog-content">
            <div class="prog-icon"><i class="fas fa-clipboard-check" style="color:#f6b93b;"></i></div>
            <div class="prog-text">
                <h4>Daily Task</h4>
                <span>Complete & Earn ৳</span>
            </div>
        </div>
        <i class="fas fa-chevron-right" style="color:#555;"></i>
        <div class="lock-overlay" id="lock_task"><div class="lock-content"><i class="fas fa-lock"></i></div></div>
    </div>

    <!-- Quiz Game -->
    <div class="program-card p-quiz" onclick="checkAccess('question_game.html')">
        <div class="prog-content">
            <div class="prog-icon"><i class="fas fa-gamepad" style="color:#8e44ad;"></i></div>
            <div class="prog-text">
                <h4>Quiz Game</h4>
                <span>Play & Win Taka</span>
            </div>
        </div>
        <i class="fas fa-chevron-right" style="color:#555;"></i>
        <div class="lock-overlay" id="lock_quiz"><div class="lock-content"><i class="fas fa-lock"></i></div></div>
    </div>

    <!-- 4X Program (Weekly) -->
    <div class="program-card p-weekly" onclick="checkAccess('weekly.html')">
        <div class="prog-content">
            <div class="prog-icon"><i class="fas fa-layer-group" style="color:#3b82f6;"></i></div>
            <div class="prog-text">
                <h4>4X Program</h4>
                <span>Weekly Reward</span>
            </div>
        </div>
        <i class="fas fa-chevron-right" style="color:#555;"></i>
        <div class="lock-overlay" id="lock_weekly"><div class="lock-content"><i class="fas fa-lock"></i></div></div>
    </div>

    <!-- Monthly Program (No Lock logic in JS for this yet, keeping generic) -->
    <div class="program-card" style="border-left: 4px solid #e056fd;" onclick="window.location.href='monthly.html'">
        <div class="prog-content">
            <div class="prog-icon"><i class="fas fa-calendar-alt" style="color:#e056fd;"></i></div>
            <div class="prog-text">
                <h4>Monthly</h4>
                <span>Big Rewards</span>
            </div>
        </div>
        <div style="font-size:0.8rem; color:#888;">16 Days</div>
    </div>
    
     <!-- VIP Club -->
    <div class="program-card" style="border-left: 4px solid #eb4d4b;" onclick="checkAccess('vip_club.html')">
        <div class="prog-content">
            <div class="prog-icon"><i class="fas fa-gem" style="color:#eb4d4b;"></i></div>
            <div class="prog-text">
                <h4>VIP Club</h4>
                <span>Elite Members</span>
            </div>
        </div>
        <i class="fas fa-chevron-right" style="color:#555;"></i>
        <div class="lock-overlay" id="lock_vip_club"><div class="lock-content"><i class="fas fa-lock"></i></div></div>
    </div>


    <!-- Firebase & Logic Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", 
            authDomain: "art-paid-work001.firebaseapp.com", 
            databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", 
            projectId: "art-paid-work001", 
            storageBucket: "art-paid-work001.firebasestorage.app", 
            messagingSenderId: "524647364992", 
            appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" 
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUserStatus = 'inactive';
        let isVoiceReady = false;

        function unlockAudio() {
            if(isVoiceReady) return;
            const synth = window.speechSynthesis;
            const u = new SpeechSynthesisUtterance("");
            synth.speak(u);
            isVoiceReady = true;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                // Fetch User Data
                db.ref('users/' + user.uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        document.getElementById('userName').innerText = data.firstName || "User";
                        document.getElementById('userId').innerText = user.uid.substring(0, 8).toUpperCase();
                        
                        // Set Balance if exists, else 0
                        let balance = data.balance || 0;
                        document.getElementById('userBalance').innerText = balance;

                        // Set Profile Pic
                        if(data.profilePic) { 
                            document.getElementById('profileImg').src = data.profilePic; 
                        }

                        currentUserStatus = data.status || 'inactive';
                        updateUI(currentUserStatus);

                        if(currentUserStatus === 'active' && !localStorage.getItem('activation_voice_played')) {
                            speak("Your account is active. Start your journey.");
                            localStorage.setItem('activation_voice_played', 'true');
                        }
                    }
                });
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function updateUI(status) {
            const badge = document.getElementById('userStatus');
            const banner = document.getElementById('activateBanner');
            // Locks list
            const locks = ['lock_task', 'lock_team', 'lock_withdraw', 'lock_vip', 'lock_quiz', 'lock_weekly', 'lock_vip_club'];
            
            if (status === 'active') {
                badge.innerText = "ACTIVE"; 
                badge.className = "status-badge st-active"; 
                banner.style.display = 'none'; // Hide Activate Banner
                
                locks.forEach(id => { 
                    const el = document.getElementById(id); 
                    if(el) el.style.display = 'none'; // Remove locks
                });
            } else {
                badge.innerText = "INACTIVE"; 
                badge.className = "status-badge st-inactive"; 
                banner.style.display = 'flex'; // Show Activate Banner
                
                locks.forEach(id => { 
                    const el = document.getElementById(id); 
                    if(el) el.style.display = 'flex'; // Show locks
                });
            }
        }

        function checkAccess(url) {
            if (currentUserStatus === 'active') { 
                window.location.href = url; 
            } else { 
                if("vibrate" in navigator) navigator.vibrate(200); 
                alert("⛔ LOCKED! Please Activate Account First."); 
            }
        }
    </script>
</body>
</html>
