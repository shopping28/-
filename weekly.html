<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Challenge | SHOPPING28</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #050505; --neon-blue: #00f2ff; --glass-bg: rgba(255, 255, 255, 0.05); }
        body { background: var(--bg-dark); color: #fff; font-family: 'Outfit', sans-serif; padding: 20px; padding-bottom: 90px; margin: 0; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { font-size: 1.2rem; color: #fff; }
        
        /* CREDIT CARD */
        .credit-card {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            padding: 20px; border-radius: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3); margin-bottom: 25px;
        }
        .credit-val { font-size: 2.5rem; font-weight: 800; margin: 5px 0; }
        .buy-btn {
            background: #fff; color: #4f46e5; padding: 8px 20px; border-radius: 30px;
            font-weight: 700; border: none; cursor: pointer; margin-top: 10px;
        }

        /* LEVEL CARD */
        .level-card {
            background: var(--glass-bg); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 15px; margin-bottom: 15px;
            position: relative; overflow: hidden;
        }
        .lc-header { display: flex; justify-content: space-between; align-items: center; }
        .lvl-badge { background: rgba(0, 242, 255, 0.1); color: var(--neon-blue); padding: 4px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: 700; }
        .reward { color: #00ff88; font-weight: 800; font-size: 1.1rem; }
        
        .target-desc { margin: 10px 0; font-size: 0.9rem; color: #ccc; }
        .target-desc span { color: #fff; font-weight: 700; }

        .action-btn {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            font-weight: 700; cursor: pointer; margin-top: 10px;
            background: linear-gradient(90deg, #00c6ff, #0072ff); color: #fff;
        }
        .action-btn:disabled { background: #333; color: #777; cursor: not-allowed; }
        
        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 20px; width: 85%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        .inp-field { width: 90%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h3>Weekly Challenge</h3>
    </div>

    <!-- Credit Display -->
    <div class="credit-card">
        <div>Available Credits</div>
        <div class="credit-val" id="userCredits">0</div>
        <button class="buy-btn" onclick="openBuyModal()">Buy Credits <i class="fas fa-plus-circle"></i></button>
    </div>

    <!-- Active Challenge Status (If Any) -->
    <div id="activeStatusArea" style="display:none; margin-bottom: 20px;">
        <div style="background: rgba(0,255,136,0.1); border: 1px solid #00ff88; padding: 15px; border-radius: 15px;">
            <h4 style="margin:0; color:#00ff88">Active Challenge: <span id="activeLvlName"></span></h4>
            <p style="margin:5px 0 10px;">Referrals: <span id="activeProgress">0</span> / <span id="activeTarget">0</span></p>
            <div style="background:#333; height:8px; border-radius:4px; overflow:hidden;">
                <div id="progressBar" style="background:#00ff88; height:100%; width:0%;"></div>
            </div>
            <button id="claimBtn" style="display:none; width:100%; margin-top:10px; background:#00ff88; color:#000; border:none; padding:10px; border-radius:8px; font-weight:bold;" onclick="claimReward()">Claim Reward</button>
        </div>
    </div>

    <!-- Levels List -->
    <div id="levelsContainer"></div>

    <!-- Buy Modal -->
    <div class="modal" id="buyModal">
        <div class="modal-content">
            <h3>Buy Credits</h3>
            <p style="font-size:0.8rem; color:#aaa;">Rate: $1 = <span id="rateDisplay">5</span> Credits</p>
            <p style="font-size:0.8rem; color:#00f2ff;" id="adminAddr">Loading Address...</p>
            
            <input type="number" id="buyAmount" class="inp-field" placeholder="Enter Credits Amount" oninput="calcPrice()">
            <div style="margin-bottom:10px;">Cost: <span id="costDisplay" style="color:#00ff88">0.00</span> USDT</div>
            
            <input type="text" id="trxId" class="inp-field" placeholder="Enter Transaction ID (Hash)">
            
            <button class="action-btn" onclick="submitBuy()">Confirm Purchase</button>
            <button class="action-btn" style="background:#333; margin-top:5px;" onclick="document.getElementById('buyModal').style.display='none'">Cancel</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let currentUser = null;
        let myCredits = 0;
        let creditRate = 5;
        let adminWallet = "";
        let currentActiveTarget = null; // { type, level, startCount, target }

        // Level Configuration
        const LEVELS = [
            { level: 1, target: 5, reward: 2.5, cost: 2 },
            { level: 2, target: 10, reward: 5.0, cost: 4 },
            { level: 3, target: 15, reward: 7.5, cost: 6 },
            { level: 4, target: 20, reward: 10.0, cost: 8 },
            { level: 5, target: 25, reward: 12.5, cost: 10 },
            { level: 6, target: 30, reward: 15.0, cost: 12 }
        ];

        auth.onAuthStateChanged(user => {
            if(user) {
                currentUser = user;
                loadUserData();
                loadSettings();
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function loadSettings() {
            db.ref('settings/credits').on('value', snap => {
                const s = snap.val() || {};
                creditRate = s.rate || 5;
                adminWallet = s.wallet || "Contact Admin";
                document.getElementById('rateDisplay').innerText = creditRate;
                document.getElementById('adminAddr').innerText = adminWallet;
            });
        }

        function loadUserData() {
            db.ref('users/' + currentUser.uid).on('value', snap => {
                const u = snap.val();
                myCredits = u.credits || 0;
                document.getElementById('userCredits').innerText = myCredits;

                currentActiveTarget = u.active_target || null;
                
                renderLevels(u);
                checkActiveProgress(u);
            });
        }

        function renderLevels(user) {
            const container = document.getElementById('levelsContainer');
            container.innerHTML = "";
            const completed = user.completed_levels?.weekly || {};

            LEVELS.forEach(lvl => {
                const isCompleted = completed[lvl.level];
                const isLocked = currentActiveTarget !== null; // Lock all if one is active
                
                let btnText = `Start Challenge <small>(${lvl.cost} Credits)</small>`;
                let btnDisabled = "";
                let btnClass = "";

                if(isCompleted) {
                    btnText = "Completed <i class='fas fa-check'></i>";
                    btnDisabled = "disabled";
                } else if (isLocked) {
                    btnText = "Another Challenge Active";
                    btnDisabled = "disabled";
                }

                container.innerHTML += `
                    <div class="level-card">
                        <div class="lc-header">
                            <span class="lvl-badge">LEVEL ${lvl.level}</span>
                            <span class="reward">$${lvl.reward}</span>
                        </div>
                        <div class="target-desc">
                            Target: <span>${lvl.target} New Active Referrals</span>
                        </div>
                        <button class="action-btn" ${btnDisabled} onclick="startChallenge(${lvl.level}, ${lvl.target}, ${lvl.reward}, ${lvl.cost})">
                            ${btnText}
                        </button>
                    </div>
                `;
            });
        }

        function startChallenge(level, targetCount, reward, cost) {
            if(myCredits < cost) {
                alert("Not enough credits! Please buy more.");
                openBuyModal();
                return;
            }

            if(confirm(`Start Level ${level}? This will cost ${cost} Credits.`)) {
                // 1. Get current active referral count to set baseline
                db.ref('users').orderByChild('referredBy').equalTo(currentUser.uid).once('value', snap => { // NOTE: This needs to query referredBy = ownCode. Assuming logic.
                    // Correct approach: Get user's ownCode first
                     db.ref('users/' + currentUser.uid + '/ownCode').once('value', codeSnap => {
                        const myCode = codeSnap.val();
                        
                        // Count current active
                        let currentActive = 0;
                        db.ref('users').orderByChild('referredBy').equalTo(myCode).once('value', teamSnap => {
                             teamSnap.forEach(t => { if(t.val().status === 'active') currentActive++; });
                             
                             // 2. Set Active Target in DB
                             const targetData = {
                                 type: 'weekly',
                                 level: level,
                                 reward: reward,
                                 targetCount: targetCount,
                                 startCount: currentActive, // Baseline
                                 startTime: Date.now()
                             };

                             const updates = {};
                             updates['users/' + currentUser.uid + '/active_target'] = targetData;
                             updates['users/' + currentUser.uid + '/credits'] = myCredits - cost;

                             db.ref().update(updates).then(() => {
                                 alert("Challenge Started! Good Luck.");
                             });
                        });
                     });
                });
            }
        }

        function checkActiveProgress(user) {
            if(!user.active_target || user.active_target.type !== 'weekly') {
                document.getElementById('activeStatusArea').style.display = 'none';
                return;
            }

            const t = user.active_target;
            document.getElementById('activeStatusArea').style.display = 'block';
            document.getElementById('activeLvlName').innerText = `Level ${t.level}`;
            document.getElementById('activeTarget').innerText = t.targetCount;

            // Recalculate Current Active Referrals
            db.ref('users/' + currentUser.uid + '/ownCode').once('value', codeSnap => {
                const myCode = codeSnap.val();
                let nowActive = 0;
                db.ref('users').orderByChild('referredBy').equalTo(myCode).once('value', teamSnap => {
                    teamSnap.forEach(child => { if(child.val().status === 'active') nowActive++; });
                    
                    // Logic: Progress = Current Total Active - Baseline Active at Start
                    let progress = nowActive - t.startCount;
                    if(progress < 0) progress = 0; // Just in case

                    document.getElementById('activeProgress').innerText = progress;
                    
                    const percent = (progress / t.targetCount) * 100;
                    document.getElementById('progressBar').style.width = Math.min(percent, 100) + "%";

                    if(progress >= t.targetCount) {
                        document.getElementById('claimBtn').style.display = 'block';
                    }
                });
            });
        }

        function claimReward() {
            const t = currentActiveTarget;
            // Add Reward to Balance & Lifetime Profit
            // Remove active_target
            // Mark level as completed

            db.ref('users/' + currentUser.uid).transaction(userData => {
                if(userData) {
                    userData.balance = (userData.balance || 0) + t.reward;
                    // Note: Total Profit in home.html is calculated dynamically (Bal + Withdraw).
                    // So just adding to balance is enough to reflect in Total Profit.
                    
                    if(!userData.completed_levels) userData.completed_levels = {};
                    if(!userData.completed_levels.weekly) userData.completed_levels.weekly = {};
                    userData.completed_levels.weekly[t.level] = true;
                    
                    userData.active_target = null; // Clear target
                }
                return userData;
            }, (error, committed) => {
                if(committed) {
                    alert(`Congratulations! $${t.reward} added to your balance.`);
                    location.reload();
                }
            });
        }

        // --- BUY CREDIT LOGIC ---
        function openBuyModal() { document.getElementById('buyModal').style.display = 'flex'; }
        
        function calcPrice() {
            const amt = document.getElementById('buyAmount').value;
            const price = amt / creditRate;
            document.getElementById('costDisplay').innerText = price.toFixed(2);
        }

        function submitBuy() {
            const amt = parseFloat(document.getElementById('buyAmount').value);
            const trx = document.getElementById('trxId').value;
            
            if(!amt || !trx) { alert("Please fill all fields"); return; }
            
            const reqData = {
                uid: currentUser.uid,
                amount: amt,
                trx: trx,
                status: 'pending',
                date: Date.now()
            };
            
            db.ref('credit_requests').push(reqData).then(() => {
                alert("Request Submitted! Admin will approve shortly.");
                document.getElementById('buyModal').style.display = 'none';
            });
        }
    </script>
</body>
</html>
