<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* DARK PREMIUM THEME */
        body { margin: 0; min-height: 100vh; background: #0f0c29; background: linear-gradient(to bottom, #0f0c29, #302b63); font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; padding: 20px; color: white; }
        
        .card {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative;
        }

        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; opacity: 0.5; transition: 0.3s; font-weight: 600; }
        .tab.active { opacity: 1; color: #00f260; border-bottom: 2px solid #00f260; }

        input {
            width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; color: white; box-sizing: border-box; outline: none; font-family: 'Poppins';
        }
        input:focus { border-color: #00f260; background: rgba(0,0,0,0.5); }

        button {
            width: 100%; padding: 15px; background: linear-gradient(45deg, #00f260, #0575E6); border: none; border-radius: 10px;
            color: white; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem; transition: 0.3s;
        }
        button:hover { box-shadow: 0 0 15px rgba(0, 242, 96, 0.4); }

        .form-box { display: none; animation: fade 0.5s; }
        .form-box.active { display: block; }
        @keyframes fade { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }

        .error { color: #ff4757; font-size: 0.85rem; text-align: center; margin-bottom: 10px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login', this)">Login</div>
            <div class="tab" onclick="switchTab('register', this)">Register</div>
        </div>

        <p id="msg" class="error"></p>

        <!-- LOGIN FORM -->
        <div id="login" class="form-box active">
            <h2 style="text-align:center; margin-top:0;">Welcome Back</h2>
            <input type="number" id="l_phone" placeholder="Phone Number">
            <input type="password" id="l_pass" placeholder="Password">
            <button id="loginBtn">LOGIN</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="register" class="form-box">
            <h2 style="text-align:center; margin-top:0;">Create Account</h2>
            <div style="display:flex; gap:10px;">
                <input type="text" id="r_fname" placeholder="First Name">
                <input type="text" id="r_lname" placeholder="Last Name">
            </div>
            <input type="number" id="r_phone" placeholder="Phone Number">
            <input type="password" id="r_pass" placeholder="Password">
            <input type="password" id="r_cpass" placeholder="Confirm Password">
            <input type="text" id="r_ref" placeholder="Referral Code (Required)" style="border-color: #e74c3c;">
            <button id="regBtn">REGISTER</button>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
          apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g",
          authDomain: "art-paid-work001.firebaseapp.com",
          databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com",
          projectId: "art-paid-work001",
          storageBucket: "art-paid-work001.firebasestorage.app",
          messagingSenderId: "524647364992",
          appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // --- 2. UI LOGIC ---
        function switchTab(id, el) {
            document.querySelectorAll('.form-box').forEach(d => d.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            showMsg("");
        }

        function showMsg(text, color="#ff4757") {
            const m = document.getElementById('msg');
            m.style.color = color;
            m.innerText = text;
        }

        // --- 3. REGISTRATION LOGIC ---
        document.getElementById('regBtn').addEventListener('click', () => {
            const fname = document.getElementById('r_fname').value.trim();
            const lname = document.getElementById('r_lname').value.trim();
            const phone = document.getElementById('r_phone').value.trim();
            const pass = document.getElementById('r_pass').value;
            const cpass = document.getElementById('r_cpass').value;
            const refCode = document.getElementById('r_ref').value.trim();

            // Validation
            if(!fname || !lname || !phone || !pass || !refCode) return showMsg("All fields are required!");
            if(pass.length < 6) return showMsg("Password must be 6+ chars");
            if(pass !== cpass) return showMsg("Passwords do not match!");

            showMsg("Verifying Referral Code...", "#00f260");

            // CHECK REFERRAL CODE
            if(refCode === "the_art2000") {
                // Admin/Master Code Used
                createFirebaseAccount(fname, lname, phone, pass, refCode);
            } else {
                // Check DB for valid user referral code
                db.ref('users').orderByChild('ownCode').equalTo(refCode).once('value', snapshot => {
                    if(snapshot.exists()) {
                        createFirebaseAccount(fname, lname, phone, pass, refCode);
                    } else {
                        showMsg("Invalid Referral Code!");
                    }
                });
            }
        });

        function createFirebaseAccount(fname, lname, phone, pass, refBy) {
            const email = phone + "@shoppingfree.com"; // Fake email for Auth
            const btn = document.getElementById('regBtn');
            btn.innerText = "Creating...";

            auth.createUserWithEmailAndPassword(email, pass)
                .then((cred) => {
                    // Generate New Referral Code (First 3 letters of name + 4 random digits)
                    const newCode = (fname.substring(0,3) + Math.floor(1000 + Math.random() * 9000)).toUpperCase();
                    
                    // Save User Data to Realtime Database
                    db.ref('users/' + cred.user.uid).set({
                        firstName: fname,
                        lastName: lname,
                        phone: phone,
                        password: pass, // (Optional: only if you really need to see it in admin)
                        ownCode: newCode,
                        referredBy: refBy,
                        status: 'inactive',
                        balance: 0,
                        joinedAt: new Date().toISOString()
                    }).then(() => {
                        alert("Account Created Successfully!");
                        window.location.href = 'home.html';
                    });
                })
                .catch((error) => {
                    btn.innerText = "REGISTER";
                    if(error.code === 'auth/email-already-in-use') {
                        showMsg("Phone number already registered!");
                    } else {
                        showMsg(error.message);
                    }
                });
        }

        // --- 4. LOGIN LOGIC ---
        document.getElementById('loginBtn').addEventListener('click', () => {
            const phone = document.getElementById('l_phone').value.trim();
            const pass = document.getElementById('l_pass').value;

            if(!phone || !pass) return showMsg("Enter Phone & Password");

            const btn = document.getElementById('loginBtn');
            btn.innerText = "Logging in...";
            const email = phone + "@shoppingfree.com";

            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    window.location.href = 'home.html';
                })
                .catch((error) => {
                    btn.innerText = "LOGIN";
                    showMsg("Invalid Number or Password");
                });
        });

    </script>
</body>
</html>
