<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; min-height: 100vh; background: linear-gradient(to bottom, #0f0c29, #302b63); font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; padding: 20px; color: white; }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; opacity: 0.5; transition: 0.3s; font-weight: 600; }
        .tab.active { opacity: 1; color: #00f260; border-bottom: 2px solid #00f260; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: #00f260; background: rgba(0,0,0,0.5); }
        button { width: 100%; padding: 15px; background: linear-gradient(45deg, #00f260, #0575E6); border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        button:disabled { background: #555; cursor: not-allowed; }
        .form-box { display: none; } .form-box.active { display: block; }
        .error { color: #ff4757; font-size: 0.85rem; text-align: center; margin-bottom: 10px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login', this)" id="tab_login">Login</div>
            <div class="tab" onclick="switchTab('register', this)" id="tab_register">Register</div>
        </div>
        <p id="msg" class="error"></p>

        <!-- LOGIN FORM -->
        <div id="login" class="form-box active">
            <h2 style="text-align:center;">Welcome Back</h2>
            <input type="number" id="l_phone" placeholder="Phone Number">
            <input type="password" id="l_pass" placeholder="Password">
            <button id="loginBtn">LOGIN</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="register" class="form-box">
            <h2 style="text-align:center;">Create Account</h2>
            <div style="display:flex; gap:10px;"><input type="text" id="r_fname" placeholder="First Name"><input type="text" id="r_lname" placeholder="Last Name"></div>
            <input type="number" id="r_phone" placeholder="Phone Number">
            <input type="password" id="r_pass" placeholder="Password">
            <input type="password" id="r_cpass" placeholder="Confirm Password">
            <input type="text" id="r_ref" placeholder="Referral Code (Required)">
            <button id="regBtn">REGISTER & PROCEED</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // UPDATED FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE",
            authDomain: "shopping28-84906.firebaseapp.com",
            databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com",
            projectId: "shopping28-84906",
            storageBucket: "shopping28-84906.firebasestorage.app",
            messagingSenderId: "252107906792",
            appId: "1:252107906792:web:d39b0be25c88e07015b35d"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        function switchTab(id, el) {
            document.querySelectorAll('.form-box').forEach(d => d.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
            document.getElementById('msg').innerText = "";
        }
        function showMsg(text) { document.getElementById('msg').innerText = text; }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            if (refCode) {
                document.getElementById('r_ref').value = refCode;
                document.getElementById('r_ref').readOnly = true;
                switchTab('register', document.getElementById('tab_register'));
            }
        }

        // REGISTER LOGIC
        document.getElementById('regBtn').addEventListener('click', () => {
            const fname = document.getElementById('r_fname').value.trim();
            const lname = document.getElementById('r_lname').value.trim();
            const phone = document.getElementById('r_phone').value.trim();
            const pass = document.getElementById('r_pass').value;
            const cpass = document.getElementById('r_cpass').value;
            const refCode = document.getElementById('r_ref').value.trim();
            const btn = document.getElementById('regBtn');

            if(!fname || !lname || !phone || !pass || !refCode) return showMsg("All fields are required!");
            if(pass.length < 6) return showMsg("Password must be 6+ chars");
            if(pass !== cpass) return showMsg("Passwords do not match!");

            btn.disabled = true; btn.innerText = "Creating Account...";

            // Check Referral
            if(refCode === "the_art2000") {
                createAccount(fname, lname, phone, pass, refCode, btn);
            } else {
                db.ref('users').orderByChild('ownCode').equalTo(refCode).once('value', s => {
                    if(s.exists()) createAccount(fname, lname, phone, pass, refCode, btn);
                    else { showMsg("Invalid Referral Code!"); btn.disabled = false; btn.innerText = "REGISTER & PROCEED"; }
                });
            }
        });

        function createAccount(fname, lname, phone, pass, refBy, btn) {
            auth.createUserWithEmailAndPassword(phone + "@shoppingfree.com", pass)
                .then((cred) => {
                    const newCode = (fname.substring(0,3) + Math.floor(1000 + Math.random() * 9000)).toUpperCase();
                    // 1. Account Created Here
                    db.ref('users/' + cred.user.uid).set({
                        firstName: fname, lastName: lname, phone: phone, password: pass,
                        ownCode: newCode, referredBy: refBy, status: 'inactive', balance: 0, joinedAt: new Date().toISOString()
                    }).then(() => {
                        // 2. Redirect to Activation Page
                        window.location.href = 'account_active.html';
                    });
                })
                .catch((e) => {
                    btn.disabled = false; btn.innerText = "REGISTER & PROCEED";
                    showMsg(e.code === 'auth/email-already-in-use' ? "Phone already exists!" : e.message);
                });
        }

        // LOGIN LOGIC
        document.getElementById('loginBtn').addEventListener('click', () => {
            const phone = document.getElementById('l_phone').value.trim();
            const pass = document.getElementById('l_pass').value;
            if(!phone || !pass) return showMsg("Enter Phone & Password");
            
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.innerText = "Logging in...";

            auth.signInWithEmailAndPassword(phone + "@shoppingfree.com", pass)
            .then(() => {
                // Login successful, check status in next page
                window.location.href = 'account_active.html'; 
            })
            .catch(() => {
                btn.disabled = false; btn.innerText = "LOGIN";
                showMsg("Invalid Credentials");
            });
        });
    </script>
</body>
</html>
