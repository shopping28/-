<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | SHOPPING28</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === PREMIUM VARIABLES === */
        :root {
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-gold: #ffd700;
            --neon-blue: #00f2ff;
            --neon-green: #00ff88;
            --neon-red: #ff4757;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0; padding: 0; padding-bottom: 50px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* AMBIENT LIGHTS */
        .ambient-light { position: fixed; border-radius: 50%; filter: blur(90px); z-index: -1; opacity: 0.4; }
        .al-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: radial-gradient(circle, #4c00ff, transparent); }
        .al-2 { bottom: 10%; right: -10%; width: 250px; height: 250px; background: radial-gradient(circle, #ff0055, transparent); }

        /* HEADER */
        .header {
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 1px; }
        .logo span { background: linear-gradient(to right, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .back-btn {
            color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem;
            display: flex; align-items: center; gap: 5px; transition: 0.3s;
        }
        .back-btn:hover { color: var(--neon-blue); }

        /* PROFILE CARD */
        .profile-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px 20px;
            margin: 20px;
            text-align: center;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        .pic-container { position: relative; width: 100px; height: 100px; margin-bottom: 15px; cursor: pointer; }
        .pic-box {
            width: 100%; height: 100%; border-radius: 50%;
            background: linear-gradient(135deg, #00f2ff, #bc13fe);
            padding: 4px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }
        .pic-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid #000; }
        .camera-icon {
            position: absolute; bottom: 0; right: 0;
            background: var(--neon-blue); color: #000;
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #000; font-size: 0.9rem;
        }

        .name-area { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .user-name { font-size: 1.5rem; font-weight: 800; margin: 0; }
        .edit-icon { color: var(--neon-gold); cursor: pointer; font-size: 1rem; }

        .uid-badge {
            background: rgba(255,255,255,0.08); padding: 5px 12px; border-radius: 10px;
            font-size: 0.8rem; color: var(--text-muted); margin-top: 5px;
            border: 1px solid rgba(255,255,255,0.1); font-family: monospace;
        }

        /* EDIT FORM */
        #nameEditForm { display: none; margin-top: 15px; width: 100%; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .glass-input {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border); color: #fff; border-radius: 10px; outline: none;
        }
        .glass-input:focus { border-color: var(--neon-blue); }
        .save-btn {
            width: 100%; padding: 10px; background: var(--neon-green); color: #000;
            border: none; border-radius: 10px; font-weight: 800; cursor: pointer;
        }

        /* STATS GRID */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 0 20px 25px; }
        .stat-box {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 20px; border-radius: 18px; text-align: center;
        }
        .stat-num { font-size: 1.4rem; font-weight: 800; margin: 5px 0 0; }
        .stat-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .val-gold { color: var(--neon-gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        .val-blue { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }

        /* MENU LIST */
        .menu-container { margin: 0 20px; display: flex; flex-direction: column; gap: 10px; }
        .menu-item {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 15px 20px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.2s;
        }
        .menu-item:active { transform: scale(0.98); background: rgba(255,255,255,0.05); }
        .menu-left { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 0.95rem; }
        .menu-left i { width: 25px; text-align: center; color: var(--neon-blue); font-size: 1.1rem; }
        
        /* DROPDOWN SECTIONS */
        .hidden-section { 
            display: none; background: rgba(0,0,0,0.4); 
            padding: 20px; margin: 0 20px 10px; border-radius: 15px; 
            border: 1px solid var(--glass-border);
        }
        .about-text p { margin: 5px 0; color: #ccc; font-size: 0.9rem; }
        .update-btn {
            width: 100%; padding: 12px; background: var(--neon-blue); color: #000;
            border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 10px;
        }

        /* LOGOUT */
        .logout-btn {
            margin: 30px 20px; width: calc(100% - 40px); padding: 15px;
            background: rgba(255, 71, 87, 0.1); border: 1px solid var(--neon-red);
            color: var(--neon-red); border-radius: 15px; font-weight: 800;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

    </style>
</head>
<body>

    <div class="ambient-light al-1"></div>
    <div class="ambient-light al-2"></div>

    <!-- HEADER -->
    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-chevron-left"></i> Home</a>
        <div class="logo">SHOPPING<span>28</span></div>
    </div>

    <!-- PROFILE CARD -->
    <div class="profile-card">
        <div class="pic-container" onclick="document.getElementById('fileInput').click()">
            <div class="pic-box" id="profilePicBox">
                <i class="fas fa-user" style="font-size: 2.5rem; color: #555;"></i>
            </div>
            <div class="camera-icon"><i class="fas fa-camera"></i></div>
        </div>
        <input type="file" id="fileInput" hidden accept="image/*" onchange="uploadProfilePic(this)">

        <div class="name-area">
            <h2 class="user-name" id="p_name">Loading...</h2>
            <i class="fas fa-pen edit-icon" onclick="toggleNameEdit()"></i>
        </div>
        
        <div class="uid-badge" id="p_uid">UID: ...</div>
        <div class="uid-badge" style="color:var(--neon-green); border-color:var(--neon-green);">
            Code: <span id="p_code">...</span>
        </div>

        <!-- Name Edit Form -->
        <div id="nameEditForm">
            <div class="form-row">
                <input type="text" id="newFName" class="glass-input" placeholder="First Name">
                <input type="text" id="newLName" class="glass-input" placeholder="Last Name">
            </div>
            <button class="save-btn" onclick="saveNameChange()">Update Name</button>
        </div>
    </div>

    <!-- STATS (USDT) -->
    <div class="stats-grid">
        <div class="stat-box">
            <i class="fas fa-wallet" style="color:#ffd700; font-size:1.5rem;"></i>
            <div class="stat-num val-gold"><span id="p_balance">0.00</span> USDT</div>
            <div class="stat-lbl">Total Profit</div>
        </div>
        <div class="stat-box">
            <i class="fas fa-users" style="color:#00f2ff; font-size:1.5rem;"></i>
            <div class="stat-num val-blue" id="p_team">0</div>
            <div class="stat-lbl">Total Team</div>
        </div>
    </div>

    <!-- MENU LIST -->
    <div class="menu-container">
        
        <!-- About -->
        <div class="menu-item" onclick="toggleSection('aboutSection')">
            <div class="menu-left"><i class="fas fa-info-circle"></i> About & Rules</div>
            <i class="fas fa-chevron-down" style="color:#666; font-size:0.8rem;"></i>
        </div>
        <div id="aboutSection" class="hidden-section about-text">
            <center style="margin-bottom:15px;">
                <i class="fas fa-shopping-bag" style="font-size:2rem; color:var(--neon-blue); margin-bottom:10px;"></i>
                <h3 style="margin:0;">SHOPPING28</h3>
                <small style="color:#888;">Premium Network</small>
            </center>
            <p><strong>CEO:</strong> Munna Art</p>
            <p><strong>Developer:</strong> The Rafsan</p>
            <hr style="border-color:rgba(255,255,255,0.1);">
            <p style="color:var(--neon-green)">Lvl 1 Income: 130 BDT</p>
            <p style="color:var(--neon-blue)">Lvl 2 Income: 20 BDT</p>
            <p style="color:var(--neon-gold)">Lvl 3 Income: 10 BDT</p>
        </div>

        <!-- Telegram -->
        <div class="menu-item" onclick="window.open('https://t.me/art_community_offical', '_blank')">
            <div class="menu-left"><i class="fab fa-telegram-plane"></i> Join Telegram</div>
            <i class="fas fa-external-link-alt" style="color:#666; font-size:0.8rem;"></i>
        </div>

        <!-- Password -->
        <div class="menu-item" onclick="toggleSection('passSection')">
            <div class="menu-left"><i class="fas fa-key"></i> Change Password</div>
            <i class="fas fa-chevron-down" style="color:#666; font-size:0.8rem;"></i>
        </div>
        <div id="passSection" class="hidden-section">
            <input type="password" id="oldPass" class="glass-input" placeholder="Current Password" style="margin-bottom:10px;">
            <input type="password" id="newPass" class="glass-input" placeholder="New Password (min 6)">
            <button class="update-btn" onclick="changePassword()">Change Password</button>
        </div>

    </div>

    <button class="logout-btn" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> LOGOUT
    </button>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // UPDATED FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE",
            authDomain: "shopping28-84906.firebaseapp.com",
            databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com",
            projectId: "shopping28-84906",
            storageBucket: "shopping28-84906.firebasestorage.app",
            messagingSenderId: "252107906792",
            appId: "1:252107906792:web:d39b0be25c88e07015b35d"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;

        // CONVERT TAKA TO USDT (120 BDT = 1 USD)
        function toUSDT(taka) {
            if(!taka) return "0.00";
            return (parseFloat(taka) / 120).toFixed(2);
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loadUserData(user.uid);
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function loadUserData(uid) {
            db.ref('users/' + uid).on('value', (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    // Profile
                    document.getElementById('p_name').innerText = data.firstName + " " + (data.lastName || "");
                    document.getElementById('p_code').innerText = data.ownCode || "N/A";
                    document.getElementById('p_uid').innerText = "UID: " + uid.substring(0,8) + "...";
                    if(data.profilePic) document.getElementById('profilePicBox').innerHTML = `<img src="${data.profilePic}">`;

                    // Pre-fill Edit Form
                    document.getElementById('newFName').value = data.firstName;
                    document.getElementById('newLName').value = data.lastName || "";

                    // Stats (Converted to USDT)
                    const profit = data.total_income || data.totalEarning || 0;
                    document.getElementById('p_balance').innerText = toUSDT(profit);

                    // Team Count (Try DB count first, else fallback)
                    let tCount = data.teamCount || data.team_member || 0;
                    // If DB count is 0, check referrals
                    if(tCount == 0 && data.ownCode) {
                        db.ref('users').orderByChild('referredBy').equalTo(data.ownCode).on('value', snap => {
                            document.getElementById('p_team').innerText = snap.numChildren();
                        });
                    } else {
                        document.getElementById('p_team').innerText = tCount;
                    }
                }
            });
        }

        // --- ACTIONS ---

        function toggleNameEdit() {
            const form = document.getElementById('nameEditForm');
            form.style.display = (form.style.display === 'block') ? 'none' : 'block';
        }

        function saveNameChange() {
            const f = document.getElementById('newFName').value.trim();
            const l = document.getElementById('newLName').value.trim();
            if(!f) return alert("First name required");
            
            db.ref('users/' + currentUser.uid).update({ firstName: f, lastName: l }).then(() => {
                alert("Name Updated!");
                toggleNameEdit();
            });
        }

        function uploadProfilePic(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxWidth = 300; // Resize to max 300px
                    const scaleSize = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * scaleSize;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const base64String = canvas.toDataURL('image/jpeg', 0.8);
                    
                    db.ref('users/' + currentUser.uid).update({ profilePic: base64String }).then(() => alert("Profile Picture Updated!"));
                }
            }
            reader.readAsDataURL(file);
        }

        function toggleSection(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        function changePassword() {
            const oldPass = document.getElementById('oldPass').value;
            const newPass = document.getElementById('newPass').value;
            if(newPass.length < 6) return alert("Password too short (min 6)");

            const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, oldPass);
            currentUser.reauthenticateWithCredential(credential).then(() => {
                currentUser.updatePassword(newPass).then(() => {
                    db.ref('users/' + currentUser.uid).update({ password: newPass });
                    alert("Password Changed Successfully!");
                    toggleSection('passSection');
                }).catch(e => alert(e.message));
            }).catch(() => alert("Incorrect Old Password"));
        }

        function logout() {
            if(confirm("Are you sure you want to logout?")) {
                auth.signOut().then(() => window.location.href = 'login_register.html');
            }
        }
    </script>
</body>
</html>
