<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team Dynamic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Modern Dark Theme */
        :root { --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --text: #f8fafc; --success: #10b981; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; padding-bottom: 80px;}
        
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { background: var(--card); padding: 10px; border-radius: 10px; color: #94a3b8; text-decoration: none; margin-right: 15px;}

        /* Stats Card */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-val { font-size: 1.5rem; font-weight: 700; margin-top: 5px; }
        .money { color: var(--success); }

        /* Dynamic Tabs */
        .tabs-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
        .tab-btn { background: var(--card); border: 1px solid #333; color: #aaa; padding: 8px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* List */
        .list-wrapper { display: none; flex-direction: column; gap: 10px; }
        .list-wrapper.active { display: flex; animation: fade 0.3s; }
        @keyframes fade { from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);} }

        .member-card { background: var(--card); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--primary); }
        .m-profit { color: var(--success); font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h3>My Team</h3>
    </div>

    <!-- Referral Code Display (Brief) -->
    <div style="background: linear-gradient(45deg, #4f46e5, #7c3aed); padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center;">
        <div style="color:rgba(255,255,255,0.7); font-size:0.8rem;">REFERRAL CODE</div>
        <div style="font-size:2rem; font-weight:800;" id="myCode">...</div>
        <button onclick="copyLink()" style="background:rgba(0,0,0,0.3); border:none; color:white; padding:5px 15px; border-radius:20px; margin-top:5px; cursor:pointer;">Copy Link</button>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div style="font-size:0.8rem; color:#94a3b8;">Total Partners</div>
            <div class="stat-val" id="totalCount">0</div>
        </div>
        <div class="stat-box">
            <div style="font-size:0.8rem; color:#94a3b8;">Total Earnings</div>
            <div class="stat-val money">$<span id="totalMoney">0.00</span></div>
        </div>
    </div>

    <!-- Dynamic Tabs will be injected here -->
    <div class="tabs-container" id="tabsArea"></div>

    <!-- Lists Container -->
    <div id="listsArea"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const RATE = 120;

        let activeLevels = []; // From Admin Settings
        let myCode = null;
        let totalIncomeBDT = 0;
        let totalMembers = 0;
        // Object to store counts per level: { 1: 5, 2: 10 }
        let levelCounts = {}; 

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref('users/'+user.uid+'/ownCode').once('value', s => {
                    myCode = s.val();
                    document.getElementById('myCode').innerText = myCode;
                    initPage();
                });
            }
        });

        function initPage() {
            // 1. Get Active Levels from Admin Settings
            db.ref('settings/commissions_dynamic').on('value', snap => {
                activeLevels = snap.val() || [];
                // If old format fallback
                if(activeLevels.length === 0) {
                     // Default fallback if nothing set
                     activeLevels = [{level:1}, {level:2}, {level:3}];
                }
                
                setupTabs();
                loadTeamData();
            });
        }

        function setupTabs() {
            const tabs = document.getElementById('tabsArea');
            const lists = document.getElementById('listsArea');
            
            tabs.innerHTML = `<button class="tab-btn active" onclick="showTab('all')">All List</button>`;
            lists.innerHTML = `<div id="list-all" class="list-wrapper active"></div>`;

            activeLevels.forEach(lvl => {
                tabs.innerHTML += `<button class="tab-btn" onclick="showTab(${lvl.level})" id="btn-lvl-${lvl.level}">Level ${lvl.level} (0)</button>`;
                lists.innerHTML += `<div id="list-${lvl.level}" class="list-wrapper"></div>`;
            });
        }

        // Recursive Function to Load Team
        function loadTeamData() {
            totalIncomeBDT = 0;
            totalMembers = 0;
            levelCounts = {};
            
            // Clear lists
            document.querySelectorAll('.list-wrapper').forEach(el => el.innerHTML = "");

            // Start fetching from Level 1
            fetchLevelMembers([myCode], 1);
        }

        // Recursive function
        function fetchLevelMembers(parentCodes, currentDepth) {
            // Stop if we go deeper than reasonable (e.g. 20 levels) to prevent infinite loops
            if(currentDepth > 20) return;
            
            let nextLevelParents = [];
            let processedCount = 0;

            parentCodes.forEach(code => {
                db.ref('users').orderByChild('referredBy').equalTo(code).on('child_added', snap => {
                    const user = snap.val();
                    if(user.status === 'active') {
                        processUser(user, currentDepth);
                        if(user.ownCode) nextLevelParents.push(user.ownCode);
                    }
                });
            });

            // Wait a bit then load next level (Firebase is async, this is a simple approximation)
            // Ideally we listen continuously. This structure listens to updates.
            // For fetching deep levels, we chain the listeners.
            
            // To properly handle recursion with listeners, we attach listeners to the children found.
            // Since `on('child_added')` is persistent, we need to be careful not to duplicate listeners.
            // For this simpler version, we assume `child_added` works as we expand.
            
            // IMPORTANT: We need a mechanism to trigger next level. 
            // Since we can't know when "child_added" finishes (it never does), 
            // we rely on the fact that when a child comes in, we attach a listener for THEIR children.
            
            // The logic inside `processUser` will handle UI and Maths.
            // To recurse: We need to attach listeners to the found children.
            // We do this inside the snapshot callback.
        }
        
        // Better implementation of recursion with listeners
        // We call this once for Level 1, and it calls itself for children.
        const knownUsers = new Set();

        function startRecursion(parentCode, depth) {
            db.ref('users').orderByChild('referredBy').equalTo(parentCode).on('child_added', snap => {
                const user = snap.val();
                const uid = snap.key;
                
                // Avoid duplicates / loops
                if(knownUsers.has(uid)) return;
                knownUsers.add(uid);

                if(user.status === 'active') {
                    // 1. Calculate Profit (HISTORICAL LOGIC)
                    // We look at the Child's 'locked_commissions' OR 'fixed_commissions'
                    // If they don't have it, we check global fallback (risky but needed for very old users)
                    
                    let profitFromUser = 0;
                    
                    // The user object might have an array `locked_commissions` 
                    // where index 0 is Level 1, index 1 is Level 2, etc.
                    // Since this user is at `depth` relative to ME:
                    // My profit is the rate defined for Level `depth`.
                    
                    if(user.locked_commissions && Array.isArray(user.locked_commissions)) {
                        // Check if there is a rate for this depth
                        // Array index = depth - 1
                        if(user.locked_commissions[depth - 1]) {
                            profitFromUser = parseFloat(user.locked_commissions[depth - 1].amount);
                        }
                    } else if (user.fixed_commissions) {
                        // Support for the previous fixed object structure
                         if(depth === 1) profitFromUser = user.fixed_commissions.level1;
                         if(depth === 2) profitFromUser = user.fixed_commissions.level2;
                         if(depth === 3) profitFromUser = user.fixed_commissions.level3;
                    } 
                    
                    // Add to total (Use valid number)
                    if(!isNaN(profitFromUser)) totalIncomeBDT += profitFromUser;
                    totalMembers++;

                    // Update UI Stats
                    document.getElementById('totalCount').innerText = totalMembers;
                    document.getElementById('totalMoney').innerText = (totalIncomeBDT / RATE).toFixed(2);

                    // 2. Render to List (ONLY if this level exists in Admin Settings)
                    // Check if Admin has this level active
                    const levelExistsInAdmin = activeLevels.find(l => l.level === depth);
                    
                    if(levelExistsInAdmin) {
                        // Update Count for Tab
                        if(!levelCounts[depth]) levelCounts[depth] = 0;
                        levelCounts[depth]++;
                        const tabBtn = document.getElementById(`btn-lvl-${depth}`);
                        if(tabBtn) tabBtn.innerText = `Level ${depth} (${levelCounts[depth]})`;

                        // Render Card
                        const profitUSD = (profitFromUser / RATE).toFixed(2);
                        const html = `
                            <div class="member-card">
                                <div>
                                    <div style="font-weight:600">${user.firstName || 'User'}</div>
                                    <div style="font-size:0.75rem; color:#aaa;">ID: ${user.ownCode}</div>
                                </div>
                                <div style="text-align:right">
                                    <div class="m-profit">+$${profitUSD}</div>
                                    <div style="font-size:0.7rem; color:#aaa;">Level ${depth}</div>
                                </div>
                            </div>`;
                        
                        document.getElementById(`list-${depth}`).innerHTML += html;
                        document.getElementById(`list-all`).innerHTML += html;
                    }

                    // 3. Recurse (Go deeper)
                    if(user.ownCode) {
                        startRecursion(user.ownCode, depth + 1);
                    }
                }
            });
        }
        
        // Override the previous simple loader
        function loadTeamData() {
            totalIncomeBDT = 0;
            totalMembers = 0;
            knownUsers.clear();
            levelCounts = {};
            document.querySelectorAll('.list-wrapper').forEach(el => el.innerHTML = "");
            
            startRecursion(myCode, 1);
        }

        function showTab(id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.list-wrapper').forEach(l => l.classList.remove('active'));
            
            if(id === 'all') {
                event.target.classList.add('active');
                document.getElementById('list-all').classList.add('active');
            } else {
                document.getElementById(`btn-lvl-${id}`).classList.add('active');
                document.getElementById(`list-${id}`).classList.add('active');
            }
        }
        
        function copyLink() {
            navigator.clipboard.writeText(`https://shopping28.github.io/-/login_register.html?ref=${myCode}`);
            alert("Copied!");
        }

    </script>
</body>
</html>
