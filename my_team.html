<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team | Commission History</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #020617; --card-bg: #0f172a; --primary: #3b82f6; --text: #f8fafc; --neon-gold: #facc15; --neon-green: #10b981; }
        body { background-color: var(--bg-dark); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; padding: 20px; padding-bottom: 80px; }
        
        .header { display: flex; align-items: center; margin-bottom: 25px; }
        .back-btn { background: rgba(255,255,255,0.05); width: 40px; height: 40px; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,0.1); margin-right: 15px; }
        
        /* FINANCIAL CARDS */
        .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .stat-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; text-align: center; }
        .stat-val { font-size: 1.3rem; font-weight: 800; color: #fff; margin-top: 5px; }
        .stat-lbl { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .txt-gold { color: var(--neon-gold); } .txt-green { color: var(--neon-green); }

        /* LEVEL ACCORDION */
        .level-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .level-box { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; overflow: hidden; }
        
        .lvl-header { 
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; 
            background: rgba(255,255,255,0.02); cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .lvl-title { font-weight: 700; color: #fff; }
        .lvl-summ { font-size: 0.85rem; color: var(--neon-green); font-weight: 600; }
        
        .lvl-body { display: none; padding: 10px; background: #0b0f19; }
        .lvl-body.open { display: block; }

        /* USER LIST ITEM */
        .user-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem;
        }
        .user-item:last-child { border-bottom: none; }
        .u-id { color: #94a3b8; font-family: monospace; }
        .u-profit { color: var(--neon-gold); font-weight: bold; }
        .u-date { font-size: 0.7rem; color: #555; display: block; }

        .empty-msg { text-align: center; padding: 15px; color: #555; font-size: 0.85rem; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h3>My Team & Profits</h3>
    </div>

    <!-- 1. FINANCIAL SUMMARY (Synced with Home) -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-lbl">Today's Profit</div>
            <div class="stat-val txt-gold"><span id="todayProf">0.00</span> USDT</div>
        </div>
        <div class="stat-card">
            <div class="stat-lbl">Current Balance</div>
            <div class="stat-val txt-green"><span id="currBal">0.00</span> USDT</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-lbl">Total Profit (Lifetime)</div>
        <div class="stat-val"><span id="lifeProf">0.00</span> USDT</div>
    </div>

    <!-- 2. DYNAMIC LEVEL LIST -->
    <div id="levelsContainer" class="level-container">
        <div style="text-align:center; color:#555; margin-top:20px;">Loading Team Data...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE",
            authDomain: "shopping28-84906.firebaseapp.com",
            databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com",
            projectId: "shopping28-84906",
            storageBucket: "shopping28-84906.firebasestorage.app",
            messagingSenderId: "252107906792",
            appId: "1:252107906792:web:d39b0be25c88e07015b35d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const RATE = 120; 

        let currentUser = null;

        auth.onAuthStateChanged(user => {
            if(user) {
                currentUser = user;
                loadFinancials(); // Load Top Cards
                loadTeamData();   // Load Level Details
            } else {
                window.location.href = 'login_register.html';
            }
        });

        // 1. LOAD FINANCIALS (Matches Home Page Logic)
        function loadFinancials() {
            db.ref('users/' + currentUser.uid).on('value', snap => {
                const u = snap.val();
                if(!u) return;

                // Current Balance (Wallet)
                const balBDT = parseFloat(u.balance || 0);
                document.getElementById('currBal').innerText = (balBDT / RATE).toFixed(2);

                // Calculate Lifetime Profit (Balance + Withdrawals)
                let totalWithdrawn = 0;
                db.ref('withdraw_requests').orderByChild('uid').equalTo(currentUser.uid).once('value', wSnap => {
                    wSnap.forEach(c => {
                        const w = c.val();
                        if (w.status === 'approved' || w.status === 'pending') {
                            totalWithdrawn += parseFloat(w.amountBDT || w.amount || 0);
                        }
                    });
                    const lifetimeBDT = balBDT + totalWithdrawn;
                    document.getElementById('lifeProf').innerText = (lifetimeBDT / RATE).toFixed(2);
                });

                // Calculate Today's Profit (From Commission History & Rewards)
                // Note: We scan commission_history to be precise about sources
                calculateToday(currentUser.uid);
            });
        }

        function calculateToday(uid) {
            const todayStr = new Date().toDateString();
            let todaySum = 0;

            // Check Commission History
            db.ref(`users/${uid}/commission_history`).once('value', snap => {
                snap.forEach(child => {
                    const record = child.val();
                    if (new Date(record.timestamp).toDateString() === todayStr) {
                        todaySum += parseFloat(record.amount || 0);
                    }
                });
                
                // Check Reward History (if any)
                db.ref(`users/${uid}/target_rewards`).once('value', rSnap => {
                    rSnap.forEach(child => {
                        const r = child.val();
                        if (new Date(r.timestamp).toDateString() === todayStr) {
                            todaySum += parseFloat(r.amountBDT || 0);
                        }
                    });
                    // Display
                    document.getElementById('todayProf').innerText = (todaySum / RATE).toFixed(2);
                });
            });
        }

        // 2. LOAD TEAM DATA & LEVELS (Dynamic from History)
        // This ensures if rate changes, old history remains correct (Locked Price)
        function loadTeamData() {
            // First get configured levels from settings to know names/structure
            db.ref('settings/referral_levels').once('value', setSnap => {
                const settingsLevels = setSnap.val() || [];
                
                // Fetch User's Commission History
                db.ref(`users/${currentUser.uid}/commission_history`).on('value', histSnap => {
                    const history = histSnap.val() || {};
                    renderTeamLevels(settingsLevels, history);
                });
            });
        }

        function renderTeamLevels(settingsLevels, history) {
            const container = document.getElementById('levelsContainer');
            container.innerHTML = "";

            // Group History by Level
            // Structure: { 1: {total: 0, members: []}, 2: ... }
            let levelData = {};

            // Initialize based on settings (so we show Level 1, 2 etc even if empty)
            settingsLevels.forEach(l => {
                levelData[l.level] = { totalBDT: 0, members: [] };
            });

            // Process History Data
            Object.values(history).forEach(record => {
                const lvl = record.level;
                if(!levelData[lvl]) levelData[lvl] = { totalBDT: 0, members: [] }; // Handle old levels if settings changed

                levelData[lvl].totalBDT += parseFloat(record.amount || 0);
                levelData[lvl].members.push({
                    from: record.fromUser || "Unknown", // The User ID who joined
                    amount: record.amount,              // The amount I received (Historical Locked)
                    date: record.timestamp
                });
            });

            // Render HTML
            // Sort keys to ensure Level 1 is first
            Object.keys(levelData).sort((a,b)=>a-b).forEach(lvlNum => {
                const data = levelData[lvlNum];
                const totalUSD = (data.totalBDT / RATE).toFixed(2);
                const count = data.members.length;

                // Create User List HTML
                let userListHtml = "";
                if(count === 0) {
                    userListHtml = `<div class="empty-msg">No active members in Level ${lvlNum} yet.</div>`;
                } else {
                    // Sort members newest first
                    data.members.sort((a,b) => b.date - a.date).forEach(m => {
                        const mUSD = (m.amount / RATE).toFixed(2);
                        userListHtml += `
                            <div class="user-item">
                                <div>
                                    <span class="u-id">ID: ${m.from}</span>
                                    <span class="u-date">${new Date(m.date).toLocaleDateString()}</span>
                                </div>
                                <div class="u-profit">+ $${mUSD}</div>
                            </div>
                        `;
                    });
                }

                const html = `
                    <div class="level-box">
                        <div class="lvl-header" onclick="toggleLevel('lvl-${lvlNum}')">
                            <div class="lvl-title">Level ${lvlNum}</div>
                            <div class="lvl-summ">
                                <i class="fas fa-users"></i> ${count} &nbsp;|&nbsp; 
                                <i class="fas fa-dollar-sign"></i> ${totalUSD}
                            </div>
                        </div>
                        <div id="lvl-${lvlNum}" class="lvl-body">
                            ${userListHtml}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function toggleLevel(id) {
            const el = document.getElementById(id);
            el.classList.toggle('open');
        }
    </script>
</body>
</html>
