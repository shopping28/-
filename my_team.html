<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team | Forsage Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === FORSAGE THEME VARIABLES === */
        :root {
            --bg-dark: #0d0d2b;
            --card-bg: rgba(35, 35, 75, 0.6);
            --primary: #5856d6;
            --accent-blue: #00ecff;
            --accent-purple: #bd00ff;
            --text-white: #ffffff;
            --glass-border: 1px solid rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0; padding: 20px;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(88, 86, 214, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(189, 0, 255, 0.2) 0%, transparent 40%);
            color: var(--text-white);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
        }

        /* HEADER */
        .header { display: flex; align-items: center; margin-bottom: 30px; }
        .back-btn { 
            color: var(--text-white); font-size: 1.2rem; text-decoration: none; 
            background: rgba(255,255,255,0.1); width: 40px; height: 40px; 
            display: flex; align-items: center; justify-content: center; border-radius: 10px;
            margin-right: 15px; border: var(--glass-border);
        }

        /* INVITE CARD */
        .invite-card {
            background: linear-gradient(135deg, rgba(88, 86, 214, 0.2), rgba(189, 0, 255, 0.2));
            border: 1px solid rgba(0, 236, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(88, 86, 214, 0.2);
            text-align: center;
        }
        
        .invite-title { text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem; color: var(--accent-blue); margin-bottom: 10px; }
        .ref-code { font-size: 2rem; font-weight: 700; color: white; text-shadow: 0 0 10px rgba(255,255,255,0.5); letter-spacing: 2px; margin: 0; }
        
        /* LINK BOX */
        .link-box {
            display: flex;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-top: 15px;
            padding: 5px;
        }
        .link-input {
            flex: 1; background: transparent; border: none; color: #aaa;
            padding: 8px 10px; outline: none; font-family: monospace;
        }
        .copy-btn {
            background: var(--primary); color: white; border: none;
            padding: 8px 15px; border-radius: 5px; cursor: pointer;
            font-weight: bold; text-transform: uppercase; font-size: 0.8rem;
        }

        /* STATS GRID (Pending Removed) */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card {
            background: var(--card-bg);
            border: var(--glass-border);
            padding: 20px 15px;
            border-radius: 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
            display: flex; flex-direction: column; justify-content: center;
        }
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
        }
        .stat-num { font-size: 1.8rem; font-weight: 700; margin: 5px 0; }
        .stat-label { font-size: 0.8rem; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }

        /* TABS */
        .tabs { display: flex; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 10px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn {
            flex: 1; border: none; background: transparent; color: #aaa;
            padding: 10px; cursor: pointer; font-weight: 600; white-space: nowrap;
            transition: 0.3s; border-radius: 8px; font-family: 'Rajdhani', sans-serif;
        }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 0 15px rgba(88, 86, 214, 0.4); }

        /* MEMBER LIST */
        .list-container { display: none; }
        .list-container.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .member-row {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 10px;
            position: relative;
            border-left: 4px solid var(--accent-blue); /* Always Active Color */
        }
        
        .m-info h4 { margin: 0; font-size: 1rem; color: white; }
        .m-info small { color: #888; font-size: 0.8rem; }
        
        .m-status {
            font-size: 0.75rem; font-weight: bold; text-transform: uppercase;
            padding: 3px 8px; border-radius: 4px;
            color: var(--accent-blue); background: rgba(0, 236, 255, 0.1);
        }

        .profit-float {
            position: absolute; right: 10px; top: 5px;
            font-size: 0.7rem; color: #ffd700; font-weight: bold;
        }

    </style>
</head>
<body onclick="unlockAudio()">

    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h2 style="margin:0; text-transform:uppercase; letter-spacing:2px;">Team Partners</h2>
    </div>

    <!-- REFERRAL BOX -->
    <div class="invite-card">
        <div class="invite-title">Personal Link</div>
        <div class="ref-code" id="myCode">...</div>
        
        <div class="link-box">
            <input type="text" id="refLinkInput" class="link-input" readonly value="Loading...">
            <button class="copy-btn" onclick="copyLink()">Copy</button>
        </div>
    </div>

    <!-- STATS (ONLY ACTIVE & INCOME) -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-num" id="totalTeam" style="color: var(--accent-blue);">0</div>
            <div class="stat-label">Active Partners</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="totalIncome" style="color: #ffd700;">৳0</div>
            <div class="stat-label">Team Profit</div>
        </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('lvl1')" id="btnLvl1">Level 1</button>
        <button class="tab-btn" onclick="switchTab('lvl2')" id="btnLvl2">Level 2</button>
        <button class="tab-btn" onclick="switchTab('lvl3')" id="btnLvl3">Level 3</button>
        <button class="tab-btn" onclick="switchTab('allActive')" id="btnAllActive">All Team</button>
    </div>

    <!-- LISTS -->
    <div id="lvl1" class="list-container active"></div>
    <div id="lvl2" class="list-container"></div>
    <div id="lvl3" class="list-container"></div>
    <div id="allActive" class="list-container"></div>

    <!-- Firebase SDK & Logic -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // CONFIG
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.database();

        let COMMISSION = { level1: 0, level2: 0, level3: 0 };
        let currentUserCode = null;
        let isVoiceReady = false;
        
        // Removed 'pending' from stats object
        let stats = { active: 0, profit: 0, lvl1: 0, lvl2: 0, lvl3: 0 };

        function unlockAudio() {
            if(isVoiceReady) return;
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
            isVoiceReady = true;
        }

        // LOAD SETTINGS
        db.ref('settings/commissions').on('value', (snap) => {
            if(snap.exists()) { COMMISSION = snap.val(); if(currentUserCode) reloadAllData(); }
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('users/' + user.uid + '/ownCode').once('value', (snap) => {
                    if(snap.val()) {
                        currentUserCode = snap.val();
                        document.getElementById('myCode').innerText = currentUserCode;
                        document.getElementById('refLinkInput').value = `https://shopping28.github.io/-/login_register.html?ref=${currentUserCode}`;
                        reloadAllData();
                    }
                });
            } else { window.location.href = 'login_register.html'; }
        });

        function reloadAllData() {
            stats = { active: 0, profit: 0, lvl1: 0, lvl2: 0, lvl3: 0 };
            document.getElementById('lvl1').innerHTML = "";
            document.getElementById('lvl2').innerHTML = "";
            document.getElementById('lvl3').innerHTML = "";
            document.getElementById('allActive').innerHTML = "";
            updateDisplay();
            startLoadingTeam(currentUserCode);
        }

        function updateDisplay() {
            document.getElementById('totalTeam').innerText = stats.active;
            document.getElementById('totalIncome').innerText = "৳" + stats.profit;
            
            document.getElementById('btnLvl1').innerText = `Level 1 (${stats.lvl1})`;
            document.getElementById('btnLvl2').innerText = `Level 2 (${stats.lvl2})`;
            document.getElementById('btnLvl3').innerText = `Level 3 (${stats.lvl3})`;
        }

        function startLoadingTeam(myCode) {
            db.ref('users').orderByChild('referredBy').equalTo(myCode).on('value', (snapshot) => {
                const lvl1Container = document.getElementById('lvl1');
                lvl1Container.innerHTML = "";
                let level1Codes = [];
                let hasActive = false;

                if(snapshot.exists()) {
                    snapshot.forEach(child => {
                        const user = child.val();
                        // Only process if status is active
                        if(user.status === 'active') {
                            renderMember(user, 1, lvl1Container);
                            if(user.ownCode) level1Codes.push(user.ownCode);
                            hasActive = true;
                        }
                    });
                    loadLevel2(level1Codes);
                } 
                
                if(!hasActive) {
                    lvl1Container.innerHTML = "<div style='text-align:center;color:#666;padding:20px;'>No Active Partners</div>";
                }
            });
        }

        let processedL2 = new Set();
        let processedL3 = new Set();

        function loadLevel2(parentCodes) {
            const lvl2Container = document.getElementById('lvl2');
            lvl2Container.innerHTML = "";
            parentCodes.forEach(code => {
                if(processedL2.has(code)) return;
                processedL2.add(code);
                db.ref('users').orderByChild('referredBy').equalTo(code).on('child_added', (snap) => {
                    const user = snap.val();
                    if(user.status === 'active') {
                        renderMember(user, 2, lvl2Container);
                        if(user.ownCode) loadLevel3([user.ownCode]);
                    }
                });
            });
        }

        function loadLevel3(parentCodes) {
            const lvl3Container = document.getElementById('lvl3');
            lvl3Container.innerHTML = "";
            parentCodes.forEach(code => {
                if(processedL3.has(code)) return;
                processedL3.add(code);
                db.ref('users').orderByChild('referredBy').equalTo(code).on('child_added', (snap) => {
                    const user = snap.val();
                    if(user.status === 'active') {
                        renderMember(user, 3, lvl3Container);
                    }
                });
            });
        }

        function renderMember(user, level, container) {
            // SECURITY CHECK: DO NOT RENDER IF PENDING
            if(user.status !== 'active') return;

            let profit = 0;
            if(level === 1) profit = COMMISSION.level1 || 0;
            if(level === 2) profit = COMMISSION.level2 || 0;
            if(level === 3) profit = COMMISSION.level3 || 0;
            
            stats.active++;
            stats.profit += profit;

            if(level === 1) stats.lvl1++;
            if(level === 2) stats.lvl2++;
            if(level === 3) stats.lvl3++;

            updateDisplay();

            let phone = user.phone ? user.phone.toString() : "N/A";
            if(phone.length > 6) phone = phone.substring(0,3) + "**" + phone.substring(phone.length-3);

            const html = `
                <div class="member-row">
                    <div class="profit-float">+ ৳${profit}</div>
                    <div class="m-info">
                        <h4>${user.firstName || 'User'}</h4>
                        <small>ID: ${user.ownCode || '...'}</small>
                    </div>
                    <div><span class="m-status">Active</span></div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            document.getElementById('allActive').insertAdjacentHTML('beforeend', html);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.list-container').forEach(div => div.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            let btnId = 'btn' + tabId.charAt(0).toUpperCase() + tabId.slice(1);
            document.getElementById(btnId).classList.add('active');
        }

        function copyLink() {
            const linkInput = document.getElementById('refLinkInput');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(linkInput.value);
            alert("Link Copied!");
        }
    </script>
</body>
</html>
