<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team | Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --text: #f8fafc; --success: #10b981; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; padding-bottom: 80px;}
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { background: var(--card); padding: 10px; border-radius: 10px; color: #94a3b8; text-decoration: none; margin-right: 15px;}
        .ref-card { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3); }
        .ref-code { font-size: 2.5rem; font-weight: 800; margin: 5px 0 15px 0; color: #fff; }
        .copy-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 20px; border-radius: 30px; cursor: pointer; transition: 0.3s; font-weight: 600; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-val { font-size: 1.5rem; font-weight: 700; margin-top: 5px; }
        .money { color: var(--success); }
        .tabs-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; }
        .tab-btn { background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: white; }
        .member-card { background: var(--card); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03); margin-bottom: 10px; }
        .list-wrapper { display: none; flex-direction: column; }
        .list-wrapper.active { display: flex; }
    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h3>My Network</h3>
    </div>

    <div class="ref-card">
        <div style="font-size:0.8rem; text-transform:uppercase;">Referral Code</div>
        <div class="ref-code" id="myCode">...</div>
        <button class="copy-btn" onclick="copyLink()">Copy Invite Link</button>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div style="color:#94a3b8; font-size:0.8rem;">Total Partners</div>
            <div class="stat-val" id="totalCount">0</div>
        </div>
        <div class="stat-box">
            <div style="color:#94a3b8; font-size:0.8rem;">Total Earnings</div>
            <!-- Syncs with Home Total Profit -->
            <div class="stat-val money" id="totalMoney">$0.00</div>
        </div>
    </div>

    <div class="tabs-container" id="tabsArea">
        <button class="tab-btn active" onclick="showTab('all')">All List</button>
        <button class="tab-btn" onclick="showTab(1)">Level 1</button>
        <button class="tab-btn" onclick="showTab(2)">Level 2</button>
        <button class="tab-btn" onclick="showTab(3)">Level 3</button>
    </div>

    <div id="list-all" class="list-wrapper active"></div>
    <div id="list-1" class="list-wrapper"></div>
    <div id="list-2" class="list-wrapper"></div>
    <div id="list-3" class="list-wrapper"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const RATE = 120;

        auth.onAuthStateChanged(user => {
            if(user) {
                // Fetch Total Earnings like Home Page
                db.ref('users/' + user.uid).on('value', snap => {
                    const data = snap.val();
                    if(data) {
                        document.getElementById('myCode').innerText = data.ownCode || "...";
                        
                        // Calculate Total Profit (Balance + Withdraw)
                        let current = parseFloat(data.balance || 0);
                        let withdrawn = 0;
                        db.ref('withdraw_requests').orderByChild('uid').equalTo(user.uid).once('value', wSnap => {
                            if(wSnap.exists()) {
                                wSnap.forEach(c => {
                                    const w = c.val();
                                    if(w.status === 'approved' || w.status === 'pending') withdrawn += parseFloat(w.amountBDT || w.amount || 0);
                                });
                            }
                            const total = (current + withdrawn) / RATE;
                            document.getElementById('totalMoney').innerText = "$" + total.toFixed(2);
                        });

                        loadTeamData(data.ownCode);
                    }
                });
            }
        });

        function loadTeamData(myCode) {
            let totalMembers = 0;
            let seen = new Set();
            
            document.querySelectorAll('.list-wrapper').forEach(el => el.innerHTML = "");

            function recurse(code, depth) {
                if(depth > 3) return;
                db.ref('users').orderByChild('referredBy').equalTo(code).on('child_added', s => {
                    if(seen.has(s.key)) return;
                    seen.add(s.key);
                    const u = s.val();
                    
                    if(u.status === 'active') {
                        totalMembers++;
                        document.getElementById('totalCount').innerText = totalMembers;
                        renderCard(u, depth);
                    }
                    if(u.ownCode) recurse(u.ownCode, depth + 1);
                });
            }
            recurse(myCode, 1);
        }

        function renderCard(user, depth) {
            const html = `
                <div class="member-card">
                    <div>
                        <div style="font-weight:600;">${user.firstName || 'User'}</div>
                        <small style="color:#64748b;">ID: ${user.ownCode}</small>
                    </div>
                    <div style="text-align:right;">
                        <div style="color:#10b981; font-weight:bold;">Active</div>
                        <span style="font-size:0.7rem; background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px;">Level ${depth}</span>
                    </div>
                </div>`;
            document.getElementById('list-all').insertAdjacentHTML('beforeend', html);
            document.getElementById(`list-${depth}`).insertAdjacentHTML('beforeend', html);
        }

        function showTab(id) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.list-wrapper').forEach(l => l.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`list-${id}`).classList.add('active');
        }
        
        function copyLink() {
            navigator.clipboard.writeText(`https://shopping28.github.io/-/login_register.html?ref=${document.getElementById('myCode').innerText}`);
            alert("Copied!");
        }
    </script>
</body>
</html>
