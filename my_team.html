<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team | SHOPPING28</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === PREMIUM VARIABLES === */
        :root {
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-gold: #ffd700;
            --neon-blue: #00f2ff;
            --neon-green: #00ff88;
            --neon-purple: #bc13fe;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0; padding: 0; padding-bottom: 50px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            position: relative;
        }

        /* AMBIENT LIGHTS */
        .ambient-light { position: fixed; border-radius: 50%; filter: blur(90px); z-index: -1; opacity: 0.4; }
        .al-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: radial-gradient(circle, #4c00ff, transparent); }
        .al-2 { bottom: 10%; right: -10%; width: 250px; height: 250px; background: radial-gradient(circle, #ff0055, transparent); }

        /* HEADER */
        .header {
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
        }
        .back-btn { 
            color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 600;
            display: flex; align-items: center; gap: 5px; transition: 0.3s;
        }
        .back-btn:hover { color: var(--neon-blue); }
        .logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 1px; }
        .logo span { background: linear-gradient(to right, #00c6ff, #0072ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* INVITE CARD */
        .invite-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 25px; margin: 20px;
            text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .invite-title { font-size: 0.8rem; text-transform: uppercase; color: var(--neon-blue); letter-spacing: 1px; margin-bottom: 10px; }
        .ref-code { font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255,255,255,0.1); margin: 0; }
        
        /* Link Box */
        .link-wrapper {
            background: rgba(0,0,0,0.3);
            border-radius: 12px; padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.05); margin-top: 15px;
        }
        .link-input { 
            background: transparent; border: none; color: var(--text-muted); 
            font-family: monospace; font-size: 0.85rem; width: 70%; outline: none; 
        }
        .copy-btn {
            background: var(--neon-blue); color: #000; border: none;
            padding: 6px 15px; border-radius: 20px; font-weight: 800; 
            font-size: 0.75rem; cursor: pointer; box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        /* STATS GRID */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 0 20px 25px; }
        .stat-box {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 20px; border-radius: 18px; text-align: center; position: relative;
        }
        .stat-num { font-size: 1.6rem; font-weight: 800; margin: 5px 0 0; color: #fff; }
        .stat-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .val-gold { color: var(--neon-gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        .val-blue { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }

        /* TABS */
        .tabs-wrapper { 
            margin: 0 20px 15px; display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; 
            scrollbar-width: none;
        }
        .tab-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: var(--text-muted); padding: 8px 20px; border-radius: 30px;
            white-space: nowrap; cursor: pointer; font-weight: 600; font-family: 'Outfit', sans-serif;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--neon-blue); color: #000; border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
        }

        /* LIST CONTAINER */
        .list-container { display: none; margin: 0 20px; }
        .list-container.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* MEMBER CARD */
        .member-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 15px; border-radius: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 3px solid var(--neon-green); position: relative;
        }
        .profit-badge {
            position: absolute; right: 10px; top: -8px;
            background: var(--neon-gold); color: #000; font-size: 0.65rem;
            padding: 2px 8px; border-radius: 10px; font-weight: 800;
        }
        .m-info h4 { margin: 0; font-size: 1rem; color: #fff; font-weight: 700; }
        .m-info small { color: var(--text-muted); font-size: 0.8rem; }
        .m-status {
            font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
            padding: 4px 10px; border-radius: 20px;
            color: var(--neon-green); background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

    </style>
</head>
<body onclick="unlockAudio()">

    <div class="ambient-light al-1"></div>
    <div class="ambient-light al-2"></div>

    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
        <div class="logo">SHOPPING<span>28</span></div>
    </div>

    <!-- REFERRAL BOX -->
    <div class="invite-card">
        <div class="invite-title">Personal Link</div>
        <div class="ref-code" id="myCode">...</div>
        
        <div class="link-wrapper">
            <input type="text" id="refLinkInput" class="link-input" readonly value="Loading...">
            <button class="copy-btn" onclick="copyLink()">Copy</button>
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-lbl">Active Team</div>
            <div class="stat-num val-blue" id="totalTeam">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-lbl">Team Profit</div>
            <div class="stat-num val-gold"><span id="totalIncome">0.00</span> USDT</div>
        </div>
    </div>

    <!-- TABS -->
    <div class="tabs-wrapper">
        <button class="tab-btn active" onclick="switchTab('lvl1')" id="btnLvl1">Level 1</button>
        <button class="tab-btn" onclick="switchTab('lvl2')" id="btnLvl2">Level 2</button>
        <button class="tab-btn" onclick="switchTab('lvl3')" id="btnLvl3">Level 3</button>
        <button class="tab-btn" onclick="switchTab('allActive')" id="btnAllActive">All List</button>
    </div>

    <!-- LISTS -->
    <div id="lvl1" class="list-container active"></div>
    <div id="lvl2" class="list-container"></div>
    <div id="lvl3" class="list-container"></div>
    <div id="allActive" class="list-container"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let COMMISSION = { level1: 0, level2: 0, level3: 0 };
        let currentUserCode = null;
        let isVoiceReady = false;
        let stats = { active: 0, profit: 0, lvl1: 0, lvl2: 0, lvl3: 0 };

        function unlockAudio() {
            if(isVoiceReady) return;
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
            isVoiceReady = true;
        }

        // CONVERT TAKA TO USDT (120 BDT = 1 USDT)
        function toUSDT(taka) {
            return (parseFloat(taka) / 120).toFixed(2);
        }

        // LOAD SETTINGS
        db.ref('settings/commissions').on('value', (snap) => {
            if(snap.exists()) { COMMISSION = snap.val(); if(currentUserCode) reloadAllData(); }
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('users/' + user.uid + '/ownCode').once('value', (snap) => {
                    if(snap.val()) {
                        currentUserCode = snap.val();
                        document.getElementById('myCode').innerText = currentUserCode;
                        document.getElementById('refLinkInput').value = `https://shopping28.github.io/-/login_register.html?ref=${currentUserCode}`;
                        reloadAllData();
                    }
                });
            } else { window.location.href = 'login_register.html'; }
        });

        function reloadAllData() {
            stats = { active: 0, profit: 0, lvl1: 0, lvl2: 0, lvl3: 0 };
            document.getElementById('lvl1').innerHTML = "";
            document.getElementById('lvl2').innerHTML = "";
            document.getElementById('lvl3').innerHTML = "";
            document.getElementById('allActive').innerHTML = "";
            updateDisplay();
            startLoadingTeam(currentUserCode);
        }

        function updateDisplay() {
            document.getElementById('totalTeam').innerText = stats.active;
            // Convert Total Profit to USDT for display
            document.getElementById('totalIncome').innerText = toUSDT(stats.profit);
            
            document.getElementById('btnLvl1').innerText = `Level 1 (${stats.lvl1})`;
            document.getElementById('btnLvl2').innerText = `Level 2 (${stats.lvl2})`;
            document.getElementById('btnLvl3').innerText = `Level 3 (${stats.lvl3})`;
        }

        function startLoadingTeam(myCode) {
            db.ref('users').orderByChild('referredBy').equalTo(myCode).on('value', (snapshot) => {
                const lvl1Container = document.getElementById('lvl1');
                lvl1Container.innerHTML = "";
                let level1Codes = [];
                let hasActive = false;

                if(snapshot.exists()) {
                    snapshot.forEach(child => {
                        const user = child.val();
                        if(user.status === 'active') {
                            renderMember(user, 1, lvl1Container);
                            if(user.ownCode) level1Codes.push(user.ownCode);
                            hasActive = true;
                        }
                    });
                    loadLevel2(level1Codes);
                } 
                
                if(!hasActive) {
                    lvl1Container.innerHTML = "<div style='text-align:center;color:#666;padding:20px;font-size:0.9rem;'>No Active Partners</div>";
                }
            });
        }

        let processedL2 = new Set();
        let processedL3 = new Set();

        function loadLevel2(parentCodes) {
            const lvl2Container = document.getElementById('lvl2');
            lvl2Container.innerHTML = "";
            parentCodes.forEach(code => {
                if(processedL2.has(code)) return;
                processedL2.add(code);
                db.ref('users').orderByChild('referredBy').equalTo(code).on('child_added', (snap) => {
                    const user = snap.val();
                    if(user.status === 'active') {
                        renderMember(user, 2, lvl2Container);
                        if(user.ownCode) loadLevel3([user.ownCode]);
                    }
                });
            });
        }

        function loadLevel3(parentCodes) {
            const lvl3Container = document.getElementById('lvl3');
            lvl3Container.innerHTML = "";
            parentCodes.forEach(code => {
                if(processedL3.has(code)) return;
                processedL3.add(code);
                db.ref('users').orderByChild('referredBy').equalTo(code).on('child_added', (snap) => {
                    const user = snap.val();
                    if(user.status === 'active') {
                        renderMember(user, 3, lvl3Container);
                    }
                });
            });
        }

        function renderMember(user, level, container) {
            if(user.status !== 'active') return;

            let profitBDT = 0;
            if(level === 1) profitBDT = COMMISSION.level1 || 0;
            if(level === 2) profitBDT = COMMISSION.level2 || 0;
            if(level === 3) profitBDT = COMMISSION.level3 || 0;
            
            stats.active++;
            stats.profit += profitBDT;

            if(level === 1) stats.lvl1++;
            if(level === 2) stats.lvl2++;
            if(level === 3) stats.lvl3++;

            updateDisplay();

            let phone = user.phone ? user.phone.toString() : "N/A";
            if(phone.length > 6) phone = phone.substring(0,3) + "**" + phone.substring(phone.length-3);

            // Convert individual profit to USDT for badge
            let profitUSDT = toUSDT(profitBDT);

            const html = `
                <div class="member-card">
                    <div class="profit-badge">+ ${profitUSDT} USDT</div>
                    <div class="m-info">
                        <h4>${user.firstName || 'User'}</h4>
                        <small>ID: ${user.ownCode || '...'}</small>
                    </div>
                    <div><span class="m-status">Active</span></div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            document.getElementById('allActive').insertAdjacentHTML('beforeend', html);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.list-container').forEach(div => div.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            let btnId = 'btn' + tabId.charAt(0).toUpperCase() + tabId.slice(1);
            document.getElementById(btnId).classList.add('active');
        }

        function copyLink() {
            const linkInput = document.getElementById('refLinkInput');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(linkInput.value);
            alert("Referral Link Copied!");
        }
    </script>
</body>
</html>
