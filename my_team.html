<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team | Crypto Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px; padding-bottom: 80px;
            min-height: 100vh;
        }

        /* HEADER */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .back-link {
            color: var(--text-sub); text-decoration: none;
            background: var(--bg-card); width: 40px; height: 40px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .page-heading { font-size: 1.1rem; font-weight: 700; }

        /* INVITE CARD */
        .invite-card {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 20px; padding: 25px; margin-bottom: 20px;
            text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
        }
        .ic-title { font-size: 0.8rem; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 1px; }
        .ic-code { font-size: 2.2rem; font-weight: 800; color: #fff; margin: 5px 0 15px 0; letter-spacing: 2px; }
        
        .link-box {
            background: rgba(0,0,0,0.2); padding: 8px 8px 8px 15px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1);
        }
        .link-txt { font-family: monospace; color: #e2e8f0; font-size: 0.85rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 180px; }
        .copy-btn {
            background: #fff; color: #4f46e5; border: none; padding: 8px 15px;
            border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer;
        }

        /* STATS GRID */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-item { background: var(--bg-card); padding: 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-lbl { color: var(--text-sub); font-size: 0.8rem; margin-bottom: 5px; }
        .stat-val { font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
        .val-money { color: var(--success); }

        /* TABS */
        .tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 15px; scrollbar-width: none; }
        .tab {
            background: var(--bg-card); color: var(--text-sub); border: 1px solid rgba(255,255,255,0.05);
            padding: 8px 16px; border-radius: 20px; white-space: nowrap; font-size: 0.85rem; font-weight: 600;
            transition: 0.3s;
        }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* MEMBER LIST */
        .list-area { display: none; flex-direction: column; gap: 10px; }
        .list-area.active { display: flex; animation: fadeUp 0.4s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .member-row {
            background: var(--bg-card); padding: 15px; border-radius: 14px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .m-left { display: flex; flex-direction: column; }
        .m-name { font-weight: 600; font-size: 0.95rem; color: var(--text-main); }
        .m-id { font-size: 0.75rem; color: var(--text-sub); font-family: monospace; }
        
        .m-right { text-align: right; }
        .m-profit { color: var(--success); font-weight: 700; font-size: 0.9rem; display: block; }
        .m-badge { 
            background: rgba(16, 185, 129, 0.1); color: var(--success); 
            font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; margin-top: 4px; display: inline-block;
        }

        .empty-state { text-align: center; color: var(--text-sub); padding: 30px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-nav">
        <a href="home.html" class="back-link"><i class="fas fa-arrow-left"></i></a>
        <div class="page-heading">My Network</div>
        <div style="width:40px;"></div>
    </div>

    <!-- Referral Card -->
    <div class="invite-card">
        <div class="ic-title">Referral Code</div>
        <div class="ic-code" id="myCode">...</div>
        <div class="link-box">
            <div class="link-txt" id="refLinkTxt">Loading...</div>
            <button class="copy-btn" onclick="copyLink()">Copy</button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-item">
            <div class="stat-lbl">Active Partners</div>
            <div class="stat-val" id="totalTeam">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-lbl">Total Profit</div>
            <div class="stat-val val-money">$<span id="totalIncome">0.00</span></div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('lvl1')" id="btnLvl1">Level 1</button>
        <button class="tab" onclick="switchTab('lvl2')" id="btnLvl2">Level 2</button>
        <button class="tab" onclick="switchTab('lvl3')" id="btnLvl3">Level 3</button>
        <button class="tab" onclick="switchTab('allActive')" id="btnAllActive">All List</button>
    </div>

    <!-- Lists -->
    <div id="lvl1" class="list-area active"></div>
    <div id="lvl2" class="list-area"></div>
    <div id="lvl3" class="list-area"></div>
    <div id="allActive" class="list-area"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let GLOBAL_COMMISSION = { level1: 0, level2: 0, level3: 0 };
        let currentUserCode = null;
        let stats = { active: 0, profitBDT: 0, lvl1: 0, lvl2: 0, lvl3: 0 };
        const RATE = 120; // 120 BDT = 1 USD

        // 1. Load Global Fallback Rates
        db.ref('settings/commissions').on('value', (snap) => {
            if(snap.exists()) { GLOBAL_COMMISSION = snap.val(); if(currentUserCode) reloadAllData(); }
        });

        auth.onAuthStateChanged((user) => {
            if (user) {
                db.ref('users/' + user.uid + '/ownCode').once('value', (snap) => {
                    if(snap.val()) {
                        currentUserCode = snap.val();
                        document.getElementById('myCode').innerText = currentUserCode;
                        
                        const link = `https://shopping28.github.io/-/login_register.html?ref=${currentUserCode}`;
                        document.getElementById('refLinkTxt').innerText = link;
                        
                        reloadAllData();
                    }
                });
            } else { window.location.href = 'login_register.html'; }
        });

        function reloadAllData() {
            stats = { active: 0, profitBDT: 0, lvl1: 0, lvl2: 0, lvl3: 0 };
            document.getElementById('lvl1').innerHTML = "";
            document.getElementById('lvl2').innerHTML = "";
            document.getElementById('lvl3').innerHTML = "";
            document.getElementById('allActive').innerHTML = "";
            updateDisplay();
            startLoadingTeam(currentUserCode);
        }

        function updateDisplay() {
            document.getElementById('totalTeam').innerText = stats.active;
            
            // Convert Total BDT Profit to USD for display
            const usdProfit = (stats.profitBDT / RATE).toFixed(2);
            document.getElementById('totalIncome').innerText = usdProfit;
            
            document.getElementById('btnLvl1').innerText = `Level 1 (${stats.lvl1})`;
            document.getElementById('btnLvl2').innerText = `Level 2 (${stats.lvl2})`;
            document.getElementById('btnLvl3').innerText = `Level 3 (${stats.lvl3})`;
        }

        function startLoadingTeam(myCode) {
            db.ref('users').orderByChild('referredBy').equalTo(myCode).on('value', (snapshot) => {
                const lvl1Container = document.getElementById('lvl1');
                lvl1Container.innerHTML = "";
                let level1Codes = [];
                let hasActive = false;

                if(snapshot.exists()) {
                    snapshot.forEach(child => {
                        const user = child.val();
                        if(user.status === 'active') {
                            renderMember(user, 1, lvl1Container);
                            if(user.ownCode) level1Codes.push(user.ownCode);
                            hasActive = true;
                        }
                    });
                    loadLevel2(level1Codes);
                } 
                
                if(!hasActive) lvl1Container.innerHTML = "<div class='empty-state'>No Active Partners</div>";
            });
        }

        let processedL2 = new Set();
        let processedL3 = new Set();

        function loadLevel2(parentCodes) {
            const lvl2Container = document.getElementById('lvl2');
            lvl2Container.innerHTML = "";
            parentCodes.forEach(code => {
                if(processedL2.has(code)) return;
                processedL2.add(code);
                db.ref('users').orderByChild('referredBy').equalTo(code).on('child_added', (snap) => {
                    const user = snap.val();
                    if(user.status === 'active') {
                        renderMember(user, 2, lvl2Container);
                        if(user.ownCode) loadLevel3([user.ownCode]);
                    }
                });
            });
        }

        function loadLevel3(parentCodes) {
            const lvl3Container = document.getElementById('lvl3');
            lvl3Container.innerHTML = "";
            parentCodes.forEach(code => {
                if(processedL3.has(code)) return;
                processedL3.add(code);
                db.ref('users').orderByChild('referredBy').equalTo(code).on('child_added', (snap) => {
                    const user = snap.val();
                    if(user.status === 'active') {
                        renderMember(user, 3, lvl3Container);
                    }
                });
            });
        }

        // === CORE LOGIC ===
        function renderMember(user, level, container) {
            if(user.status !== 'active') return;

            // 1. PROFIT LOCK CHECK
            // Check if user has 'fixed_commissions' (saved at activation). If not, use GLOBAL.
            let usedRates = user.fixed_commissions ? user.fixed_commissions : GLOBAL_COMMISSION;

            // 2. GET BDT PROFIT (Data stored in BDT)
            let profitBDT = 0;
            if(level === 1) profitBDT = parseFloat(usedRates.level1) || 0;
            if(level === 2) profitBDT = parseFloat(usedRates.level2) || 0;
            if(level === 3) profitBDT = parseFloat(usedRates.level3) || 0;
            
            // 3. UPDATE STATS
            stats.active++;
            stats.profitBDT += profitBDT;

            if(level === 1) stats.lvl1++;
            if(level === 2) stats.lvl2++;
            if(level === 3) stats.lvl3++;

            updateDisplay();

            // 4. DISPLAY IN USD
            let profitUSDT = (profitBDT / RATE).toFixed(2);
            let phone = user.phone ? user.phone.toString() : "N/A";

            const html = `
                <div class="member-row">
                    <div class="m-left">
                        <span class="m-name">User: ${user.ownCode}</span>
                        <span class="m-id">Ref By: ${user.referredBy}</span>
                    </div>
                    <div class="m-right">
                        <span class="m-profit">+$${profitUSDT}</span>
                        <span class="m-badge">Level ${level}</span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            document.getElementById('allActive').insertAdjacentHTML('beforeend', html);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.list-area').forEach(div => div.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            let btnId = 'btn' + tabId.charAt(0).toUpperCase() + tabId.slice(1);
            document.getElementById(btnId).classList.add('active');
        }

        function copyLink() {
            const txt = document.getElementById('refLinkTxt').innerText;
            navigator.clipboard.writeText(txt);
            alert("Copied!");
        }
    </script>
</body>
</html>
