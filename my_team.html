<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team | Premium Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* PREMIUM THEME SETTINGS */
        :root {
            --bg-dark: #0f0c29;
            --bg-gradient: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            --card-bg: rgba(255, 255, 255, 0.05);
            --active-color: #00f260;
            --pending-color: #ff4757;
            --text-main: #ffffff;
            --text-muted: #a4b0be;
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* HEADER & REFERRAL CARD */
        .header-nav { display: flex; align-items: center; margin-bottom: 20px; font-size: 1.1rem; font-weight: 600; }
        .header-nav a { color: white; text-decoration: none; margin-right: 15px; }

        .ref-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.4);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }
        
        .code-display {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin: 15px 0;
            border: 1px dashed rgba(255,255,255,0.4);
        }

        .copy-btn {
            background: white; color: #764ba2; border: none; padding: 8px 25px;
            border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .copy-btn:active { transform: scale(0.95); }

        /* DASHBOARD STATS */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: var(--glass-border);
            backdrop-filter: blur(10px);
        }
        .stat-box h2 { margin: 5px 0; font-size: 1.4rem; }
        .full-width { grid-column: span 2; background: linear-gradient(to right, rgba(255, 215, 0, 0.1), rgba(255, 165, 0, 0.1)); border: 1px solid rgba(255, 215, 0, 0.3); }

        /* TABS */
        .tabs-container {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px;
            scrollbar-width: none; 
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 30px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #0f0c29;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* MEMBER LIST STYLE */
        .list-section { display: none; animation: slideUp 0.4s ease; }
        .list-section.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .member-card {
            background: rgba(30, 30, 50, 0.6);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            border-left: 4px solid #555;
            transition: transform 0.2s;
        }
        
        /* ACTIVE STYLE */
        .member-card.is-active {
            border-left-color: var(--active-color);
            background: linear-gradient(90deg, rgba(0, 242, 96, 0.05), transparent);
        }
        /* PENDING STYLE */
        .member-card.is-pending {
            border-left-color: var(--pending-color);
            background: linear-gradient(90deg, rgba(255, 71, 87, 0.05), transparent);
        }

        .user-left { display: flex; align-items: center; flex: 1; }

        .user-avatar {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; margin-right: 12px;
        }
        
        .user-details h4 { margin: 0; font-size: 0.95rem; color: white; margin-bottom: 4px; }
        
        /* ID & Phone Styling */
        .info-badges { display: flex; gap: 5px; flex-wrap: wrap; }
        .badge { 
            font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; 
            display: inline-flex; align-items: center; gap: 4px;
        }
        .id-badge { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .phone-badge { background: rgba(0,0,0,0.3); color: var(--text-muted); }

        .status-pill {
            padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: bold; text-transform: uppercase; margin-left: 10px;
        }
        .pill-active { background: rgba(0, 242, 96, 0.2); color: var(--active-color); }
        .pill-pending { background: rgba(255, 71, 87, 0.2); color: var(--pending-color); }

        .profit-badge {
            position: absolute; top: 0; right: 0;
            background: #ffd700; color: black;
            font-size: 0.65rem; font-weight: bold;
            padding: 2px 8px; border-bottom-left-radius: 8px;
        }

    </style>
</head>
<body onclick="unlockAudio()">

    <div class="header-nav">
        <a href="home.html"><i class="fas fa-chevron-left"></i></a>
        <span>Team Network</span>
    </div>

    <!-- REFERRAL SECTION -->
    <div class="ref-card">
        <p style="margin:0; font-size:0.9rem; opacity:0.9;">Your Referral Code</p>
        <div class="code-display" id="myCode">...</div>
        <button class="copy-btn" onclick="copyCode()"><i class="far fa-copy"></i> Copy Code</button>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-box">
            <h2 id="totalTeam" style="color:var(--active-color)">0</h2>
            <small style="color:#aaa">Active</small>
        </div>
        <div class="stat-box">
            <h2 id="totalPending" style="color:var(--pending-color)">0</h2>
            <small style="color:#aaa">Pending</small>
        </div>
        <div class="stat-box full-width">
            <h2 id="totalIncome" style="color:#ffd700">৳0</h2>
            <small style="color:#aaa">Total Team Profit</small>
        </div>
    </div>

    <!-- TABS -->
    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab('lvl1')" id="btnLvl1">Level 1</button>
        <button class="tab-btn" onclick="switchTab('lvl2')" id="btnLvl2">Level 2</button>
        <button class="tab-btn" onclick="switchTab('lvl3')" id="btnLvl3">Level 3</button>
        <button class="tab-btn" onclick="switchTab('allActive')" id="btnAllActive" style="border-color:var(--active-color)">Active List</button>
    </div>

    <!-- LISTS -->
    <div id="lvl1" class="list-section active"> <div style="text-align:center; padding:20px; color:#666;">Loading...</div> </div>
    <div id="lvl2" class="list-section"></div>
    <div id="lvl3" class="list-section"></div>
    <div id="allActive" class="list-section"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g",
            authDomain: "art-paid-work001.firebaseapp.com",
            databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com",
            projectId: "art-paid-work001",
            storageBucket: "art-paid-work001.firebasestorage.app",
            messagingSenderId: "524647364992",
            appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let COMMISSION = { level1: 0, level2: 0, level3: 0 };
        let currentUserCode = null;
        let isVoiceReady = false;

        let stats = { active: 0, pending: 0, profit: 0, lvl1: 0, lvl2: 0, lvl3: 0 };

        // VOICE FEATURE
        function unlockAudio() {
            if(isVoiceReady) return;
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
            isVoiceReady = true;
            speakNow("Your team report is ready");
        }
        function speakNow(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }

        // LOAD SETTINGS
        db.ref('settings/commissions').on('value', (snap) => {
            if(snap.exists()) { COMMISSION = snap.val(); if(currentUserCode) reloadAllData(); }
        });

        // AUTH
        auth.onAuthStateChanged((user) => {
            if (user) {
                if(isVoiceReady) speakNow("Your team report is ready");
                db.ref('users/' + user.uid + '/ownCode').once('value', (snap) => {
                    if(snap.val()) {
                        currentUserCode = snap.val();
                        document.getElementById('myCode').innerText = currentUserCode;
                        reloadAllData();
                    }
                });
            } else { window.location.href = 'login_register.html'; }
        });

        function reloadAllData() {
            stats = { active: 0, pending: 0, profit: 0, lvl1: 0, lvl2: 0, lvl3: 0 };
            document.getElementById('lvl1').innerHTML = "";
            document.getElementById('lvl2').innerHTML = "";
            document.getElementById('lvl3').innerHTML = "";
            document.getElementById('allActive').innerHTML = "";
            updateDisplay();
            startLoadingTeam(currentUserCode);
        }

        function updateDisplay() {
            document.getElementById('totalTeam').innerText = stats.active;
            document.getElementById('totalPending').innerText = stats.pending;
            document.getElementById('totalIncome').innerText = "৳" + stats.profit;
            
            document.getElementById('btnLvl1').innerText = `Level 1 (${stats.lvl1})`;
            document.getElementById('btnLvl2').innerText = `Level 2 (${stats.lvl2})`;
            document.getElementById('btnLvl3').innerText = `Level 3 (${stats.lvl3})`;
        }

        // --- TEAM LOADING LOGIC ---
        function startLoadingTeam(myCode) {
            db.ref('users').orderByChild('referredBy').equalTo(myCode).on('value', (snapshot) => {
                const lvl1Container = document.getElementById('lvl1');
                lvl1Container.innerHTML = "";
                let level1Codes = [];

                if(snapshot.exists()) {
                    snapshot.forEach(child => {
                        const user = child.val();
                        renderMember(user, 1, lvl1Container);
                        if(user.ownCode) level1Codes.push(user.ownCode);
                    });
                    loadLevel2(level1Codes);
                } else {
                    showEmptyMsg('lvl1', "No Level 1 Members");
                }
            });
        }

        let processedL2 = new Set();
        let processedL3 = new Set();

        function loadLevel2(parentCodes) {
            const lvl2Container = document.getElementById('lvl2');
            lvl2Container.innerHTML = "";
            parentCodes.forEach(code => {
                if(processedL2.has(code)) return;
                processedL2.add(code);
                db.ref('users').orderByChild('referredBy').equalTo(code).on('child_added', (snap) => {
                    const user = snap.val();
                    renderMember(user, 2, lvl2Container);
                    if(user.ownCode) loadLevel3([user.ownCode]);
                });
            });
        }

        function loadLevel3(parentCodes) {
            const lvl3Container = document.getElementById('lvl3');
            lvl3Container.innerHTML = "";
            parentCodes.forEach(code => {
                if(processedL3.has(code)) return;
                processedL3.add(code);
                db.ref('users').orderByChild('referredBy').equalTo(code).on('child_added', (snap) => {
                    renderMember(snap.val(), 3, lvl3Container);
                });
            });
        }

        function renderMember(user, level, container) {
            let profit = 0;
            const isActive = (user.status === 'active');
            
            let statusClass = isActive ? "is-active" : "is-pending";
            let icon = isActive ? "fa-user-check" : "fa-user-clock";
            let pillClass = isActive ? "pill-active" : "pill-pending";
            let pillText = isActive ? "Active" : "Pending";
            let profitHtml = "";

            if(isActive) {
                stats.active++;
                if(level === 1) profit = COMMISSION.level1 || 0;
                if(level === 2) profit = COMMISSION.level2 || 0;
                if(level === 3) profit = COMMISSION.level3 || 0;
                stats.profit += profit;
                profitHtml = `<div class="profit-badge">+ ৳${profit}</div>`;
            } else {
                stats.pending++;
            }

            if(level === 1) stats.lvl1++;
            if(level === 2) stats.lvl2++;
            if(level === 3) stats.lvl3++;

            updateDisplay();

            // Phone masking (017****123)
            let phone = user.phone ? user.phone.toString() : "N/A";
            if(phone.length > 6) phone = phone.substring(0,3) + "****" + phone.substring(phone.length-3);

            // Display ID logic: user.ownCode (Referral Code)
            let userIdDisplay = user.ownCode ? user.ownCode : "Pending ID";

            const html = `
                <div class="member-card ${statusClass}">
                    ${profitHtml}
                    <div class="user-left">
                        <div class="user-avatar" style="color:${isActive ? '#00f260':'#ff4757'}">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="user-details">
                            <h4>${user.firstName || 'Unknown User'}</h4>
                            <div class="info-badges">
                                <span class="badge id-badge"><i class="fas fa-id-card"></i> ${userIdDisplay}</span>
                                <span class="badge phone-badge"><i class="fas fa-phone-alt"></i> ${phone}</span>
                            </div>
                        </div>
                    </div>
                    <div class="status-pill ${pillClass}">
                        ${pillText}
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('beforeend', html);

            // Add to All Active Tab only if active
            if(isActive) {
                const allActiveContainer = document.getElementById('allActive');
                allActiveContainer.insertAdjacentHTML('beforeend', html);
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.list-section').forEach(div => div.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            // Map button ID
            let btnId = 'btn' + tabId.charAt(0).toUpperCase() + tabId.slice(1);
            document.getElementById(btnId).classList.add('active');
        }

        function showEmptyMsg(divId, msg) {
            document.getElementById(divId).innerHTML = `<div style="text-align:center; padding:20px; color:#666;">${msg}</div>`;
        }

        function copyCode() {
            navigator.clipboard.writeText(document.getElementById('myCode').innerText);
            alert("Referral Code Copied!");
        }
    </script>
</body>
</html>
