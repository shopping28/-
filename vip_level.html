<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; padding: 20px; min-height: 100vh; }
        
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back { color: #aaa; text-decoration: none; font-size: 1.1rem; }

        /* USER STATS BOX */
        .my-stats {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 30px;
            color: black; box-shadow: 0 10px 30px rgba(241, 196, 15, 0.3);
        }

        /* VIP CARD STYLE */
        .vip-card {
            background: #1a1a2e; padding: 20px; border-radius: 15px; margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1); position: relative;
            transition: 0.3s;
        }
        
        /* Different States */
        .vip-card.completed { border: 1px solid #00f260; background: rgba(0, 242, 96, 0.05); }
        .vip-card.locked { opacity: 0.7; border: 1px dashed #555; }
        
        .v-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .v-badge { background: #333; color: #f1c40f; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        
        /* PROGRESS BAR */
        .progress-bg { background: #333; height: 10px; border-radius: 5px; overflow: hidden; margin: 15px 0 5px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f1c40f, #f39c12); width: 0%; transition: width 1s ease-in-out; }
        .completed .progress-fill { background: #00f260; }

        /* STATUS TAGS */
        .status-text {
            font-size: 0.85rem; font-weight: bold; text-align: center; margin-top: 15px; padding: 8px; border-radius: 8px;
        }
        .text-locked { background: rgba(255,255,255,0.05); color: #aaa; }
        .text-success { background: rgba(0, 242, 96, 0.2); color: #00f260; }
        .text-running { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }

    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <!-- Active Referral Counter -->
    <div class="my-stats">
        <small style="font-weight:600; text-transform:uppercase;">My Active Team</small>
        <h1 style="margin:5px 0; font-size:3.5rem;" id="myRef">0</h1>
        <small>Active Members</small>
    </div>

    <h3 style="border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:20px;">VIP Progress</h3>
    
    <!-- All Levels will load here -->
    <div id="levelContainer">
        <p style="text-align:center; color:#777;">Loading VIP Levels...</p>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g",
          authDomain: "art-paid-work001.firebaseapp.com",
          databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com",
          projectId: "art-paid-work001",
          storageBucket: "art-paid-work001.firebasestorage.app",
          messagingSenderId: "524647364992",
          appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let myActiveCount = 0;
        let claimedLevels = {}; // To store claimed status
        let vipLevelsData = []; // To store admin settings

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loadData();
            } else {
                window.location.href = 'login.html';
            }
        });

        function loadData() {
            // 1. Load Admin Settings (VIP Levels)
            db.ref('settings/vip_levels').on('value', (snap) => {
                vipLevelsData = [];
                if(snap.exists()){
                    snap.forEach(c => vipLevelsData.push(c.val()));
                    // Sort Levels (1, 2, 3...)
                    vipLevelsData.sort((a,b) => a.level - b.level);
                }
                getUserStats();
            });
        }

        function getUserStats() {
            // 2. Load User's Claimed History
            db.ref('users/' + currentUser.uid + '/claimed_levels').on('value', (snap) => {
                claimedLevels = snap.val() || {};
                
                // 3. Count Active Referrals
                db.ref('users/' + currentUser.uid + '/ownCode').once('value', (s) => {
                    const code = s.val();
                    if(code) {
                        db.ref('users').orderByChild('referredBy').equalTo(code).on('value', (teamSnap) => {
                            let count = 0;
                            if(teamSnap.exists()) {
                                teamSnap.forEach(member => {
                                    // IMPORTANT: Only count if status is active
                                    if(member.val().status === 'active') {
                                        count++;
                                    }
                                });
                            }
                            myActiveCount = count;
                            document.getElementById('myRef').innerText = myActiveCount;
                            renderLevels(); // Update UI
                        });
                    } else {
                        renderLevels();
                    }
                });
            });
        }

        function renderLevels() {
            const container = document.getElementById('levelContainer');
            container.innerHTML = "";

            if(vipLevelsData.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>No VIP levels set by Admin.</p>";
                return;
            }

            vipLevelsData.forEach(lvl => {
                // Calculation
                const percentage = Math.min((myActiveCount / lvl.target) * 100, 100);
                const isUnlocked = myActiveCount >= lvl.target;
                const isClaimed = claimedLevels['level' + lvl.level] === true;

                // Auto Claim Logic
                if(isUnlocked && !isClaimed) {
                    claimReward(lvl.level, lvl.bonus);
                }

                // UI Logic
                let cardClass = "locked";
                let statusBadge = `<div class="status-text text-locked"><i class="fas fa-lock"></i> LOCKED</div>`;
                
                if(isClaimed) {
                    cardClass = "completed";
                    statusBadge = `<div class="status-text text-success"><i class="fas fa-check-circle"></i> COMPLETED & PAID</div>`;
                } else if (!isClaimed && !isUnlocked) {
                    // Running
                    statusBadge = `<div class="status-text text-running">${myActiveCount} / ${lvl.target} Active Members</div>`;
                }

                const html = `
                    <div class="vip-card ${cardClass}">
                        <div class="v-header">
                            <span class="v-badge">LEVEL ${lvl.level}</span>
                            <span style="color:#f1c40f; font-weight:bold; font-size:1.1rem;">৳${lvl.bonus}</span>
                        </div>
                        
                        <div style="font-size:0.9rem; color:#ccc; margin-bottom:5px;">
                            Target: <span style="color:white;">${lvl.target} Active Referrals</span>
                        </div>

                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${percentage}%"></div>
                        </div>
                        
                        ${statusBadge}
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // Function to Auto-Add Balance
        function claimReward(levelNum, amount) {
            const levelKey = 'level' + levelNum;
            
            // Local check to prevent infinite loop before DB update
            if(claimedLevels[levelKey]) return;
            claimedLevels[levelKey] = true; 

            db.ref('users/' + currentUser.uid).transaction(user => {
                if (user) {
                    if (!user.claimed_levels) user.claimed_levels = {};
                    if (user.claimed_levels[levelKey]) return; // Already claimed in DB

                    user.balance = (user.balance || 0) + amount;
                    user.claimed_levels[levelKey] = true;
                }
                return user;
            }, (error, committed, snapshot) => {
                if(committed) {
                    // Optional: Show a popup notification
                    // alert(`Congratulation! Level ${levelNum} Unlocked. ৳${amount} Added!`);
                }
            });
        }
    </script>
</body>
</html>
