<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Royal Levels</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === LUXURY VARIABLES === */
        :root {
            --bg-deep: #0a0a0a;
            --card-bg: linear-gradient(145deg, #1a1a1a, #111);
            --gold-gradient: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --gold-text: #FDC830;
            --neon-green: #00f260;
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            margin: 0; padding: 0; padding-bottom: 80px;
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 0%, #1f1f1f 0%, #0a0a0a 70%);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(191, 149, 63, 0.2);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .back-btn { color: var(--text-muted); text-decoration: none; font-size: 1rem; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-btn:hover { color: #fff; }
        .page-title { 
            font-weight: 800; font-size: 1.2rem; letter-spacing: 2px; 
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* HERO CARD (Premium Gold Look) */
        .hero-card {
            background: linear-gradient(135deg, #1c1c1c 0%, #000000 100%);
            border: 1px solid rgba(191, 149, 63, 0.3);
            border-radius: 20px; padding: 30px;
            text-align: center; margin: 25px 20px;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .hero-card::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 60%);
            animation: shine 6s infinite linear;
        }
        @keyframes shine { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .hero-icon { font-size: 2rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .hero-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; position: relative; z-index: 2; }
        .hero-count { font-size: 3.5rem; font-weight: 900; margin: 5px 0; color: #fff; text-shadow: 0 0 20px rgba(191, 149, 63, 0.5); position: relative; z-index: 2; }
        .hero-desc { font-size: 0.8rem; color: #666; position: relative; z-index: 2; }

        /* LEVEL LIST */
        .level-container { margin: 0 20px; display: flex; flex-direction: column; gap: 20px; }

        .vip-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 20px;
            position: relative; overflow: hidden;
            transition: transform 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .vip-card.locked { opacity: 0.6; filter: grayscale(0.8); }
        .vip-card.running { border: 1px solid rgba(191, 149, 63, 0.5); box-shadow: 0 0 20px rgba(191, 149, 63, 0.1) inset; }
        .vip-card.completed { border: 1px solid var(--neon-green); background: linear-gradient(145deg, #0a1f13, #050505); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .lvl-badge { 
            background: #222; padding: 6px 14px; border-radius: 30px; border: 1px solid #333;
            font-size: 0.75rem; font-weight: 800; color: #fff; letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .bonus-txt { 
            font-size: 1.3rem; font-weight: 900; 
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.2);
        }

        .progress-track {
            height: 8px; background: #222; border-radius: 10px; overflow: hidden; margin-bottom: 12px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .progress-fill { height: 100%; width: 0%; border-radius: 10px; transition: width 1.2s cubic-bezier(0.25, 1, 0.5, 1); position: relative; }
        .progress-fill::after {
            content: ''; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
            background-size: 1rem 1rem; animation: moveStripes 1s linear infinite;
        }
        @keyframes moveStripes { from { background-position: 1rem 0; } to { background-position: 0 0; } }

        .locked .progress-fill { background: #444; }
        .running .progress-fill { background: linear-gradient(90deg, #FDC830, #F37335); }
        .completed .progress-fill { background: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); }

        .card-footer { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

        /* Status Pills & Buttons */
        .status-pill {
            margin-top: 15px; text-align: center; padding: 12px; border-radius: 8px;
            font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
        }
        .st-lock { background: rgba(255,255,255,0.05); color: #555; }
        .st-run { background: linear-gradient(90deg, rgba(253, 200, 48, 0.1), rgba(243, 115, 53, 0.1)); color: #FDC830; border: 1px solid rgba(253, 200, 48, 0.2); }
        .st-done { background: rgba(0, 242, 96, 0.1); color: var(--neon-green); border: 1px solid rgba(0, 242, 96, 0.2); }
        
        .btn-claim {
            width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 8px;
            background: var(--gold-gradient); color: #000; font-weight: 900; letter-spacing: 1px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(191, 149, 63, 0.4);
            animation: pulseBtn 2s infinite;
        }
        @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .fade-up { animation: fadeUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: translateY(30px); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-chevron-left"></i> Dashboard</a>
        <div class="page-title">VIP ROYAL</div>
    </div>

    <!-- Active Direct Stats -->
    <div class="hero-card">
        <div class="hero-icon"><i class="fas fa-crown"></i></div>
        <div class="hero-label">Active Direct Partners</div>
        <div class="hero-count" id="myRef">0</div>
        <div class="hero-desc">Rewards for your personal referrals</div>
    </div>

    <!-- Levels List -->
    <div class="level-container" id="levelContainer">
        <div style="text-align:center; padding:50px; color:#444;">
            <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading...
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // UPDATED FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE",
            authDomain: "shopping28-84906.firebaseapp.com",
            databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com",
            projectId: "shopping28-84906",
            storageBucket: "shopping28-84906.firebasestorage.app",
            messagingSenderId: "252107906792",
            appId: "1:252107906792:web:d39b0be25c88e07015b35d"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let directActiveCount = 0; 
        const RATE = 120; // 1 USD = 120 BDT

        // VIP LEVELS CONFIGURATION
        const VIP_LEVELS = [
            { id: 1, target: 5, reward: 0.83 },
            { id: 2, target: 20, reward: 1.67 },
            { id: 3, target: 35, reward: 3.33 },
            { id: 4, target: 100, reward: 5.00 },
            { id: 5, target: 350, reward: 10.00 },
            { id: 6, target: 800, reward: 20.00 },
            { id: 7, target: 2000, reward: 50.00 }
        ];

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                calculateDirectReferrals(user.uid);
            } else {
                window.location.href = 'login_register.html';
            }
        });

        // 1. Calculate ONLY Direct Active Referrals
        function calculateDirectReferrals(uid) {
            db.ref('users/' + uid + '/ownCode').once('value', snap => {
                const myCode = snap.val();
                if(!myCode) return;

                // Query: Select users where 'referredBy' equals 'myCode'
                db.ref('users').orderByChild('referredBy').equalTo(myCode).on('value', teamSnap => {
                    let count = 0;
                    if(teamSnap.exists()) {
                        teamSnap.forEach(child => {
                            // Check if status is active
                            if(child.val().status === 'active') {
                                count++;
                            }
                        });
                    }
                    directActiveCount = count;
                    document.getElementById('myRef').innerText = directActiveCount;
                    renderLevels();
                });
            });
        }

        // 2. Render Levels
        function renderLevels() {
            db.ref('users/' + currentUser.uid + '/completed_levels/vip').once('value', snap => {
                const completed = snap.val() || {};
                const container = document.getElementById('levelContainer');
                container.innerHTML = "";

                VIP_LEVELS.forEach((lvl, index) => {
                    const progress = Math.min(directActiveCount, lvl.target);
                    const percent = (progress / lvl.target) * 100;
                    const isCompleted = completed[lvl.id];
                    const isEligible = directActiveCount >= lvl.target;

                    let statusClass = "locked";
                    let actionHtml = `<div class="status-pill st-lock"><i class="fas fa-lock"></i> LOCKED</div>`;

                    if (isCompleted) {
                        statusClass = "completed";
                        actionHtml = `<div class="status-pill st-done"><i class="fas fa-check-circle"></i> REWARD RECEIVED</div>`;
                    } else if (isEligible) {
                        statusClass = "running";
                        actionHtml = `<button class="btn-claim" onclick="claimVip(${lvl.id}, ${lvl.reward})">CLAIM $${lvl.reward} NOW</button>`;
                    } else if (directActiveCount > 0) {
                        statusClass = "running";
                        actionHtml = `<div class="status-pill st-run">IN PROGRESS</div>`;
                    }

                    const html = `
                        <div class="vip-card ${statusClass} fade-up" style="animation-delay: ${index * 0.1}s">
                            <div class="card-header">
                                <div class="lvl-badge">VIP ${lvl.id}</div>
                                <div class="bonus-txt">+ $${lvl.reward}</div>
                            </div>
                            
                            <div class="progress-track">
                                <div class="progress-fill" style="width: ${percent}%"></div>
                            </div>

                            <div class="card-footer">
                                <span><i class="fas fa-user-friends"></i> ${directActiveCount}/${lvl.target} Directs</span>
                                <span>${Math.floor(percent)}%</span>
                            </div>

                            ${actionHtml}
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', html);
                });
            });
        }

        // 3. Claim Logic
        function claimVip(levelId, reward) {
            const updates = {};
            const timestamp = Date.now();
            const rewardBDT = reward * RATE; // Convert USD Reward to BDT for wallet consistency

            // A. Add Balance (BDT)
            db.ref('users/' + currentUser.uid + '/balance').transaction(bal => (bal || 0) + rewardBDT);

            // B. Mark Completed
            updates['users/' + currentUser.uid + '/completed_levels/vip/' + levelId] = true;

            // C. Add to History
            const historyKey = db.ref('users/' + currentUser.uid + '/vip_rewards').push().key;
            updates['users/' + currentUser.uid + '/vip_rewards/' + historyKey] = {
                level: levelId,
                amount: reward, // Store USD value in history for reference
                amountBDT: rewardBDT,
                timestamp: timestamp
            };

            db.ref().update(updates).then(() => {
                alert(`Congratulations! $${reward} (approx ${rewardBDT} BDT) added to your balance.`);
                renderLevels();
            });
        }
    </script>
</body>
</html>
