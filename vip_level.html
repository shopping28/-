<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Levels | SHOPPING28</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === PREMIUM VARIABLES === */
        :root {
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-gold: #ffd700;
            --neon-blue: #00f2ff;
            --neon-green: #00ff88;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0; padding: 0; padding-bottom: 50px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            position: relative;
        }

        /* AMBIENT LIGHTS */
        .ambient-light { position: fixed; border-radius: 50%; filter: blur(90px); z-index: -1; opacity: 0.4; }
        .al-1 { top: -10%; left: -10%; width: 300px; height: 300px; background: radial-gradient(circle, #4c00ff, transparent); }
        .al-2 { bottom: 10%; right: -10%; width: 250px; height: 250px; background: radial-gradient(circle, #ff0055, transparent); }

        /* HEADER */
        .header {
            padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; z-index: 100;
        }
        .back-btn { color: var(--text-muted); text-decoration: none; font-size: 1.1rem; transition: 0.3s; }
        .back-btn:hover { color: var(--neon-blue); }
        .page-title { font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; }

        /* HERO CARD */
        .hero-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 30px;
            text-align: center; margin: 20px;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .hero-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--neon-gold), var(--neon-blue));
        }
        .hero-label { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .hero-count { font-size: 3rem; font-weight: 900; margin: 10px 0; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .hero-desc { font-size: 0.8rem; color: #888; }

        /* LEVEL CARD */
        .level-container { margin: 0 20px; display: flex; flex-direction: column; gap: 15px; }

        .vip-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 20px;
            position: relative; overflow: hidden;
            transition: 0.3s;
        }

        /* Card States */
        .vip-card.locked { opacity: 0.7; border-left: 4px solid #444; }
        .vip-card.running { border: 1px solid var(--neon-gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); }
        .vip-card.completed { 
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid var(--neon-green);
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .lvl-badge { 
            background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 8px;
            font-size: 0.8rem; font-weight: 800; color: #fff; letter-spacing: 1px;
        }
        .bonus-txt { font-size: 1.2rem; font-weight: 800; color: var(--neon-gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }

        .progress-box { position: relative; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        .progress-bar { height: 100%; width: 0%; border-radius: 10px; transition: width 1s ease; }
        
        .locked .progress-bar { background: #444; }
        .running .progress-bar { background: linear-gradient(90deg, #FF9966, #FF5E62); }
        .completed .progress-bar { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }

        .card-footer { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }

        .status-pill {
            margin-top: 15px; text-align: center; padding: 8px; border-radius: 10px;
            font-size: 0.8rem; font-weight: 800; text-transform: uppercase;
        }
        .st-lock { background: rgba(255,255,255,0.05); color: #666; }
        .st-run { background: rgba(255, 215, 0, 0.1); color: var(--neon-gold); }
        .st-done { background: rgba(0, 255, 136, 0.1); color: var(--neon-green); }

        /* Animation */
        .fade-up { animation: fadeUp 0.5s forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="ambient-light al-1"></div>
    <div class="ambient-light al-2"></div>

    <div class="header">
        <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
        <div class="page-title">VIP LEVELS</div>
    </div>

    <!-- Active Team Stats -->
    <div class="hero-card">
        <div class="hero-label">My Active Partners</div>
        <div class="hero-count" id="myRef">0</div>
        <div class="hero-desc">Increase active partners to unlock levels & earn USDT rewards.</div>
    </div>

    <!-- Levels List -->
    <div class="level-container" id="levelContainer">
        <div style="text-align:center; padding:30px; color:#666;">
            <i class="fas fa-circle-notch fa-spin"></i> Loading Levels...
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let myActiveCount = 0;
        let claimedLevels = {};
        let vipLevelsData = [];
        
        // CONVERSION RATE
        const RATE = 120; // 120 BDT = 1 USDT

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loadData();
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function loadData() {
            // Get Admin Levels (Assumed to be in BDT in Database)
            db.ref('settings/vip_levels').on('value', (snapshot) => {
                vipLevelsData = [];
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const val = child.val();
                        vipLevelsData.push({
                            level: Number(val.level),
                            target: Number(val.target),
                            bonusBDT: Number(val.bonus) // Storing Raw BDT value
                        });
                    });
                    vipLevelsData.sort((a, b) => a.level - b.level);
                }
                checkUserProgress();
            });
        }

        function checkUserProgress() {
            db.ref('users/' + currentUser.uid + '/claimed_levels').on('value', (snap) => {
                claimedLevels = snap.val() || {};

                db.ref('users/' + currentUser.uid + '/ownCode').once('value', (s) => {
                    const code = s.val();
                    if(code) {
                        db.ref('users').orderByChild('referredBy').equalTo(code).on('value', (teamSnap) => {
                            let count = 0;
                            if(teamSnap.exists()) {
                                teamSnap.forEach(m => { if(m.val().status === 'active') count++; });
                            }
                            myActiveCount = count;
                            document.getElementById('myRef').innerText = myActiveCount;
                            renderLevels();
                        });
                    } else {
                        document.getElementById('myRef').innerText = "0";
                        renderLevels();
                    }
                });
            });
        }

        function renderLevels() {
            const container = document.getElementById('levelContainer');
            container.innerHTML = "";

            if(vipLevelsData.length === 0) {
                container.innerHTML = "<div style='text-align:center; padding:20px; color:#666;'>No levels found.</div>";
                return;
            }

            vipLevelsData.forEach((lvl, index) => {
                const percent = Math.min((myActiveCount / lvl.target) * 100, 100);
                const isUnlocked = myActiveCount >= lvl.target;
                const isClaimed = claimedLevels['level' + lvl.level] === true;

                // CONVERT BDT TO USDT FOR DISPLAY
                const displayUSDT = (lvl.bonusBDT / RATE).toFixed(2);

                // Auto Claim Logic (Adds BDT to balance)
                if (isUnlocked && !isClaimed) {
                    autoClaimReward(lvl.level, lvl.bonusBDT);
                }

                let statusClass = "locked";
                let statusHtml = `<div class="status-pill st-lock"><i class="fas fa-lock"></i> LOCKED</div>`;
                
                if(isClaimed) {
                    statusClass = "completed";
                    statusHtml = `<div class="status-pill st-done"><i class="fas fa-check-circle"></i> RECEIVED</div>`;
                } else if(!isClaimed && !isUnlocked) {
                    statusClass = "running";
                    statusHtml = `<div class="status-pill st-run">IN PROGRESS</div>`;
                } else {
                    statusClass = "completed";
                    statusHtml = `<div class="status-pill st-run">CLAIMING...</div>`;
                }

                const html = `
                    <div class="vip-card ${statusClass} fade-up" style="animation-delay: ${index * 0.1}s">
                        <div class="card-header">
                            <div class="lvl-badge">LEVEL ${lvl.level}</div>
                            <div class="bonus-txt">+ ${displayUSDT} USDT</div>
                        </div>
                        
                        <div class="progress-box">
                            <div class="progress-bar" style="width: ${percent}%"></div>
                        </div>

                        <div class="card-footer">
                            <span>Target: ${lvl.target} Active</span>
                            <span>${Math.floor(percent)}%</span>
                        </div>

                        ${statusHtml}
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function autoClaimReward(lvlNum, amountBDT) {
            const key = 'level' + lvlNum;
            if (claimedLevels[key]) return;
            claimedLevels[key] = true; 

            db.ref('users/' + currentUser.uid).transaction(user => {
                if (user) {
                    if (!user.claimed_levels) user.claimed_levels = {};
                    if (user.claimed_levels[key]) return;

                    // ADD BDT TO BALANCE (So other pages can convert it properly)
                    user.balance = (user.balance || 0) + amountBDT; 
                    user.total_income = (user.total_income || 0) + amountBDT; 
                    user.claimed_levels[key] = true;
                }
                return user;
            });
        }
    </script>
</body>
</html>
