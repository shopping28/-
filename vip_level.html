<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; padding: 20px; min-height: 100vh; }
        
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back { color: #aaa; text-decoration: none; font-size: 1.1rem; }

        /* ACTIVE TEAM CARD */
        .my-stats {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 30px;
            color: black; box-shadow: 0 10px 30px rgba(241, 196, 15, 0.3);
        }

        /* VIP LEVEL CARD */
        .vip-card {
            background: #1a1a2e; padding: 20px; border-radius: 15px; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1); position: relative;
            transition: 0.3s;
        }
        
        /* Styles based on status */
        .vip-card.completed { border: 1px solid #00f260; background: rgba(0, 242, 96, 0.05); }
        .vip-card.locked { opacity: 0.8; border: 1px dashed #444; }

        .v-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .v-badge { background: #333; color: #f1c40f; padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; }
        
        .progress-bg { background: #333; height: 10px; border-radius: 5px; overflow: hidden; margin: 15px 0 5px 0; }
        .progress-fill { height: 100%; background: #f1c40f; width: 0%; transition: width 0.5s ease; }
        
        .status-msg {
            text-align: center; font-weight: bold; font-size: 0.85rem; padding: 8px; 
            border-radius: 6px; margin-top: 15px; display: block;
        }
        .msg-lock { background: rgba(255,255,255,0.1); color: #aaa; }
        .msg-done { background: rgba(0, 242, 96, 0.2); color: #00f260; }
        .msg-run { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }

    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="my-stats">
        <small style="font-weight:600; text-transform:uppercase;">My Active Team</small>
        <h1 style="margin:5px 0; font-size:3.5rem;" id="myRef">Loading...</h1>
        <small>Only Active Members Counted</small>
    </div>

    <h3 style="border-bottom:1px solid #333; padding-bottom:10px;">All VIP Levels</h3>
    
    <!-- এই ডিভ এর ভেতর জাভাস্ক্রিপ্ট দিয়ে সব লেভেল বসানো হবে -->
    <div id="levelContainer">
        <p style="text-align:center; color:#777;">Checking levels...</p>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g",
          authDomain: "art-paid-work001.firebaseapp.com",
          databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com",
          projectId: "art-paid-work001",
          storageBucket: "art-paid-work001.firebasestorage.app",
          messagingSenderId: "524647364992",
          appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let myActiveCount = 0;
        let claimedLevels = {};
        let vipLevelsData = [];

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                startSystem();
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function startSystem() {
            // ১. অ্যাডমিন থেকে সব লেভেল লোড করা
            db.ref('settings/vip_levels').on('value', (snapshot) => {
                vipLevelsData = []; // লিস্ট ক্লিয়ার
                
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const data = child.val();
                        // ডাটা সঠিক কিনা চেক করা
                        if(data.level && data.target && data.bonus) {
                            vipLevelsData.push(data);
                        }
                    });

                    // ২. লেভেল অনুযায়ী সাজানো (১, ২, ৩...)
                    vipLevelsData.sort((a, b) => Number(a.level) - Number(b.level));
                }

                // ডাটা লোড হওয়ার পর ইউজারের স্ট্যাটাস চেক
                checkUserStatus();
            });
        }

        function checkUserStatus() {
            // ইউজারের ক্লেইম করা লেভেলগুলো লোড
            db.ref('users/' + currentUser.uid + '/claimed_levels').on('value', (snap) => {
                claimedLevels = snap.val() || {};
                
                // ইউজারের এক্টিভ রেফারেল কাউন্ট করা
                db.ref('users/' + currentUser.uid + '/ownCode').once('value', (s) => {
                    const code = s.val();
                    if(code) {
                        db.ref('users').orderByChild('referredBy').equalTo(code).on('value', (teamSnap) => {
                            let count = 0;
                            if(teamSnap.exists()) {
                                teamSnap.forEach(member => {
                                    if(member.val().status === 'active') {
                                        count++;
                                    }
                                });
                            }
                            myActiveCount = count;
                            document.getElementById('myRef').innerText = myActiveCount;
                            
                            // সব ডাটা রেডি, এখন শো করাও
                            renderAllLevels();
                        });
                    } else {
                        document.getElementById('myRef').innerText = "0";
                        renderAllLevels();
                    }
                });
            });
        }

        // ৩. ফাইনাল রেন্ডারিং ফাংশন
        function renderAllLevels() {
            const container = document.getElementById('levelContainer');
            container.innerHTML = ""; // আগের সব ক্লিয়ার

            if (vipLevelsData.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>No VIP Levels Found.</p>";
                return;
            }

            // লুপ চালিয়ে সব কার্ড তৈরি
            vipLevelsData.forEach(lvl => {
                const percentage = Math.min((myActiveCount / lvl.target) * 100, 100);
                const isUnlocked = myActiveCount >= lvl.target;
                const isClaimed = claimedLevels['level' + lvl.level] === true;

                // অটো ক্লেইম লজিক
                if (isUnlocked && !isClaimed) {
                    autoClaim(lvl.level, lvl.bonus);
                }

                // কার্ডের ডিজাইন ঠিক করা
                let cardClass = "locked";
                let statusHtml = `<span class="status-msg msg-lock"><i class="fas fa-lock"></i> Locked</span>`;
                let progressColor = "#f1c40f";

                if (isClaimed) {
                    cardClass = "completed";
                    statusHtml = `<span class="status-msg msg-done"><i class="fas fa-check-circle"></i> Reward Received</span>`;
                    progressColor = "#00f260";
                } else if (!isClaimed && !isUnlocked) {
                    statusHtml = `<span class="status-msg msg-run">${myActiveCount} / ${lvl.target} Members</span>`;
                }

                // HTML তৈরি
                const html = `
                    <div class="vip-card ${cardClass}">
                        <div class="v-header">
                            <span class="v-badge">LEVEL ${lvl.level}</span>
                            <span style="color:#f1c40f; font-weight:bold;">Reward: ৳${lvl.bonus}</span>
                        </div>
                        <p style="font-size:0.9rem; color:#ccc; margin:5px 0;">Target: ${lvl.target} Active Referrals</p>
                        
                        <div class="progress-bg">
                            <div class="progress-fill" style="width:${percentage}%; background:${progressColor};"></div>
                        </div>
                        
                        ${statusHtml}
                    </div>
                `;
                container.innerHTML += html; // একের পর এক যুক্ত হবে
            });
        }

        function autoClaim(lvlNum, amount) {
            const key = 'level' + lvlNum;
            if (claimedLevels[key]) return;
            claimedLevels[key] = true; // লোকাল লক

            db.ref('users/' + currentUser.uid).transaction(u => {
                if (u) {
                    if (!u.claimed_levels) u.claimed_levels = {};
                    if (u.claimed_levels[key]) return;

                    u.balance = (u.balance || 0) + amount;
                    u.claimed_levels[key] = true;
                }
                return u;
            });
        }
    </script>
</body>
</html>
