<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; padding: 20px; min-height: 100vh; }
        
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back { color: #aaa; text-decoration: none; font-size: 1.1rem; }

        /* USER STATS */
        .my-stats {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 30px;
            color: black; box-shadow: 0 10px 30px rgba(241, 196, 15, 0.3);
        }

        /* LEVEL CARD */
        .vip-card {
            background: #1a1a2e; padding: 20px; border-radius: 15px; margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1); position: relative;
            transition: 0.3s;
        }
        .vip-card.completed { border-color: #00f260; background: #102a1d; }
        .vip-card.locked { opacity: 0.6; border: 1px dashed #555; }
        
        .v-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .v-badge { background: #333; color: #f1c40f; padding: 5px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; }
        
        .progress-bar { background: #333; height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .fill { height: 100%; background: #00f260; width: 0%; transition: 1s; }

        .status-tag {
            display: block; width: 100%; text-align: center; padding: 10px;
            border-radius: 8px; font-weight: bold; margin-top: 15px;
        }
        .tag-success { background: rgba(0, 242, 96, 0.2); color: #00f260; border: 1px solid #00f260; }
        .tag-locked { background: rgba(255, 255, 255, 0.05); color: #aaa; }

    </style>
</head>
<body>

    <div class="header">
        <a href="home.html" class="back"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="my-stats">
        <small style="opacity:0.8;">Active Referrals</small>
        <h1 style="margin:0; font-size:3rem;" id="myRef">Loading...</h1>
    </div>

    <h3 style="border-bottom:1px solid #333; padding-bottom:10px;">VIP Levels</h3>
    <div id="levelContainer">Loading levels...</div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g",
          authDomain: "art-paid-work001.firebaseapp.com",
          databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com",
          projectId: "art-paid-work001",
          storageBucket: "art-paid-work001.firebasestorage.app",
          messagingSenderId: "524647364992",
          appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let myActiveCount = 0; // Only Active Users
        let claimedLevels = {};
        let allLevelsData = [];

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                initSystem();
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function initSystem() {
            // 1. Load Admin Level Settings
            db.ref('settings/vip_levels').orderByChild('level').on('value', (snap) => {
                allLevelsData = [];
                if(snap.exists()) {
                    snap.forEach(c => allLevelsData.push(c.val()));
                    allLevelsData.sort((a,b) => a.level - b.level);
                }
                checkUserProgress();
            });

            // 2. Load User Claim History
            db.ref('users/' + currentUser.uid + '/claimed_levels').on('value', (snap) => {
                claimedLevels = snap.val() || {};
                checkUserProgress();
            });

            // 3. Load & Count ONLY ACTIVE Referrals
            db.ref('users/' + currentUser.uid + '/ownCode').once('value', (s) => {
                const code = s.val();
                if(code) {
                    db.ref('users').orderByChild('referredBy').equalTo(code).on('value', (team) => {
                        let activeCounter = 0;

                        if(team.exists()) {
                            team.forEach(child => {
                                const member = child.val();
                                // CHECK STATUS HERE
                                if(member.status === 'active') {
                                    activeCounter++;
                                }
                            });
                        }

                        myActiveCount = activeCounter;
                        document.getElementById('myRef').innerText = myActiveCount;
                        checkUserProgress(); // Re-check levels with new count
                    });
                } else {
                    document.getElementById('myRef').innerText = "0";
                }
            });
        }

        // 4. Main Logic: Check Progress with Active Count
        function checkUserProgress() {
            const container = document.getElementById('levelContainer');
            container.innerHTML = "";

            if(allLevelsData.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#aaa;'>No VIP levels active.</p>";
                return;
            }

            allLevelsData.forEach(l => {
                // Calculate progress based on ACTIVE count
                const progress = Math.min((myActiveCount / l.target) * 100, 100);
                const isClaimed = claimedLevels['level'+l.level] === true;
                const isUnlocked = myActiveCount >= l.target;

                // Auto Claim if Unlocked & Not Claimed
                if (isUnlocked && !isClaimed) {
                    autoClaimReward(l.level, l.bonus);
                }

                let statusHtml = "";
                let cardClass = "";

                if (isClaimed) {
                    cardClass = "completed";
                    statusHtml = `<div class="status-tag tag-success"><i class="fas fa-check-circle"></i> REWARD RECEIVED</div>`;
                } else {
                    cardClass = "locked";
                    statusHtml = `<div class="status-tag tag-locked"><i class="fas fa-lock"></i> LOCKED</div>`;
                }

                const html = `
                    <div class="vip-card ${cardClass}">
                        <div class="v-header">
                            <span class="v-badge">LEVEL ${l.level}</span>
                            <span style="color:#f1c40f; font-weight:bold;">Reward: ৳${l.bonus}</span>
                        </div>
                        <p style="font-size:0.9rem; margin:5px 0;">Target: ${l.target} Active Members</p>
                        
                        <div class="progress-bar">
                            <div class="fill" style="width:${progress}%"></div>
                        </div>
                        <small style="float:right; color:#aaa;">${myActiveCount} / ${l.target}</small>
                        <div style="clear:both;"></div>
                        
                        ${statusHtml}
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // 5. Auto Claim Function
        function autoClaimReward(level, amount) {
            const levelKey = 'level' + level;
            if(claimedLevels[levelKey]) return;

            // Mark locally to prevent loop
            claimedLevels[levelKey] = true;

            db.ref('users/' + currentUser.uid).transaction((user) => {
                if (user) {
                    if (!user.claimed_levels) user.claimed_levels = {};
                    if (user.claimed_levels[levelKey]) return; // Stop if already on server

                    user.balance = (user.balance || 0) + amount;
                    user.claimed_levels[levelKey] = true;
                }
                return user;
            }, (error, committed) => {
                if (committed) {
                    console.log(`Level ${level} Reward Auto-Added!`);
                }
            });
        }

    </script>
</body>
</html>
