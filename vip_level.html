<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Premium Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f1c40f;
            --success: #00e676;
            --dark: #121212;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: radial-gradient(circle at top, #1a1a2e, #0f0c29); 
            color: white; 
            font-family: 'Poppins', sans-serif; 
            min-height: 100vh;
            padding: 20px;
        }

        /* HEADER */
        .top-nav {
            display: flex; align-items: center; gap: 10px; margin-bottom: 25px;
        }
        .back-btn {
            background: var(--glass); width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; text-decoration: none; transition: 0.3s;
        }
        .back-btn:hover { background: var(--primary); color: black; }
        .page-title { font-size: 1.2rem; font-weight: 600; }

        /* STATS CARD (Hero Section) */
        .hero-card {
            background: linear-gradient(135deg, #FFD700, #F37335);
            border-radius: 20px; padding: 25px; text-align: center;
            box-shadow: 0 10px 30px rgba(243, 115, 53, 0.3);
            margin-bottom: 30px; position: relative; overflow: hidden;
        }
        .hero-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2), transparent);
            animation: rotate 10s linear infinite;
        }
        .hero-content { position: relative; z-index: 2; color: #000; }
        .hero-count { font-size: 3.5rem; font-weight: 800; margin: 5px 0; line-height: 1; }
        .hero-label { font-size: 0.9rem; font-weight: 600; letter-spacing: 1px; opacity: 0.8; }

        /* LEVEL LIST CONTAINER */
        .section-title { margin-bottom: 15px; font-size: 1.1rem; color: #ccc; border-left: 4px solid var(--primary); padding-left: 10px; }
        
        /* VIP CARD DESIGN */
        .vip-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px; padding: 20px; margin-bottom: 20px;
            position: relative; overflow: hidden; transition: transform 0.3s;
        }
        
        /* States */
        .vip-card.locked { opacity: 0.7; border-left: 5px solid #555; }
        .vip-card.running { border: 1px solid var(--primary); box-shadow: 0 0 15px rgba(241, 196, 15, 0.1); }
        .vip-card.completed { 
            background: linear-gradient(145deg, rgba(0, 230, 118, 0.1), rgba(0,0,0,0));
            border: 1px solid var(--success);
        }

        /* Card Header */
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .lvl-badge { 
            background: #222; padding: 5px 15px; border-radius: 20px; 
            font-size: 0.8rem; font-weight: bold; color: var(--primary); 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .reward-amount { font-size: 1.2rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

        /* Progress Bar */
        .progress-container {
            background: rgba(255,255,255,0.1); height: 8px; border-radius: 10px;
            overflow: hidden; margin: 15px 0 10px 0;
        }
        .progress-bar {
            height: 100%; width: 0%; border-radius: 10px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Bar Colors */
        .locked .progress-bar { background: #555; }
        .running .progress-bar { background: linear-gradient(90deg, #f1c40f, #ffeb3b); box-shadow: 0 0 10px #f1c40f; }
        .completed .progress-bar { background: var(--success); box-shadow: 0 0 10px var(--success); }

        /* Footer Info */
        .card-footer { display: flex; justify-content: space-between; font-size: 0.8rem; color: #aaa; }
        
        /* Status Tags */
        .status-pill {
            display: block; text-align: center; margin-top: 15px; padding: 8px;
            font-size: 0.8rem; font-weight: bold; border-radius: 8px; text-transform: uppercase;
        }
        .st-lock { background: rgba(255,255,255,0.05); color: #777; }
        .st-run { background: rgba(241, 196, 15, 0.1); color: var(--primary); }
        .st-done { background: rgba(0, 230, 118, 0.1); color: var(--success); }

        /* Icons */
        .icon-box { 
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; margin-right: 10px;
        }

        /* Animation */
        @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .vip-card { animation: popIn 0.5s ease-out forwards; }

    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-nav">
        <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <span class="page-title">VIP Dashboard</span>
    </div>

    <!-- User Active Stats -->
    <div class="hero-card">
        <div class="hero-content">
            <div class="hero-label">ACTIVE TEAM MEMBERS</div>
            <div class="hero-count" id="myRef">0</div>
            <small style="opacity:0.8;">Keep referring to unlock more!</small>
        </div>
    </div>

    <h4 class="section-title">Unlock Levels</h4>
    
    <!-- Level Container -->
    <div id="levelContainer">
        <div style="text-align:center; padding:40px; color:#666;">
            <i class="fas fa-circle-notch fa-spin fa-2x"></i><br><br>Loading Data...
        </div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // CONFIG
        const firebaseConfig = {
          apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g",
          authDomain: "art-paid-work001.firebaseapp.com",
          databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com",
          projectId: "art-paid-work001",
          storageBucket: "art-paid-work001.firebasestorage.app",
          messagingSenderId: "524647364992",
          appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let myActiveCount = 0;
        let claimedLevels = {};
        let vipLevelsData = [];

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                initVipSystem();
            } else {
                window.location.href = 'login_register.html';
            }
        });

        function initVipSystem() {
            // 1. Get Levels
            db.ref('settings/vip_levels').on('value', (snap) => {
                vipLevelsData = [];
                if(snap.exists()){
                    snap.forEach(c => vipLevelsData.push(c.val()));
                    vipLevelsData.sort((a,b) => a.level - b.level);
                }
                getUserData();
            });
        }

        function getUserData() {
            // 2. Get Claims
            db.ref('users/' + currentUser.uid + '/claimed_levels').on('value', (s) => {
                claimedLevels = s.val() || {};
                
                // 3. Get Active Referrals
                db.ref('users/' + currentUser.uid + '/ownCode').once('value', (codeSnap) => {
                    const code = codeSnap.val();
                    if(code) {
                        db.ref('users').orderByChild('referredBy').equalTo(code).on('value', (team) => {
                            let count = 0;
                            if(team.exists()) {
                                team.forEach(m => {
                                    if(m.val().status === 'active') count++;
                                });
                            }
                            myActiveCount = count;
                            
                            // Animate Number
                            animateValue("myRef", 0, myActiveCount, 1000);
                            renderUI();
                        });
                    } else {
                        renderUI();
                    }
                });
            });
        }

        function renderUI() {
            const container = document.getElementById('levelContainer');
            container.innerHTML = "";

            if(vipLevelsData.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#555;'>No levels configured.</p>";
                return;
            }

            vipLevelsData.forEach((lvl, index) => {
                // Logic
                const percent = Math.min((myActiveCount / lvl.target) * 100, 100);
                const isUnlocked = myActiveCount >= lvl.target;
                const isClaimed = claimedLevels['level'+lvl.level] === true;

                if(isUnlocked && !isClaimed) autoClaim(lvl.level, lvl.bonus);

                // Styling determination
                let stateClass = "locked";
                let statusHtml = `<div class="status-pill st-lock"><i class="fas fa-lock"></i> Locked</div>`;
                let icon = `<i class="fas fa-lock" style="color:#777"></i>`;
                let progressText = `${myActiveCount}/${lvl.target}`;

                if (isClaimed) {
                    stateClass = "completed";
                    statusHtml = `<div class="status-pill st-done"><i class="fas fa-check-circle"></i> Paid Successfully</div>`;
                    icon = `<i class="fas fa-gift" style="color:#00e676"></i>`;
                } else if (!isClaimed && !isUnlocked) {
                    stateClass = "running";
                    statusHtml = `<div class="status-pill st-run"><i class="fas fa-running"></i> In Progress</div>`;
                    icon = `<i class="fas fa-star" style="color:#f1c40f"></i>`;
                }

                // Add Animation Delay for staggered effect
                const delay = index * 0.1; 

                const html = `
                    <div class="vip-card ${stateClass}" style="animation-delay: ${delay}s">
                        <div class="card-top">
                            <div style="display:flex; align-items:center;">
                                <div class="icon-box" style="background:rgba(255,255,255,0.05);">${icon}</div>
                                <span class="lvl-badge">LEVEL ${lvl.level}</span>
                            </div>
                            <span class="reward-amount">৳${lvl.bonus}</span>
                        </div>

                        <div class="card-footer">
                            <span>Target: ${lvl.target} Active</span>
                            <span>${Math.floor(percent)}%</span>
                        </div>

                        <div class="progress-container">
                            <div class="progress-bar" style="width: ${percent}%"></div>
                        </div>
                        
                        ${statusHtml}
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function autoClaim(lvl, amount) {
            const k = 'level'+lvl;
            if(claimedLevels[k]) return;
            claimedLevels[k] = true;

            db.ref('users/'+currentUser.uid).transaction(u => {
                if(u) {
                    if(!u.claimed_levels) u.claimed_levels = {};
                    if(u.claimed_levels[k]) return;
                    u.balance = (u.balance || 0) + amount;
                    u.claimed_levels[k] = true;
                }
                return u;
            });
        }

        // Cool Number Animation
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }
    </script>
</body>
</html>
