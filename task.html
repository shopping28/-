<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tasks</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; padding: 20px; }
        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back { color: #aaa; text-decoration: none; font-size: 1.1rem; }
        .balance-show { text-align: center; background: #1a1a2e; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .task-item { background: #1a1a2e; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,25F5,255,0.05); }
        .task-left h4 { margin: 0 0 5px 0; }
        .badge { background: rgba(0,242,96,0.1); color: #00f260; padding: 3px 8px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; }
        button.task-btn { border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; min-width: 110px; text-align: center; }
        .start-btn { background: linear-gradient(45deg, #00f260, #0575E6); color: white; }
        .wait-btn { background: #4a4a4a; color: #ccc; cursor: not-allowed; font-size: 0.9rem; }
        #toast { visibility: hidden; min-width: 250px; background-color: #00f260; color: #000; text-align: center; border-radius: 5px; padding: 16px; position: fixed; z-index: 1; bottom: 30px; left: 50%; transform: translateX(-50%); font-weight: bold; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>
    <div class="header"><a href="home.html" class="back"><i class="fas fa-arrow-left"></i> Dashboard</a></div>
    <div class="balance-show">
        <small style="color:#aaa;">Your Balance</small>
        <h2 style="margin:5px; color:#00f260;">৳ <span id="liveBal">0.00</span></h2>
    </div>
    <h3 style="border-bottom:1px solid #333; padding-bottom:10px;">Available Tasks</h3>
    <div id="taskList"><p style="text-align:center; color:#666;">Loading tasks...</p></div>
    <div id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // --- ফাইনাল ডিবাগিং কোড ---
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        let currentUser = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log("স্টেপ ১: ব্যবহারকারী সফলভাবে লগইন করেছে। UID:", user.uid);
                currentUser = user;
                loadBalance();
                loadTasksForUser();
            } else {
                console.error("গুরুতর সমস্যা: ব্যবহারকারী লগইন করেনি। login_register.html এ পাঠানো হচ্ছে।");
                window.location.href = 'login_register.html';
            }
        });

        function loadBalance() {
            if (!currentUser) return;
            db.ref('users/' + currentUser.uid + '/balance').on('value', (snap) => {
                document.getElementById('liveBal').innerText = (snap.val() || 0).toFixed(2);
            });
        }

        async function loadTasksForUser() {
            if (!currentUser) return;
            const list = document.getElementById('taskList');
            list.innerHTML = "";

            const tasksSnapshot = await db.ref('tasks').once('value');
            if (!tasksSnapshot.exists()) {
                list.innerHTML = '<p>No tasks available.</p>'; return;
            }
            const allTasks = tasksSnapshot.val();

            const completedRef = db.ref(`users/${currentUser.uid}/completed_tasks`);
            console.log("স্টেপ ২: এই পথ থেকে ডাটা পড়া হচ্ছে:", completedRef.toString());
            const completedSnapshot = await completedRef.once('value');
            const completedTasks = completedSnapshot.val() || {};
            console.log("স্টেপ ৩: ব্যবহারকারীর সম্পন্ন করা টাস্কের তালিকা:", completedTasks);

            for (const key in allTasks) {
                const t = allTasks[key];
                const item = document.createElement('div');
                item.className = 'task-item';
                item.innerHTML = `<div class="task-left"><h4>${t.title}</h4><span class="badge">+ ৳${t.reward}</span></div><button class="task-btn" id="btn-${key}"></button>`;
                list.appendChild(item);
                updateButtonState(item.querySelector(`#btn-${key}`), key, t, completedTasks[key]);
            }
        }

        function updateButtonState(btn, key, taskData, completionTime) {
            if (completionTime) {
                const timeLimit = 36 * 60 * 60 * 1000;
                const timePassed = Date.now() - completionTime;
                if (timePassed < timeLimit) {
                    const remaining = timeLimit - timePassed;
                    const h = Math.floor(remaining / 3600000);
                    const m = Math.floor((remaining % 3600000) / 60000);
                    btn.className = "task-btn wait-btn";
                    btn.disabled = true;
                    btn.innerText = `Wait ${h}h ${m}m`;
                } else {
                    setStartButton(btn, key, taskData);
                }
            } else {
                setStartButton(btn, key, taskData);
            }
        }

        function setStartButton(btn, key, taskData) {
            btn.className = "task-btn start-btn";
            btn.innerText = "START";
            btn.disabled = false;
            btn.onclick = () => visitAndClaim(key, taskData.reward, taskData.link);
        }

        function visitAndClaim(key, reward, link) {
            const btn = document.getElementById(`btn-${key}`);
            btn.disabled = true;

            if (link && link.startsWith('http')) window.open(link, '_blank');

            const completedRef = db.ref(`users/${currentUser.uid}/completed_tasks/${key}`);
            console.log("স্টেপ ৪: এই পথে ডাটা লেখার চেষ্টা করা হচ্ছে:", completedRef.toString());

            db.ref('users/' + currentUser.uid + '/balance').transaction((bal) => (bal || 0) + reward)
            .then(() => completedRef.set(firebase.database.ServerValue.TIMESTAMP))
            .then(() => {
                console.log("স্টেপ ৫ (সফল): ডাটাবেসে সফলভাবে লেখা হয়েছে।");
                showToast(`৳${reward} claimed!`);
                loadTasksForUser(); // সফল হলে লিস্ট আবার লোড হবে
            })
            .catch((error) => {
                console.error("স্টেপ ৫ (ব্যর্থ): ডাটাবেসে লিখতে সমস্যা হয়েছে!", error.message);
                showToast("Error! Claim Failed.");
                btn.disabled = false;
            });
        }

        function showToast(message) {
            const x = document.getElementById("toast");
            x.innerText = message;
            x.className = "show";
            setTimeout(() => { x.className = x.className.replace("show", ""); }, 3000);
        }
    </script>
</body>
</html>
