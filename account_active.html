<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0c29; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; color: white; }
        .container { background: #1a1a2e; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #333; box-shadow: 0 10px 40px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        .header { text-align: center; margin-bottom: 20px; }
        
        .pay-box { background: linear-gradient(135deg, #2ecc71, #27ae60); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; position: relative; }
        .amount { font-size: 2.2rem; font-weight: bold; margin: 5px 0; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        .wallet-box { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px dashed rgba(255,255,255,0.5); }
        .wallet-address { font-family: monospace; word-break: break-all; font-size: 0.85rem; color: #fff; margin-bottom: 8px; display: block; }
        .copy-btn { background: white; color: #27ae60; border: none; padding: 5px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #ccc; }
        input, select { width: 100%; padding: 12px; background: #0f0c29; border: 1px solid #444; color: white; border-radius: 8px; margin-bottom: 15px; outline: none; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 15px; background: #00f260; color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        .submit-btn:disabled { background: #555; cursor: not-allowed; }
        
        .logout-btn { background: none; border: 1px solid #ff4757; color: #ff4757; padding: 5px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }
        
        /* Loader */
        #overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; z-index: 10; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .loader-ring { width: 50px; height: 50px; border: 4px solid #333; border-top: 4px solid #00f260; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #mainContent { display: none; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Loading -->
        <div id="loadingInit" style="text-align:center;">
            <div class="loader-ring" style="margin: 0 auto 10px auto;"></div>
            <p>Loading Wallet Info...</p>
        </div>

        <div id="mainContent">
            <div class="header">
                <h2>Activate Account</h2>
                <p style="font-size: 0.85rem; color: #aaa;">Send exact amount to the address below</p>
            </div>

            <!-- Payment Details Card -->
            <div class="pay-box">
                <small>Activation Fee (USDT)</small>
                <div class="amount" id="dispFee">...</div>
                
                <small>Send USDT (BEP20) to:</small>
                <div class="wallet-box">
                    <span class="wallet-address" id="adminWallet">Loading...</span>
                    <button class="copy-btn" onclick="copyAddress()"><i class="fas fa-copy"></i> Copy Address</button>
                </div>
            </div>

            <form onsubmit="event.preventDefault(); submitRequest();">
                <label>Your Wallet Address (Sender)</label>
                <input type="text" id="senderWallet" placeholder="0x..." required>
                
                <label>Transaction Hash (TxID)</label>
                <input type="text" id="trxId" placeholder="Paste TxID here" required>
                
                <button type="submit" id="btnSubmit" class="submit-btn">Confirm Payment</button>
            </form>
            
            <button onclick="logout()" class="logout-btn">Cancel & Logout</button>
        </div>
        
        <!-- Status Overlay -->
        <div id="overlay">
            <div id="pendingState">
                <div class="loader-ring"></div>
                <h3>Verifying...</h3>
                <h2 style="color:#f39c12;">PENDING</h2>
                <p style="color:#aaa; font-size:0.8rem;">Admin is checking your USDT transaction.<br>Please wait.</p>
                <button onclick="logout()" class="logout-btn" style="margin-top:20px;">Logout</button>
            </div>
            <div id="successState" style="display:none;">
                <i class="fas fa-check-circle" style="font-size:4rem; color:#00f260;"></i>
                <h2 style="color:#00f260;">Activated!</h2>
                <p>Welcome to Dashboard.</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDzEo1rLM6xwz8O4iEYIOvFi4JZQG_TJ0g", authDomain: "art-paid-work001.firebaseapp.com", databaseURL: "https://art-paid-work001-default-rtdb.firebaseio.com", projectId: "art-paid-work001", storageBucket: "art-paid-work001.firebasestorage.app", messagingSenderId: "524647364992", appId: "1:524647364992:web:c91b2dc55ab9b30d3ba965" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        
        let currentUser = null;
        let feeAmount = 0;
        let activeAdminWallet = "";

        // Load Data from Firebase
        db.ref('settings/payment').on('value', (snap) => {
            const data = snap.val();
            if(data) { 
                feeAmount = data.fee;
                
                // Handle Multiple Wallets (Pick Random or First)
                if(data.wallets && Array.isArray(data.wallets) && data.wallets.length > 0) {
                    // Selecting a random wallet to distribute traffic or just the first one
                    const randomIndex = Math.floor(Math.random() * data.wallets.length);
                    activeAdminWallet = data.wallets[randomIndex];
                } else {
                    activeAdminWallet = "Admin has not set a wallet yet.";
                }

                // Update UI
                document.getElementById('dispFee').innerText = "$" + feeAmount; 
                document.getElementById('adminWallet').innerText = activeAdminWallet; 
            }
        });

        // Auth Listener
        auth.onAuthStateChanged((user) => {
            if (user) { 
                currentUser = user;
                // Check Status
                db.ref('users/' + user.uid + '/status').on('value', (snap) => {
                    if (snap.val() === 'active') {
                        showSuccess();
                    } else {
                        document.getElementById('loadingInit').style.display = 'none';
                        document.getElementById('mainContent').style.display = 'block';
                        checkPendingRequest(user.uid);
                    }
                });
            } else { 
                window.location.href = 'login_register.html'; 
            }
        });

        function checkPendingRequest(uid) {
            db.ref('activation_requests').orderByChild('uid').equalTo(uid).limitToLast(1).once('value', s => {
                s.forEach(c => {
                    if(c.val().status === 'pending') {
                        document.getElementById('overlay').style.display = 'flex';
                        document.getElementById('pendingState').style.display = 'flex';
                    }
                });
            });
        }

        function copyAddress() { 
            navigator.clipboard.writeText(activeAdminWallet); 
            alert("Wallet Address Copied!"); 
        }

        function submitRequest() {
            if(!activeAdminWallet || activeAdminWallet.includes("not set")) return alert("Admin wallet not ready.");
            
            const sender = document.getElementById('senderWallet').value.trim();
            const trx = document.getElementById('trxId').value.trim();
            const btn = document.getElementById('btnSubmit');

            if(!sender || !trx) return alert("Please fill all fields");

            btn.disabled = true; btn.innerText = "Submitting...";

            db.ref('activation_requests').push({
                uid: currentUser.uid,
                method: "USDT BEP20",
                adminWallet: activeAdminWallet, // Record which wallet they saw
                senderWallet: sender,
                trxId: trx,
                amount: feeAmount,
                status: 'pending',
                timestamp: Date.now()
            }).then(() => {
                document.getElementById('overlay').style.display = 'flex';
                document.getElementById('pendingState').style.display = 'flex';
            }).catch((e) => { 
                alert(e.message); 
                btn.disabled = false; btn.innerText = "Confirm Payment"; 
            });
        }

        function showSuccess() {
            document.getElementById('overlay').style.display = 'flex'; 
            document.getElementById('pendingState').style.display = 'none'; 
            document.getElementById('successState').style.display = 'block';
            document.getElementById('loadingInit').style.display = 'none';
            document.getElementById('mainContent').style.display = 'none';
            setTimeout(() => window.location.href = 'home.html', 2000);
        }

        function logout() {
            auth.signOut().then(() => window.location.href = 'login_register.html');
        }
    </script>
</body>
</html>
