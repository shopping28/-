<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* General Body & Container */
        body { background: #0f0c29; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; color: white; }
        .container { background: #1a1a2e; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #333; box-shadow: 0 10px 40px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        .header { text-align: center; margin-bottom: 20px; }
        
        /* Payment Box */
        .pay-box { background: linear-gradient(135deg, #2ecc71, #27ae60); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; position: relative; }
        .amount { font-size: 2.2rem; font-weight: bold; margin: 5px 0; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        .wallet-box { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px dashed rgba(255,255,255,0.5); }
        .wallet-address { font-family: monospace; word-break: break-all; font-size: 0.85rem; color: #fff; margin-bottom: 8px; display: block; }
        .copy-btn { background: white; color: #27ae60; border: none; padding: 5px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        
        /* Form Elements */
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #ccc; }
        input { width: 100%; padding: 12px; background: #0f0c29; border: 1px solid #444; color: white; border-radius: 8px; margin-bottom: 15px; outline: none; box-sizing: border-box; }
        input:focus { border-color: #27ae60; }

        .submit-btn { width: 100%; padding: 15px; background: #00f260; color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .submit-btn:disabled { background: #555; cursor: not-allowed; }
        
        .logout-btn { background: none; border: 1px solid #ff4757; color: #ff4757; padding: 5px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }

        /* OVERLAY CSS */
        #overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 41, 0.95); backdrop-filter: blur(8px);
            z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px; border-radius: 20px; text-align: center; max-width: 350px; width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .premium-loader {
            width: 70px; height: 70px; border-radius: 50%;
            background: conic-gradient(#0000 10%, #f39c12);
            -webkit-mask: radial-gradient(farthest-side,#0000 calc(100% - 8px),#000 0);
            animation: rotate 1s infinite linear; margin-bottom: 5px;
        }
        @keyframes rotate {to{transform: rotate(1turn)}}
        .status-title { font-size: 1.4rem; font-weight: 700; color: white; margin: 0; }
        .status-badge {
            background: rgba(243, 156, 18, 0.15); color: #f39c12; padding: 5px 15px;
            border-radius: 20px; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px;
            border: 1px solid rgba(243, 156, 18, 0.3);
        }
        .status-desc { color: #aaa; font-size: 0.9rem; line-height: 1.5; margin: 0; }
        .logout-btn-overlay {
            background: transparent; border: 1px solid #e74c3c; color: #e74c3c;
            padding: 10px 30px; border-radius: 50px; font-weight: 600; cursor: pointer;
            transition: 0.3s; font-size: 0.9rem; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Loading -->
        <div id="loadingInit" style="text-align:center; padding: 20px;">
            <p>Loading Wallet Info...</p>
        </div>

        <!-- Main Form -->
        <div id="mainContent" style="display:none;">
            <div class="header">
                <h2>Activate Account</h2>
                <p style="font-size: 0.85rem; color: #aaa;">Deposit via USDT (BEP20)</p>
            </div>

            <div class="pay-box">
                <small>Activation Fee</small>
                <div class="amount" id="dispFee">$...</div>
                
                <small>Send USDT to Address:</small>
                <div class="wallet-box">
                    <span class="wallet-address" id="adminWallet">Loading...</span>
                    <button class="copy-btn" onclick="copyAddress()"><i class="fas fa-copy"></i> Copy</button>
                </div>
            </div>

            <form onsubmit="event.preventDefault(); submitRequest();">
                <label>Your Sender Wallet Address</label>
                <input type="text" id="senderWallet" placeholder="e.g. 0x123..." required>
                
                <label>Transaction ID (TrxID)</label>
                <input type="text" id="trxId" placeholder="Paste TxID from Binance/TrustWallet" required>
                
                <button type="submit" id="btnSubmit" class="submit-btn">Submit for Review</button>
            </form>
            
            <button onclick="logout()" class="logout-btn">Cancel & Logout</button>
        </div>
        
        <!-- OVERLAY (Status) -->
        <div id="overlay">
            <div id="pendingState" class="status-card">
                <div class="premium-loader"></div>
                <h2 class="status-title">Verifying Payment</h2>
                <div class="status-badge">PENDING</div>
                <p class="status-desc">Admin is checking your USDT transaction.<br>Please wait.</p>
                <button onclick="logout()" class="logout-btn-overlay"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>

            <div id="successState" class="status-card" style="display:none; border-color: rgba(0, 242, 96, 0.3);">
                <i class="fas fa-check-circle" style="font-size:4.5rem; color:#00f260; margin-bottom:15px;"></i>
                <h2 class="status-title" style="color:#00f260;">Activation Successful!</h2>
                <p class="status-desc">Redirecting to Dashboard...</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBEEkp40hJF81XaLVa9DNPWX-aDy_0oEUE",
            authDomain: "shopping28-84906.firebaseapp.com",
            databaseURL: "https://shopping28-84906-default-rtdb.firebaseio.com",
            projectId: "shopping28-84906",
            storageBucket: "shopping28-84906.firebasestorage.app",
            messagingSenderId: "252107906792",
            appId: "1:252107906792:web:d39b0be25c88e07015b35d"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        
        let currentUser = null;
        let feeAmount = 0;
        let activeAdminWallet = "";

        // 1. FETCH PAYMENT SETTINGS (Fixed Logic)
        db.ref('settings/payment').on('value', (snap) => {
            const data = snap.val();
            if(data) { 
                feeAmount = data.fee;
                // FIX: Directly reading 'wallet' string, not array
                activeAdminWallet = data.wallet || "Not Set"; 
                
                document.getElementById('dispFee').innerText = "$" + feeAmount; 
                document.getElementById('adminWallet').innerText = activeAdminWallet; 
            }
        });

        // 2. AUTH STATE
        auth.onAuthStateChanged((user) => {
            if (user) { 
                currentUser = user;
                db.ref('users/' + user.uid + '/status').on('value', (snap) => {
                    const status = snap.val();
                    if (status === 'active') {
                        showSuccess();
                    } else {
                        checkPendingRequest(user.uid);
                    }
                });
            } else { 
                window.location.href = 'login_register.html'; 
            }
        });

        function checkPendingRequest(uid) {
            db.ref('activation_requests').orderByChild('uid').equalTo(uid).limitToLast(1).once('value', s => {
                let isPending = false;
                s.forEach(c => {
                    if(c.val().status === 'pending') isPending = true;
                });

                document.getElementById('loadingInit').style.display = 'none';
                
                if(isPending) {
                    document.getElementById('mainContent').style.display = 'none';
                    document.getElementById('overlay').style.display = 'flex';
                    document.getElementById('pendingState').style.display = 'flex';
                } else {
                    document.getElementById('mainContent').style.display = 'block';
                    document.getElementById('overlay').style.display = 'none';
                }
            });
        }

        function copyAddress() { 
            navigator.clipboard.writeText(activeAdminWallet); 
            alert("Wallet Address Copied!"); 
        }

        function submitRequest() {
            if(!activeAdminWallet || activeAdminWallet === "Not Set") return alert("Admin wallet not set yet. Contact support.");
            
            const sender = document.getElementById('senderWallet').value.trim();
            const trx = document.getElementById('trxId').value.trim();
            const btn = document.getElementById('btnSubmit');

            if(!sender || !trx) return alert("Please fill both Sender Wallet and TrxID");

            btn.disabled = true; btn.innerText = "Submitting...";

            db.ref('activation_requests').push({
                uid: currentUser.uid,
                method: "USDT BEP20",
                adminWallet: activeAdminWallet,
                senderWallet: sender,
                trxId: trx,
                amount: feeAmount,
                status: 'pending',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                document.getElementById('mainContent').style.display = 'none';
                document.getElementById('overlay').style.display = 'flex';
                document.getElementById('pendingState').style.display = 'flex';
            }).catch((e) => { 
                alert("Error: " + e.message); 
                btn.disabled = false; btn.innerText = "Submit for Review"; 
            });
        }

        function showSuccess() {
            document.getElementById('loadingInit').style.display = 'none';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('overlay').style.display = 'flex'; 
            document.getElementById('pendingState').style.display = 'none'; 
            document.getElementById('successState').style.display = 'flex';
            
            setTimeout(() => window.location.href = 'home.html', 2500);
        }

        function logout() {
            auth.signOut().then(() => window.location.href = 'login_register.html');
        }
    </script>
</body>
</html>
